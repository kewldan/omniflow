name: Bug report
description: Report a reproducible Omniflow defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, customer data, payment payloads, or access links. Report vulnerabilities privately.
  - type: input
    id: version
    attributes:
      label: Omniflow version
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Sanitized environment details
