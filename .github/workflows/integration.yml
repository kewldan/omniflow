name: Integration

# The Testcontainers suite is the slowest gate by far — over twenty minutes
# under -race — and it held every push to main, documentation included. It
# runs nightly against main and on demand instead: before a release pull
# request is merged, and whenever a change is worth checking right away.
#
#   gh workflow run integration.yml --ref main
#
# A pull request release-please opens cannot start it: GitHub does not run
# workflows for events the default GITHUB_TOKEN caused, which is why the
# release process runs it by hand before the merge.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    name: Integration (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache: true
      - run: go mod download
      # Testcontainers starts PostgreSQL itself, applies the committed
      # migrations, and exercises the repositories, the outbox, the durable-job
      # enqueue, and the concurrency limits against a real database. Each test
      # starts its own database.
      - run: go test -tags=integration -race -timeout=50m ./internal/integrationtest/...
