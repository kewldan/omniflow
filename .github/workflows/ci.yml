name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache: true
      - run: go mod download
      - run: go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
      - run: go tool sqlc generate
      - run: gofmt -w . && git diff --exit-code
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool govulncheck ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bun run generate:api
      - run: git diff --exit-code
      - run: bun run check
      - run: bun run build
      # The budget reads the build that just happened. It had never run
      # anywhere: the script was written, committed, and wired to a package
      # script no job invoked, so every figure it guards had been free to drift
      # since it was added.
      - run: bun --filter @omniflow/web perf:budget

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # The suite runs against a real API rather than the web application alone.
    # Without one, every panel still renders, still refuses anonymous visitors,
    # and still passes the accessibility and layout gates while being unable to
    # complete a single request — which is exactly how a browser-to-API routing
    # break reached a release: nothing in the suite had ever made a call.
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: omniflow
          POSTGRES_USER: omniflow
          POSTGRES_PASSWORD: omniflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omniflow -d omniflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_DATABASE_URL: postgres://omniflow:omniflow@localhost:5432/omniflow?sslmode=disable
      APP_VALKEY_URL: redis://localhost:6379/0
      # Test-only values. The panels refuse to run without them, and the cookie
      # flags are off because the suite speaks plain HTTP to localhost.
      # The fallback decodes to exactly 32 bytes — "omniflow-ci-development-only-key".
      # Anything else exits the API with "APP_DATA_ENCRYPTION_KEY must be
      # base64-encoded 32 bytes" before it ever binds a port.
      APP_DATA_ENCRYPTION_KEY: ${{ vars.CI_DATA_ENCRYPTION_KEY || 'b21uaWZsb3ctY2ktZGV2ZWxvcG1lbnQtb25seS1rZXk=' }}
      # The commerce runtime refuses to start without all five of these, so a
      # panel gate cannot be run without them either. No Remnawave runs in CI:
      # the address is syntactically valid and answers nothing, which is enough
      # because the client makes no call while it is being constructed. The
      # readiness probe reports Remnawave down, and the panel pages backed by it
      # render their own error state — which is what this suite is checking they
      # do, rather than checking Remnawave.
      APP_OPERATOR_TOKEN: e2e-operator-token
      APP_REMNAWAVE_URL: http://127.0.0.1:3999
      APP_REMNAWAVE_TOKEN: e2e-remnawave-token
      APP_ADMIN_PANEL_ENABLED: "true"
      APP_CUSTOMER_PANEL_ENABLED: "true"
      APP_ADMIN_COOKIE_SECURE: "false"
      APP_CUSTOMER_COOKIE_SECURE: "false"
      APP_TELEMETRY_ENABLED: "false"
      APP_HTTP_ADDR: ":8080"
      # The web server proxies /v1 to the API, which is what makes the browser's
      # same-origin calls reach it.
      API_INTERNAL_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: ariga/setup-atlas@v0
      - run: atlas migrate apply --dir file://database/migrations --url "$APP_DATABASE_URL"
      - name: Start the API
        run: |
          go build -o /tmp/omniflow-api ./cmd/api
          /tmp/omniflow-api > /tmp/api.log 2>&1 &
          API_PID=$!
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/livez >/dev/null 2>&1 && break
            # A configuration error kills the process immediately. Without this
            # the loop waits out its full minute and reports a refused
            # connection, which hides the line the API actually printed.
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "the API exited before it served /livez:"
              cat /tmp/api.log
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/livez
      - name: Seed the first operator
        id: seed
        run: |
          # The API mints a one-time setup token when no administrator exists
          # and logs it; redeeming it here is what gives the browser suite an
          # account to sign in with.
          TOKEN=$(grep -o '"token":"[^"]*"' /tmp/api.log | head -1 | cut -d'"' -f4)
          if [ -z "$TOKEN" ]; then
            echo "no setup token was logged; the API did not start clean"
            cat /tmp/api.log
            exit 1
          fi
          curl -fsS -X POST http://127.0.0.1:8080/v1/panel/bootstrap \
            -H 'Content-Type: application/json' \
            -d "{\"setupToken\":\"$TOKEN\",\"email\":\"e2e@omniflow.test\",\"displayName\":\"E2E Operator\",\"password\":\"e2e-operator-passphrase-2026\",\"locale\":\"en\"}"
      - run: bun ci
      # The suite runs against a production build rather than the dev server:
      # Next.js behaves differently in development, and a gate that passes
      # against a build nobody ships is not a gate.
      - run: bun run build
      # No `run` between the filter and the script name. Bun treats it as the
      # script to look for, finds no package defining one called "run", and
      # reports "No packages matched the filter" — which reads as a bad filter
      # and is why this job failed silently for several releases.
      - run: bun --filter @omniflow/web e2e:install
      - run: bun --filter @omniflow/web e2e
        env:
          PANEL_EMAIL: e2e@omniflow.test
          PANEL_PASSWORD: e2e-operator-passphrase-2026
      - name: The API log, when something failed
        if: failure()
        run: tail -100 /tmp/api.log
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  integration:
    name: Integration (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache: true
      - run: go mod download
      # Testcontainers starts PostgreSQL itself, applies the committed
      # migrations, and exercises the repositories, the outbox, the durable-job
      # enqueue, and the concurrency limits against a real database.
      - run: go test -tags=integration -race -timeout=20m ./internal/integrationtest/...

  migrations:
    name: Atlas migrations
    runs-on: ubuntu-latest
    strategy:
      # Every supported baseline is the empty database plus a prefix of the
      # migration history, so applying each prefix and then the rest proves an
      # installation can upgrade from any released version.
      matrix:
        baseline:
          - "20260810160000_initial.sql"
          - "20260810190000_bot_self_service.sql"
          - "20260810220000_commerce.sql"
          - "20260811000000_telegram_commerce.sql"
          - ""
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: omniflow
          POSTGRES_USER: omniflow
          POSTGRES_PASSWORD: omniflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omniflow -d omniflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: ariga/setup-atlas@v0
      - run: atlas migrate validate --dir file://database/migrations
      - name: Apply the baseline
        if: matrix.baseline != ''
        run: |
          atlas migrate apply --dir file://database/migrations \
            --url "postgres://omniflow:omniflow@localhost:5432/omniflow?sslmode=disable" \
            --to-version "${BASELINE%%_*}"
        env:
          BASELINE: ${{ matrix.baseline }}
      - name: Upgrade to head
        run: atlas migrate apply --dir file://database/migrations --url "postgres://omniflow:omniflow@localhost:5432/omniflow?sslmode=disable"
      - name: Re-applying head is a no-op
        run: atlas migrate apply --dir file://database/migrations --url "postgres://omniflow:omniflow@localhost:5432/omniflow?sslmode=disable"

  compose:
    name: Compose and reverse proxies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The stack reads its configuration from .env, which is never committed.
      # The example file is the documented starting point, so validating
      # against it also proves the example stays usable.
      - name: Seed the environment from the committed example
        run: cp .env.example .env
      - name: Validate the base compose file
        run: docker compose -f compose.yaml config --quiet
      - name: Validate the Traefik overlay
        run: docker compose -f compose.yaml -f deploy/proxies/traefik.compose.yaml config --quiet
        env:
          ACME_EMAIL: ci@example.com
          WEB_DOMAIN: web.example.com
          API_DOMAIN: api.example.com
          BOT_WEBHOOK_DOMAIN: bot.example.com
      - name: Validate the Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/proxies/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e ACME_EMAIL=ci@example.com -e WEB_DOMAIN=web.example.com \
            -e API_DOMAIN=api.example.com -e BOT_WEBHOOK_DOMAIN=bot.example.com \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      # Validating that the file parses and that the images build cannot see
      # where a byte written to the database ends up, which is how the stack
      # shipped with the database in an anonymous volume rather than in the
      # named one operators are told to back up. This writes a row, recreates
      # the container, and reads it back.
      - name: The database lands in the volume operators back up
        run: sh tools/volume-drill.sh

      - name: Build the images the stack runs
        run: |
          docker compose -f compose.yaml build api bot worker

  docs:
    name: Mintlify docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: docs
        run: bunx mint@latest validate
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      # Scoped to the English tree. `mint broken-links` resolves every link
      # against the default language, so a correct `/ru/...` link on a Russian
      # page is reported as broken even though the page is served at that URL.
      # The Russian tree is checked by the step below instead.
      - working-directory: docs
        run: >
          bunx mint@latest broken-links --check-anchors
          --files "*.mdx" "architecture/**/*.mdx" "commerce/**/*.mdx"
          "customer/**/*.mdx" "getting-started/**/*.mdx"
          "integrations/**/*.mdx" "operations/**/*.mdx" "contributing/**/*.mdx"
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Russian tree mirrors English and its links resolve
        working-directory: docs
        run: sh scripts/check-russian-mirror.sh

  conventional-pr:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
