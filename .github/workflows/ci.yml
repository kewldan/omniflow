name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - run: go mod download
      - run: go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
      - run: go tool sqlc generate
      - run: gofmt -w . && git diff --exit-code
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool govulncheck ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bun run generate:api
      - run: git diff --exit-code
      - run: bun run check
      - run: bun run build

  migrations:
    name: Atlas migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: omniflow
          POSTGRES_USER: omniflow
          POSTGRES_PASSWORD: omniflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omniflow -d omniflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: ariga/setup-atlas@v0
      - run: atlas migrate validate --dir file://database/migrations
      - run: atlas migrate apply --dir file://database/migrations --url "postgres://omniflow:omniflow@localhost:5432/omniflow?sslmode=disable"

  docs:
    name: Mintlify docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: docs
        run: bunx mint@latest validate
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - working-directory: docs
        run: bunx mint@latest broken-links --check-anchors
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

  conventional-pr:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
