name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: true
      - run: go mod download
      - run: go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
      - run: go tool sqlc generate
      - run: gofmt -w . && git diff --exit-code
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool govulncheck ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bun run generate:api
      - run: git diff --exit-code
      - run: bun run check
      - run: bun run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      # The suite runs against a production build rather than the dev server:
      # Next.js behaves differently in development, and a gate that passes
      # against a build nobody ships is not a gate.
      - run: bun run build
      # No `run` between the filter and the script name. Bun treats it as the
      # script to look for, finds no package defining one called "run", and
      # reports "No packages matched the filter" — which reads as a bad filter
      # and is why this job failed silently for several releases.
      - run: bun --filter @omniflow/web e2e:install
      - run: bun --filter @omniflow/web e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  integration:
    name: Integration (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: true
      - run: go mod download
      # Testcontainers starts PostgreSQL itself, applies the committed
      # migrations, and exercises the repositories, the outbox, the durable-job
      # enqueue, and the concurrency limits against a real database.
      - run: go test -tags=integration -race -timeout=20m ./internal/integrationtest/...

  migrations:
    name: Atlas migrations
    runs-on: ubuntu-latest
    strategy:
      # Every supported baseline is the empty database plus a prefix of the
      # migration history, so applying each prefix and then the rest proves an
      # installation can upgrade from any released version.
      matrix:
        baseline:
          - "20260810160000_initial.sql"
          - "20260810190000_bot_self_service.sql"
          - "20260810220000_commerce.sql"
          - "20260811000000_telegram_commerce.sql"
          - ""
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: omniflow
          POSTGRES_USER: omniflow
          POSTGRES_PASSWORD: omniflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omniflow -d omniflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: ariga/setup-atlas@v0
      - run: atlas migrate validate --dir file://database/migrations
      - name: Apply the baseline
        if: matrix.baseline != ''
        run: |
          atlas migrate apply --dir file://database/migrations \
            --url "postgres://omniflow:omniflow@localhost:5432/omniflow?sslmode=disable" \
            --to-version "${BASELINE%%_*}"
        env:
          BASELINE: ${{ matrix.baseline }}
      - name: Upgrade to head
        run: atlas migrate apply --dir file://database/migrations --url "postgres://omniflow:omniflow@localhost:5432/omniflow?sslmode=disable"
      - name: Re-applying head is a no-op
        run: atlas migrate apply --dir file://database/migrations --url "postgres://omniflow:omniflow@localhost:5432/omniflow?sslmode=disable"

  compose:
    name: Compose and reverse proxies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The stack reads its configuration from .env, which is never committed.
      # The example file is the documented starting point, so validating
      # against it also proves the example stays usable.
      - name: Seed the environment from the committed example
        run: cp .env.example .env
      - name: Validate the base compose file
        run: docker compose -f compose.yaml config --quiet
      - name: Validate the Traefik overlay
        run: docker compose -f compose.yaml -f deploy/proxies/traefik.compose.yaml config --quiet
        env:
          ACME_EMAIL: ci@example.com
          WEB_DOMAIN: web.example.com
          API_DOMAIN: api.example.com
          BOT_WEBHOOK_DOMAIN: bot.example.com
      - name: Validate the Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/proxies/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e ACME_EMAIL=ci@example.com -e WEB_DOMAIN=web.example.com \
            -e API_DOMAIN=api.example.com -e BOT_WEBHOOK_DOMAIN=bot.example.com \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build the images the stack runs
        run: |
          docker compose -f compose.yaml build api bot worker

  docs:
    name: Mintlify docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: docs
        run: bunx mint@latest validate
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      # Scoped to the English tree. `mint broken-links` resolves every link
      # against the default language, so a correct `/ru/...` link on a Russian
      # page is reported as broken even though the page is served at that URL.
      # The Russian tree is checked by the step below instead.
      - working-directory: docs
        run: >
          bunx mint@latest broken-links --check-anchors
          --files "*.mdx" "architecture/**/*.mdx" "commerce/**/*.mdx"
          "customer/**/*.mdx" "getting-started/**/*.mdx"
          "integrations/**/*.mdx" "operations/**/*.mdx" "contributing/**/*.mdx"
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Russian tree mirrors English and its links resolve
        working-directory: docs
        run: sh scripts/check-russian-mirror.sh

  conventional-pr:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
