name: Release images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  # Gates the release: a failed dependency, secret, or license finding stops
  # images from being built and published at all. This is the difference
  # between the informational PR scan in security.yml and "enforced in
  # release CI" — the same tools, but this one fails the workflow.
  source-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: true
      - name: Dependency scan (govulncheck)
        run: go tool govulncheck ./...
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency and license scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,license
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # SAST: semantic analysis of the source itself, distinct from the
  # dependency-vulnerability scanning above.
  codeql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4

  images:
    needs: [source-scan, codeql]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: build/go.Dockerfile
            build_args: TARGET=api
          - image: bot
            dockerfile: build/go.Dockerfile
            build_args: TARGET=bot
          - image: worker
            dockerfile: build/go.Dockerfile
            build_args: TARGET=worker
          - image: web
            dockerfile: build/web.Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Sign image
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
      # Detection, not a pre-publish gate: the image is already at the
      # registry by this point. A multi-arch build cannot be scanned before
      # `docker/build-push-action` pushes it without a much more invasive
      # two-stage build, so a finding here fails the workflow rather than
      # blocking the push.
      - name: Scan the published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
