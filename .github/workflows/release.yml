name: Release images

on:
  push:
    # Both spellings, and the second is the one this repository actually
    # produces. release-please is configured with a package name, so it tags
    # `omniflow-v1.0.0` rather than `v1.0.0` — and because only `v*` was
    # listed, 1.0.0 was released with a changelog, a tag, and no images at all.
    # The source scan that "stops images from being published" never ran
    # either, which is the worse half: a gate nothing triggers reports nothing
    # and reads as a gate that passed.
    tags: ["v[0-9]*", "omniflow-v[0-9]*"]
  # Called by the release workflow the moment it cuts a release.
  #
  # This is the trigger that actually fires. A tag pushed by
  # release-please-action is pushed with the default GITHUB_TOKEN, and GitHub
  # deliberately does not start new workflow runs from events that token
  # caused — so the `push` trigger above cannot run for a release this
  # repository cuts, and never has. A `workflow_call` is a direct invocation
  # rather than an event, so it is not subject to that rule and needs no
  # personal access token to work around it. The tag trigger stays for a tag
  # pushed by a person.
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. omniflow-v1.0.0"
        required: true
        type: string
  # Lets a tag that already exists be built without cutting a new one. Dispatch
  # from the default branch — this file has to be the version being run — and
  # name the tag; every job checks that out rather than the branch.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. omniflow-v1.0.0"
        required: true
        type: string

env:
  RELEASE_REF: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  # Gates the release: a failed dependency, secret, or license finding stops
  # images from being built and published at all. This is the difference
  # between the informational PR scan in security.yml and "enforced in
  # release CI" — the same tools, but this one fails the workflow.
  source-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache: true
      - name: Dependency scan (govulncheck)
        run: go tool govulncheck ./...
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency and license scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,license
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # SAST: semantic analysis of the source itself, distinct from the
  # dependency-vulnerability scanning above.
  codeql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4

  images:
    needs: [source-scan, codeql]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: build/go.Dockerfile
            build_args: TARGET=api
          - image: bot
            dockerfile: build/go.Dockerfile
            build_args: TARGET=bot
          - image: worker
            dockerfile: build/go.Dockerfile
            build_args: TARGET=worker
          - image: web
            dockerfile: build/web.Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      # The image tags are derived from the release tag here rather than by
      # metadata-action's semver parser, which expects the tag to be the
      # version. Ours carries a package-name prefix, so it would either be
      # rejected or produce an image tagged with the prefix.
      - name: Resolve the version from the tag
        id: version
        run: |
          version="${RELEASE_REF##*v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$RELEASE_REF does not end in a version"; exit 1 ;;
          esac
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=${{ steps.version.outputs.minor }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Sign image
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
      # Detection, not a pre-publish gate: the image is already at the
      # registry by this point. A multi-arch build cannot be scanned before
      # `docker/build-push-action` pushes it without a much more invasive
      # two-stage build, so a finding here fails the workflow rather than
      # blocking the push.
      - name: Scan the published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
