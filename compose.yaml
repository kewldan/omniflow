name: omniflow

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: omniflow
      POSTGRES_USER: omniflow
      POSTGRES_PASSWORD: omniflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniflow -d omniflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]

  valkey:
    image: valkey/valkey:9.1.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  migrate:
    image: arigaio/atlas:1.3.0
    command: ["migrate", "apply", "--url", "postgres://omniflow:omniflow@postgres:5432/omniflow?sslmode=disable", "--dir", "file:///migrations"]
    volumes:
      - ./database/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: build/go.Dockerfile
      args:
        TARGET: api
    env_file: [.env]
    environment:
      APP_HTTP_ADDR: :8080
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks: [internal]

  bot:
    build:
      context: .
      dockerfile: build/go.Dockerfile
      args:
        TARGET: bot
        # The bot runs operator-initiated backups and restores, so its image
        # needs the matching PostgreSQL client tools.
        RUNTIME: postgres
    env_file: [.env]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    volumes:
      - backup-data:/var/lib/omniflow/backups
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: build/go.Dockerfile
      args:
        TARGET: worker
        # The worker takes the scheduled backups with pg_dump.
        RUNTIME: postgres
    env_file: [.env]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    volumes:
      - backup-data:/var/lib/omniflow/backups
    networks: [internal]

  web:
    profiles: [web]
    build:
      context: .
      dockerfile: build/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on: [api]
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  # Backups live outside the container filesystem so a rebuild never discards
  # them. They are encrypted at rest with APP_BACKUP_ENCRYPTION_KEY.
  backup-data:
