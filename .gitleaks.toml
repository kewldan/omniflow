# Secret scanning configuration.
#
# The release workflow treats a finding as fatal — it is the gate that stops
# images from being built at all — so this file exists to make the gate
# accurate, not to make it quiet. Nothing here disables a rule. The exceptions
# are literal values that are public by design, plus two test files whose whole
# purpose is to contain secret-shaped strings.
#
# The scan runs over history rather than the working tree, so an exception has
# to cover the value as it appeared in every commit that carried it. A secret
# that was once committed is not un-leaked by deleting it, which is why the
# superseded CI key is listed below alongside the current one.
#
# Two mechanics worth knowing before editing this file. Gitleaks 8.24 reads a
# single `[allowlist]` table — an array of `[[allowlists]]` parses without
# complaint and is then ignored, which reads exactly like an allowlist that
# works. And `regexes` are matched against the detected secret, not the line it
# sits on, so an entry written as surrounding context matches nothing.

title = "Omniflow secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Values that are public by design, and the two tests that exist to contain secret-shaped strings"

# Whole files, and only these two.
#
# Both exist to prove that values of exactly this shape — a bot token, a
# subscription link, an API key, a card number — are removed before anything
# leaves the installation. Neither can be written without containing them, and
# pinning each value by regex would mean editing this file every time somebody
# adds a case to a redaction test. Both carry a header saying every value in
# them is invented.
paths = [
  '''^internal/platform/redact_test\.go$''',
  '''^internal/airedact/airedact_test\.go$''',
]

regexes = [
  # The end-to-end job's test-only data encryption key, current and superseded.
  #
  # It is a literal in a public workflow on purpose: the API refuses to start
  # without a base64 32-byte key, so a browser gate cannot run without one, and
  # a value only some people can read would mean a job only some people can
  # run. The first decodes to the ASCII string omniflow-ci-development-only-key.
  # The second decoded to thirty-four bytes, which is why that job had never
  # once started the API; it stays listed because it is still in history.
  '''b21uaWZsb3ctY2ktZGV2ZWxvcG1lbnQtb25seS1rZXk=''',
  '''ZGV2ZWxvcG1lbnQtb25seS0zMi1ieXRlLWtleS0xMjM0NQ==''',

  # The RFC 6238 test vector: the base32 of the ASCII string
  # 12345678901234567890, published in the RFC itself so implementations can be
  # checked against the codes it lists. A TOTP implementation not containing it
  # would be one nobody had verified.
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',

  # Idempotency keys in the documented curl examples. An idempotency key is
  # chosen by the caller and carried in a header so a repeated submission
  # resolves to the record already created instead of a second one. It
  # authenticates nothing and grants nothing; publishing one is the example.
  '''^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z]+-[0-9a-f]{6}$''',
]
