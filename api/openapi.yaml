        id: {type: string, format: uuid}
        entitlementId: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        subscriptionId: {type: string, format: uuid}
        remnawaveUserId: {type: integer, format: int64}
        kind: {type: string}
        expected: {type: object, additionalProperties: true}
        observed: {type: object, additionalProperties: true}
        detectedAt: {type: string, format: date-time}
    PanelDriftList:
      type: object
      required: [items]
      properties: {items: {type: array, nullable: true, items: {$ref: "#/components/schemas/PanelDrift"}}}
    PanelOutboxEntry:
      type: object
      required: [id, topic, occurredAt, ageSeconds]
      properties:
        id: {type: string, format: uuid}
        topic: {type: string}
        occurredAt: {type: string, format: date-time}
        ageSeconds: {type: integer, format: int64}
    PanelOutboxList:
      type: object
      required: [items]
      properties: {items: {type: array, nullable: true, items: {$ref: "#/components/schemas/PanelOutboxEntry"}}}
    PanelTopUpSettings:
      type: object
      required: [enabled, currency, minimumMinor, maximumMinor, windowSeconds, windowLimitMinor]
      properties:
        enabled: {type: boolean}
        currency: {type: string}
        presetsMinor: {type: array, nullable: true, items: {type: integer, format: int64}, description: "Offered as buttons. Free entry stays available whatever this contains."}
        minimumMinor: {type: integer, format: int64, minimum: 1}
        maximumMinor: {type: integer, format: int64, minimum: 1}
        windowSeconds: {type: integer, format: int64, minimum: 1}
        windowLimitMinor: {type: integer, format: int64, minimum: 0}
    PanelSubscriptionSettings:
      type: object
      required: [multiEnabled, maxPerCustomer]
      properties:
        multiEnabled: {type: boolean}
        maxPerCustomer: {type: integer, minimum: 1}
    ThemeDocument:
      type: object
      description: >-
        An operator's overrides. Every field is optional, and an omitted one keeps
        the design's own value. A palette maps a themable token name to a hex
        colour and accepts nothing else, because these values are rendered into a
        style element.
      properties:
        light: {type: object, additionalProperties: {type: string}}
        dark: {type: object, additionalProperties: {type: string}}
        radius: {type: string, enum: [square, compact, default, rounded]}
        density: {type: string, enum: [compact, default, comfortable]}
        allowedThemes:
          type: array
          items: {type: string, enum: [light, dark]}
          description: "Which modes a visitor may switch between. One mode removes the switcher rather than leaving it inert."
        defaultTheme: {type: string, enum: [light, dark, system]}
    ThemeWarning:
      type: object
      required: [code, mode, foreground, background, ratio, blocking]
      properties:
        code: {type: string, enum: [pair_unreadable, pair_below_aa]}
        mode: {type: string, enum: [light, dark]}
        foreground: {type: string}
        background: {type: string}
        ratio: {type: number, description: "The WCAG contrast ratio, from 1 to 21."}
        blocking: {type: boolean, description: "True below 3:1, which refuses the save."}
    PanelTheme:
      type: object
      required: [theme, css, warnings, themable, version, updatedAt]
      properties:
        theme: {$ref: "#/components/schemas/ThemeDocument"}
        css: {type: string, description: "The declarations to inline. Empty when nothing has been customised."}
        warnings: {type: array, items: {$ref: "#/components/schemas/ThemeWarning"}}
        themable: {type: array, items: {type: string}, description: "The token names this build honours."}
        version: {type: integer}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: string, format: uuid}
    PanelBrandingAsset:
      type: object
      required: [kind, contentType, byteSize, checksum, updatedAt]
      properties:
        kind: {type: string, enum: [logo_light, logo_dark, favicon]}
        contentType: {type: string, enum: [image/png, image/jpeg, image/webp]}
        byteSize: {type: integer, format: int64}
        checksum: {type: string, description: "SHA-256 of the bytes, hex encoded. Published as the ETag of the asset."}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: string, format: uuid}
    PanelBrandingAssetList:
      type: object
      required: [items, kinds, contentTypes, maxBytes]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/PanelBrandingAsset"}}
        kinds: {type: array, items: {type: string}}
        contentTypes: {type: array, items: {type: string}}
        maxBytes: {type: integer}
    Branding:
      type: object
      required: [serviceName, css, radius, density, allowedThemes, defaultTheme, assets]
      properties:
        serviceName: {type: string, description: "Empty when the installation has not named itself."}
        css: {type: string}
        radius: {type: string}
        density: {type: string}
        allowedThemes: {type: array, items: {type: string}}
        defaultTheme: {type: string}
        assets:
          type: object
          description: "Slot name to an address carrying the image checksum. A slot with no image is absent."
          additionalProperties: {type: string}
    PanelConnectPlatform:
      type: object
      required: [slug, labelEn, labelRu, enabled, sortOrder, updatedAt]
      properties:
        slug: {type: string, description: "Lowercase key. Immutable once created; renaming means creating another."}
        labelEn: {type: string}
        labelRu: {type: string}
        enabled: {type: boolean, description: "A platform that is not offered disappears from both customer surfaces."}
        sortOrder: {type: integer}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: string, format: uuid}
    PanelConnectClient:
      type: object
      required: [platform, name, scheme, enabled, sortOrder, updatedAt]
      properties:
        id: {type: string, format: uuid, description: "Absent creates, present updates."}
        platform: {type: string}
        name: {type: string}
        scheme: {type: string, description: "Concatenated with the subscription link to build the deep link. Validated against an allowlist before storage."}
        downloadUrl: {type: string, description: "https only."}
        instructionsEn: {type: string, description: "Replaces the generic setup steps for this platform when present."}
        instructionsRu: {type: string}
        enabled: {type: boolean}
        sortOrder: {type: integer}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: string, format: uuid}
    PanelConnectCatalogue:
      type: object
      required: [platforms, clients]
      properties:
        platforms: {type: array, items: {$ref: "#/components/schemas/PanelConnectPlatform"}}
        clients: {type: array, items: {$ref: "#/components/schemas/PanelConnectClient"}}
    PanelSalesLine:
      type: object
      required: [operation, currency, orders, subtotalMinor, discountMinor, paidMinor, walletMinor]
      properties:
        operation: {type: string, description: "purchase, renewal, extension, upgrade, downgrade, addon, topup, gift, or goods."}
        currency: {type: string}
        orders: {type: integer, format: int64}
        subtotalMinor: {type: integer, format: int64}
        discountMinor: {type: integer, format: int64}
        paidMinor: {type: integer, format: int64, description: "Money that arrived through a provider."}
        walletMinor: {type: integer, format: int64, description: "Balance spent. Already counted as revenue when funded; never add it to paidMinor."}
    PanelPlanSales:
      type: object
      required: [planCode, planVersion, billingPeriod, currency, orders, grossMinor]
      properties:
        planCode: {type: string}
        planVersion: {type: integer}
        billingPeriod: {type: string}
        currency: {type: string}
        orders: {type: integer, format: int64}
        grossMinor: {type: integer, format: int64, description: "List value of the lines, read off the version the order referenced."}
    PanelDaySales:
      type: object
      required: [day, currency, orders, paidMinor, walletMinor]
      properties:
        day: {type: string, format: date, description: "A day in the requested timezone, not an instant."}
        currency: {type: string}
        orders: {type: integer, format: int64}
        paidMinor: {type: integer, format: int64}
        walletMinor: {type: integer, format: int64}
    PanelPeriodRefunds:
      type: object
      required: [currency, refunds, refundedMinor]
      properties:
        currency: {type: string}
        refunds: {type: integer, format: int64}
        refundedMinor: {type: integer, format: int64}
    PanelTrialConversion:
      type: object
      required: [trials, converted, cohort]
      properties:
        trials: {type: integer, format: int64, description: "Trials claimed inside the period."}
        converted: {type: integer, format: int64, description: "How many of those customers have since paid for anything."}
        cohort: {type: boolean, description: "Always true. The numerator counts conversions at any later time, so a period ending today reads low by construction."}
    PanelSalesReport:
      type: object
      required: [since, until, timezone, byOperation, byPlan, byDay, refunds, trials, generatedAt]
      properties:
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        timezone: {type: string}
        currency: {type: string}
        byOperation: {type: array, items: {$ref: "#/components/schemas/PanelSalesLine"}}
        byPlan: {type: array, items: {$ref: "#/components/schemas/PanelPlanSales"}}
        byDay: {type: array, items: {$ref: "#/components/schemas/PanelDaySales"}}
        refunds: {type: array, items: {$ref: "#/components/schemas/PanelPeriodRefunds"}}
        trials: {$ref: "#/components/schemas/PanelTrialConversion"}
        generatedAt: {type: string, format: date-time}
    PanelProviderHealthLine:
      type: object
      required: [provider, currency, intents, settled, failed, abandoned, stillOpen, settledMinor, medianSettleSeconds, p95SettleSeconds, oldestOpenSeconds]
      properties:
        provider: {type: string}
        currency: {type: string}
        intents: {type: integer, format: int64}
        settled: {type: integer, format: int64}
        failed: {type: integer, format: int64, description: "The provider refused or errored."}
        abandoned: {type: integer, format: int64, description: "Cancelled or expired — the customer's decision, not the acquirer's performance."}
        stillOpen: {type: integer, format: int64, description: "In neither rate's denominator."}
        settledMinor: {type: integer, format: int64}
        medianSettleSeconds: {type: integer, format: int64, description: "Measured from the settlement event, not from updated_at, which a later reconciliation would move."}
        p95SettleSeconds: {type: integer, format: int64}
        oldestOpenSeconds: {type: integer, format: int64, description: "Age of the oldest intent still waiting: the stuck-payment queue as a number."}
        settlementRate: {type: number, description: "settled / (settled + failed). Absent when nothing reached a decision."}
        completionRate: {type: number, description: "settled / (settled + failed + abandoned)."}
    PanelProviderHealthDay:
      type: object
      required: [day, provider, intents, settled, failed]
      properties:
        day: {type: string, format: date}
        provider: {type: string}
        intents: {type: integer, format: int64}
        settled: {type: integer, format: int64}
        failed: {type: integer, format: int64}
    PanelWebhookHealthLine:
      type: object
      required: [provider, received, rejected, failed, processed]
      properties:
        provider: {type: string}
        received: {type: integer, format: int64}
        rejected: {type: integer, format: int64, description: "Failed signature verification."}
        failed: {type: integer, format: int64}
        processed: {type: integer, format: int64}
    PanelPaymentHealth:
      type: object
      required: [since, until, timezone, providers, byDay, webhooks, generatedAt]
      properties:
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        timezone: {type: string}
        providers: {type: array, items: {$ref: "#/components/schemas/PanelProviderHealthLine"}}
        byDay: {type: array, items: {$ref: "#/components/schemas/PanelProviderHealthDay"}}
        webhooks: {type: array, items: {$ref: "#/components/schemas/PanelWebhookHealthLine"}}
        generatedAt: {type: string, format: date-time}
    PanelTrafficNode:
      type: object
      required: [name, connected, disabled, usedBytes, limitBytes]
      properties:
        name: {type: string}
        countryCode: {type: string}
        connected: {type: boolean}
        disabled: {type: boolean}
        usedBytes: {type: integer, format: int64}
        limitBytes: {type: integer, format: int64, description: "Zero means the node has no limit, not that it is full."}
        usedShare: {type: number, description: "used ÷ limit. Absent when the node has no limit: it cannot be filling up."}
        usersOnline: {type: integer}
    PanelTrafficConsumer:
      type: object
      required: [remnawaveId, username, usedBytes, lifetimeBytes, limitBytes]
      properties:
        remnawaveId: {type: integer, format: int64}
        username: {type: string}
        usedBytes: {type: integer, format: int64, description: "The current cycle, which resets."}
        lifetimeBytes: {type: integer, format: int64}
        limitBytes: {type: integer, format: int64}
        customerId: {type: string, format: uuid, description: "Absent for a Remnawave user Omniflow did not create, which is a real state rather than an error."}
        label: {type: string}
        status: {type: string}
    PanelTrafficReport:
      type: object
      required: [nodes, nodesReported, consumers, scanned, total]
      properties:
        nodes: {type: array, items: {$ref: "#/components/schemas/PanelTrafficNode"}}
        nodesReported: {type: boolean, description: "False when the panel did not answer. An empty list means neither thing."}
        nodesDetail: {type: string, enum: [nodes_unsupported, nodes_unavailable, remnawave_not_configured]}
        consumers: {type: array, items: {$ref: "#/components/schemas/PanelTrafficConsumer"}}
        scanned: {type: integer, description: "How many users the ranking covers."}
        total: {type: integer, description: "How many the panel reports having."}
    PageSpan:
      type: object
