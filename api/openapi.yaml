      properties:
        blocks: {type: array, items: {$ref: "#/components/schemas/PageBlock"}}
    PublishedPage:
      type: object
      required: [slug, kind, locale, title, document, updatedAt]
      properties:
        slug: {type: string}
        kind: {type: string, enum: [faq, terms, offer, privacy, custom]}
        locale: {type: string}
        title: {type: string}
        document: {$ref: "#/components/schemas/PageDocument"}
        updatedAt: {type: string, format: date-time}
    PublishedPageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [slug, kind, title]
            properties:
              slug: {type: string}
              kind: {type: string}
              title: {type: string}
    PanelInfoPageLocale:
      type: object
      required: [locale, title, body]
      properties:
        locale: {type: string, enum: [ru, en]}
        title: {type: string}
        body: {type: string, description: "The operator's source text, up to 40000 characters. Never HTML."}
    PanelInfoPage:
      type: object
      required: [slug, kind, listed, sortOrder, updatedAt]
      properties:
        slug: {type: string, description: "The address, and the page's identity. Immutable once created."}
        kind: {type: string, enum: [faq, terms, offer, privacy, custom]}
        publishedAt: {type: string, format: date-time, description: "Absent for a draft, which answers 404 publicly."}
        listed: {type: boolean, description: "Whether the page appears in the customer panel's menu. A published page can be unlisted."}
        sortOrder: {type: integer}
        locales: {type: array, items: {$ref: "#/components/schemas/PanelInfoPageLocale"}}
        availableLocales: {type: array, items: {type: string}}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: string, format: uuid}
    PanelInfoPageList:
      type: object
      required: [items, kinds]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/PanelInfoPage"}}
        kinds: {type: array, items: {type: string}}
    PanelSubscriptionOperationAccepted:
      type: object
      required: [operationId, operation, status]
      properties:
        operationId: {type: string, format: uuid}
        operation: {type: string}
        status: {type: string}
    PanelCodeBatch:
      type: object
      required: [reference, planVersionId, quantity, unitPriceMinor, currency]
      properties:
        id: {type: string, format: uuid}
        reference: {type: string, description: "What the operator calls the batch. Unique, and what they search for."}
        planCode: {type: string}
