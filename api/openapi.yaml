        orders: {type: integer, format: int64}
        tickets: {type: integer, format: int64}
        identities: {type: integer, format: int64}
        referralsMade: {type: integer, format: int64}
        trialClaims: {type: integer, format: int64}
        wallet: {type: array, items: {$ref: "#/components/schemas/PanelMergeBalance"}}
