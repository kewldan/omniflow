      properties:
        name:
          type: string
          enum: [google-site-verification, yandex-verification, msvalidate.01, facebook-domain-verification]
        content: {type: string, minLength: 8, maxLength: 128}
    AnalyticsSettingsInput:
      type: object
      properties:
        enabled: {type: boolean, description: "False on a fresh installation. Nothing renders or is captured until this is on."}
        counters:
          type: object
          description: "Identifier per provider. `yandex_metrica` is a counter number; `google_analytics` is a measurement ID such as G-XXXXXXX."
          additionalProperties: {type: string}
        verifications:
          type: array
          maxItems: 8
          items: {$ref: "#/components/schemas/AnalyticsVerification"}
    PanelAnalytics:
      allOf:
        - $ref: "#/components/schemas/AnalyticsSettingsInput"
        - type: object
          required: [version, providers, verificationNames]
          properties:
            version: {type: integer, format: int32}
            updatedAt: {type: string, format: date-time}
            updatedBy: {type: string, format: uuid}
            providers:
              type: array
              description: "The counters this build can render, so the screen offers what exists."
              items: {type: string}
            verificationNames: {type: array, items: {type: string}}
    PublicAnalytics:
      type: object
      required: [measurable]
      properties:
        measurable:
          type: boolean
          description: "False when nothing would run even with consent, which suppresses the consent request."
        counters:
          type: object
          description: "Present only when measurement is enabled. Rendered only after consent."
          additionalProperties: {type: string}
        verifications: {type: array, items: {$ref: "#/components/schemas/AnalyticsVerification"}}
    AccountAttributionInput:
      type: object
      description: "At least one field must be present."
      properties:
        clickId: {type: string, description: "The advertising platform's own identifier for the click it sold."}
        clickSource: {type: string, enum: [google, yandex, meta, microsoft, tiktok, x]}
        source: {type: string, maxLength: 120}
        medium: {type: string, maxLength: 120}
        campaign: {type: string, maxLength: 120}
        content: {type: string, maxLength: 120}
        term: {type: string, maxLength: 120}
    PanelConversion:
      type: object
      required: [orderId, operation, state, currency, paidMinor, refundedMinor, paidAt]
      properties:
        orderId: {type: string, format: uuid}
        operation: {type: string}
        state: {type: string}
        currency: {type: string}
        paidMinor: {type: integer, format: int64}
        refundedMinor: {type: integer, format: int64}
        paidAt: {type: string, format: date-time}
        clickId: {type: string}
        clickSource: {type: string}
        source: {type: string}
        medium: {type: string}
        campaign: {type: string}
        content: {type: string}
        term: {type: string}
    PanelChannelResult:
      type: object
      required: [channel, orders, attributedClicks, currency, paidMinor, refundedMinor]
      properties:
        channel: {type: string, description: "The UTM source, the click platform, or `direct`."}
        medium: {type: string}
        orders: {type: integer, format: int64}
        attributedClicks:
          type: integer
          format: int64
          description: "How many of those orders carry a click identifier, which is how many can be uploaded."
        currency: {type: string}
        paidMinor: {type: integer, format: int64}
        refundedMinor: {type: integer, format: int64}
    PanelCommerceSettings:
      type: object
      required: [topUp, subscriptions, updatedAt]
      properties:
        topUp: {$ref: "#/components/schemas/PanelTopUpSettings"}
        subscriptions: {$ref: "#/components/schemas/PanelSubscriptionSettings"}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: string, format: uuid}
    PanelProviderSettings:
      type: object
      required: [provider, merchantId, enabled, displayOrder, credentialsSet, webhookSecretSet, adapterRecurring, recurringEnabled, recurringTestStatus, connectionStatus, webhookStatus, updatedAt]
      properties:
        provider: {type: string}
        merchantId: {type: string}
        enabled: {type: boolean}
        displayOrder: {type: integer}
        credentialsSet: {type: boolean, description: "Whether a credential is stored. The credential itself is never returned."}
        webhookSecretSet: {type: boolean}
        adapterRecurring: {type: boolean, description: "What the compiled-in adapter declares. The operator switch can only narrow this."}
        recurringEnabled: {type: boolean}
        recurringTestStatus: {type: string, enum: [untested, passed, failed]}
        recurringTestedAt: {type: string, format: date-time}
        connectionStatus: {type: string, enum: [unknown, healthy, failing]}
        connectionCheckedAt: {type: string, format: date-time}
        connectionErrorCode: {type: string}
        webhookStatus: {type: string, enum: [unknown, healthy, failing]}
        webhookLastEventAt: {type: string, format: date-time}
        webhookLastErrorCode: {type: string}
        updatedAt: {type: string, format: date-time}
    PanelProviderSettingsList:
      type: object
      required: [items]
      properties:
        items: {type: array, nullable: true, items: {$ref: "#/components/schemas/PanelProviderSettings"}}
        adapters: {type: object, additionalProperties: {type: boolean}}
    PanelProviderSettingsInput:
      type: object
      required: [enabled, displayOrder]
      properties:
        merchantId: {type: string, description: "Empty for an installation with a single merchant account."}
        enabled: {type: boolean}
        displayOrder: {type: integer}
        credentials: {type: string, nullable: true, description: "Omit or send null to keep the stored credential."}
        webhookSecret: {type: string, nullable: true}
    PanelRecurringTest:
      type: object
      required: [passed, enable]
      properties:
        merchantId: {type: string}
        passed: {type: boolean}
        enable: {type: boolean, description: "Only honoured alongside a passing test and an adapter that declares the capability."}
    PanelBlocklistSource:
      type: object
      required: [id, slug, displayName, subjectKind, url, authConfigured, enabled, refreshIntervalSeconds, entryCount, status, nextRefreshAt]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        displayName: {type: string}
        subjectKind: {type: string, enum: [telegram_id, email, username]}
        url: {type: string}
        authConfigured: {type: boolean}
        enabled: {type: boolean}
        refreshIntervalSeconds: {type: integer, format: int64}
        entryCount: {type: integer}
        status: {type: string, enum: [pending, healthy, failing]}
        lastErrorCode: {type: string}
        lastRefreshAt: {type: string, format: date-time}
        nextRefreshAt: {type: string, format: date-time}
    PanelBlocklistSourceList:
      type: object
      required: [items]
      properties: {items: {type: array, nullable: true, items: {$ref: "#/components/schemas/PanelBlocklistSource"}}}
    PanelBlocklistSourceInput:
      type: object
      required: [slug, displayName, subjectKind, url, enabled, refreshIntervalSeconds]
      properties:
        slug: {type: string}
        displayName: {type: string}
        subjectKind: {type: string, enum: [telegram_id, email, username]}
        url: {type: string, pattern: "^https://"}
        authHeader: {type: string, nullable: true, description: "Omit or send null to keep the stored credential."}
        enabled: {type: boolean}
        refreshIntervalSeconds: {type: integer, format: int64, minimum: 300}
    PanelBlocklistMatch:
      type: object
      required: [id, customerId, sourceId, subjectKind, status, detectedAt]
      properties:
        id: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        sourceId: {type: string, format: uuid}
        sourceSlug: {type: string}
        sourceName: {type: string}
        subjectKind: {type: string, enum: [telegram_id, email, username]}
        status: {type: string, enum: [open, allowed, blocked, appealed]}
        decisionReason: {type: string}
        decidedBy: {type: string, format: uuid}
        detectedAt: {type: string, format: date-time}
        decidedAt: {type: string, format: date-time}
    PanelMatchList:
      type: object
      required: [items]
      properties: {items: {type: array, nullable: true, items: {$ref: "#/components/schemas/PanelBlocklistMatch"}}}
    PanelMatchPage:
      type: object
      required: [items]
      properties:
        items: {type: array, nullable: true, items: {$ref: "#/components/schemas/PanelBlocklistMatch"}}
        nextCursor: {type: string}
    PanelAnomalyMetric:
      type: string
      enum: [traffic, purchase, refund, referral]
    PanelAnomalyRule:
      type: object
      required: [metric, enabled, windowSeconds, warnThreshold, alertThreshold, minimumSample, updatedAt]
      properties:
        metric: {$ref: "#/components/schemas/PanelAnomalyMetric"}
        enabled: {type: boolean}
        windowSeconds: {type: integer, format: int64, minimum: 300}
        warnThreshold: {type: integer, format: int64, minimum: 1, description: "In the metric's own unit: bytes, minor units, or a count."}
        alertThreshold: {type: integer, format: int64, minimum: 1}
        minimumSample: {type: integer, minimum: 0}
        updatedAt: {type: string, format: date-time}
    PanelAnomalyRuleList:
      type: object
      required: [items]
      properties: {items: {type: array, nullable: true, items: {$ref: "#/components/schemas/PanelAnomalyRule"}}}
    PanelAnomalyRuleInput:
      type: object
      required: [enabled, windowSeconds, warnThreshold, alertThreshold, minimumSample]
      properties:
        enabled: {type: boolean}
        windowSeconds: {type: integer, format: int64, minimum: 300}
        warnThreshold: {type: integer, format: int64, minimum: 1}
        alertThreshold: {type: integer, format: int64, minimum: 1}
        minimumSample: {type: integer, minimum: 0}
    PanelAnomalySignal:
      type: object
      required: [id, metric, severity, subjectType, subjectId, observed, threshold, sampleSize, windowStart, windowEnd, status, detectedAt]
      properties:
        id: {type: string, format: uuid}
        metric: {$ref: "#/components/schemas/PanelAnomalyMetric"}
        severity: {type: string, enum: [warning, alert]}
        subjectType: {type: string, enum: [installation, customer, plan, provider]}
        subjectId: {type: string}
        observed: {type: integer, format: int64}
        threshold: {type: integer, format: int64}
        sampleSize: {type: integer}
        windowStart: {type: string, format: date-time}
        windowEnd: {type: string, format: date-time}
        evidence: {type: object, additionalProperties: true, description: "Aggregate numbers only — never a message body, link, token, or address."}
        status: {type: string, enum: [open, acknowledged, dismissed]}
        reviewedBy: {type: string, format: uuid}
        reviewReason: {type: string}
        detectedAt: {type: string, format: date-time}
        reviewedAt: {type: string, format: date-time}
    PanelAnomalyPage:
      type: object
      required: [items]
      properties:
        items: {type: array, nullable: true, items: {$ref: "#/components/schemas/PanelAnomalySignal"}}
        nextCursor: {type: string}
    PanelGiftStatus:
      type: string
      enum: [pending, deliverable, claimed, expired, revoked, refunded]
    PanelGift:
      type: object
      required: [id, orderId, senderId, kind, currency, codeHint, status, claimAttempts, expiresAt, createdAt]
      properties:
        id: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        senderId: {type: string, format: uuid}
        recipientId: {type: string, format: uuid}
        kind: {type: string, enum: [subscription, addon, wallet_credit]}
        currency: {type: string}
        creditMinor: {type: integer, format: int64}
        codeHint: {type: string, description: "The last four characters of the claim code. The code itself is stored only as a digest."}
        status: {$ref: "#/components/schemas/PanelGiftStatus"}
        claimAttempts: {type: integer}
        expiresAt: {type: string, format: date-time}
        claimedAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
        revokeReason: {type: string}
        createdAt: {type: string, format: date-time}
    PanelGiftPage:
      type: object
      required: [items]
      properties:
        items: {type: array, nullable: true, items: {$ref: "#/components/schemas/PanelGift"}}
        nextCursor: {type: string}
        totals: {type: object, additionalProperties: {type: integer, format: int64}}
    PanelGoodsProvider:
      type: object
      required: [slug, enabled, credentialsSet, spendLimitMinor, spendWindowSeconds, status, lowBalance]
      properties:
        slug: {type: string}
        enabled: {type: boolean}
        credentialsSet: {type: boolean}
        balanceMinor: {type: integer, format: int64}
        balanceCurrency: {type: string}
        lowBalanceThresholdMinor: {type: integer, format: int64}
        spendLimitMinor: {type: integer, format: int64, description: "Rolling ceiling in provider cost. Zero means no ceiling."}
        spendWindowSeconds: {type: integer, format: int64}
        status: {type: string, enum: [unknown, healthy, failing]}
        lastErrorCode: {type: string}
        lastCheckedAt: {type: string, format: date-time}
        lowBalance: {type: boolean, description: "Derived from the balance and the threshold, so it cannot contradict them."}
    PanelGoodsProviderList:
      type: object
      required: [items]
      properties: {items: {type: array, nullable: true, items: {$ref: "#/components/schemas/PanelGoodsProvider"}}}
    PanelGoodsProviderInput:
      type: object
      required: [enabled, spendLimitMinor, spendWindowSeconds]
      properties:
        enabled: {type: boolean}
        credentials: {type: string, nullable: true, description: "Omit or send null to keep the stored credential."}
        lowBalanceThresholdMinor: {type: integer, format: int64, nullable: true}
        spendLimitMinor: {type: integer, format: int64, minimum: 0}
        spendWindowSeconds: {type: integer, format: int64, minimum: 1}
    PanelGoodsPricing:
      type: object
      required: [currency, markupBps, rounding, quoteTtlSeconds]
      properties:
        currency: {type: string}
        markupBps: {type: integer, minimum: 0, maximum: 100000}
        rounding: {type: string, enum: [none, up_minor, up_unit, up_ten_units, up_hundred_units]}
        fixedAmountMinor: {type: integer, format: int64, nullable: true, description: "Opts out of markup derivation entirely."}
        quoteTtlSeconds: {type: integer, minimum: 30, maximum: 3600}
        updatedAt: {type: string, format: date-time}
    PanelGoodsProduct:
      type: object
      required: [id, code, providerSlug, kind, visible, sortOrder, createdAt]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        providerSlug: {type: string}
        kind: {type: string, enum: [telegram_premium, telegram_stars]}
        durationMonths: {type: integer}
        starQuantity: {type: integer}
        visible: {type: boolean}
        sortOrder: {type: integer}
        createdAt: {type: string, format: date-time}
        archivedAt: {type: string, format: date-time}
        localizations: {type: object, additionalProperties: {$ref: "#/components/schemas/PanelLocalization"}}
        pricing: {$ref: "#/components/schemas/PanelGoodsPricing"}
    PanelGoodsProductList:
      type: object
      required: [items]
      properties: {items: {type: array, nullable: true, items: {$ref: "#/components/schemas/PanelGoodsProduct"}}}
    PanelGoodsProductInput:
      type: object
      required: [code, providerSlug, kind, visible, sortOrder]
      properties:
        code: {type: string, pattern: "^[a-z][a-z0-9_-]{1,63}$"}
        providerSlug: {type: string}
        kind: {type: string, enum: [telegram_premium, telegram_stars]}
        durationMonths: {type: integer, enum: [3, 6, 12]}
        starQuantity: {type: integer, minimum: 1}
        visible: {type: boolean}
        sortOrder: {type: integer}
    PanelGoodsProductUpdate:
      type: object
      required: [visible, sortOrder, archived]
      properties:
        visible: {type: boolean}
        sortOrder: {type: integer}
        archived: {type: boolean}
    PanelGoodsOrder:
      type: object
      required: [orderId, customerId, productId, quantity, recipient, recipientIsSelf, quotedCostMinor, quotedPriceMinor, marginMinor, currency, status, refunded, createdAt]
      properties:
        orderId: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        quantity: {type: integer}
        recipient: {type: string, description: "The Telegram username. No other recipient detail is retained."}
        recipientIsSelf: {type: boolean}
        quotedCostMinor: {type: integer, format: int64}
        quotedPriceMinor: {type: integer, format: int64}
        marginMinor: {type: integer, format: int64}
        currency: {type: string}
        status: {type: string, enum: [quoted, paid, delivering, delivered, failed, refunded, needs_review]}
        deliveryStatus: {type: string}
        deliveryAttempts: {type: integer}
        failureClass: {type: string, enum: [retryable, permanent, recipient_invalid, provider_balance, provider_unavailable, ambiguous]}
        errorCode: {type: string}
        refunded: {type: boolean}
        costKnown: {type: boolean, description: "False when the provider publishes no cost for this product. The margin is unknown, not zero."}
        deliveredAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    PanelGoodsOrderPage:
      type: object
      required: [items]
      properties:
        items: {type: array, nullable: true, items: {$ref: "#/components/schemas/PanelGoodsOrder"}}
        nextCursor: {type: string}
    PanelParkedDelivery:
      type: object
      required: [orderId, customerId, providerSlug, recipient, priceMinor, currency, attempts, updatedAt]
      properties:
        orderId: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        providerSlug: {type: string}
        recipient: {type: string}
        priceMinor: {type: integer, format: int64}
        currency: {type: string}
        attempts: {type: integer}
        errorCode: {type: string}
        updatedAt: {type: string, format: date-time}
    PanelParkedDeliveryList:
      type: object
      required: [items]
      properties: {items: {type: array, nullable: true, items: {$ref: "#/components/schemas/PanelParkedDelivery"}}}
    PanelGoodsAttempt:
      type: object
      required: [attempt, outcome, correlationId, occurredAt]
      properties:
        attempt: {type: integer}
        outcome: {type: string, enum: [submitted, delivered, failed]}
        failureClass: {type: string}
        errorCode: {type: string}
        correlationId: {type: string}
        occurredAt: {type: string, format: date-time}
    PanelGoodsAttemptList:
      type: object
      required: [items]
      properties: {items: {type: array, nullable: true, items: {$ref: "#/components/schemas/PanelGoodsAttempt"}}}
    PanelBulkTarget:
      type: object
      required: [type, id]
      properties:
        type: {type: string, enum: [customer, subscription]}
        id: {type: string, format: uuid}
    PanelBulkInput:
      type: object
      required: [kind, targets]
      properties:
        kind: {type: string, enum: [customer_export, subscription_extend, subscription_disable, subscription_enable, wallet_credit]}
        targets: {type: array, minItems: 1, maxItems: 1000, items: {$ref: "#/components/schemas/PanelBulkTarget"}}
        parameters: {type: object, additionalProperties: true}
    PanelBulkOperation:
      type: object
      required: [id, kind, status, requestedBy, reason, total, succeeded, failed, skipped, createdAt]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        status: {type: string, enum: [previewing, ready, running, completed, failed, cancelled]}
        requestedBy: {type: string, format: uuid}
        reason: {type: string}
        parameters: {type: object, additionalProperties: true}
        total: {type: integer}
        succeeded: {type: integer}
        failed: {type: integer}
        skipped: {type: integer}
        createdAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
    PanelBulkOperationList:
      type: object
      required: [items]
      properties: {items: {type: array, nullable: true, items: {$ref: "#/components/schemas/PanelBulkOperation"}}}
    PanelBulkItem:
      type: object
      required: [position, targetType, targetId, status]
      properties:
        position: {type: integer}
        targetType: {type: string}
        targetId: {type: string, format: uuid}
        status: {type: string, enum: [pending, succeeded, failed, skipped]}
        errorCode: {type: string}
        processedAt: {type: string, format: date-time}
    PanelBulkDetail:
      type: object
      required: [operation, items]
      properties:
        operation: {$ref: "#/components/schemas/PanelBulkOperation"}
        items: {type: array, nullable: true, items: {$ref: "#/components/schemas/PanelBulkItem"}}

    # -------------------------------------------------------------------------
    # Customer web panel (v0.9)
    # -------------------------------------------------------------------------
    AccountSignInMethods:
      type: object
      required: [telegram, magicLink, oidc]
      properties:
        telegram: {type: boolean, description: "A bot token is configured, so the login widget can be verified."}
        magicLink: {type: boolean, description: "The operator enabled the bot-delivered fallback."}
        oidc:
          type: array
          items:
            type: object
            required: [slug, displayName]
            properties:
              slug: {type: string}
              displayName: {type: string}
              icon: {type: string, description: "Name of a shipped icon, never a third-party URL."}
    AccountCustomer:
      type: object
      required: [id, locale, timezone, status]
      properties:
        id: {type: string, format: uuid}
        locale: {type: string, enum: [ru, en]}
        timezone: {type: string}
        status: {type: string, enum: [active, suspended, deleted]}
    AccountSignIn:
      type: object
      required: [customer, expiresAt]
      properties:
        customer: {$ref: "#/components/schemas/AccountCustomer"}
        expiresAt: {type: string, format: date-time}
    AccountSession:
      type: object
      required: [customer, session]
      properties:
        customer: {$ref: "#/components/schemas/AccountCustomer"}
        session:
          type: object
          required: [id, authMethod, expiresAt, reauthenticationRequired]
          properties:
            id: {type: string, format: uuid}
            authMethod: {type: string, enum: [telegram, magic_link, oidc]}
            authProvider: {type: string}
            expiresAt: {type: string, format: date-time}
            reauthenticationRequired:
              type: boolean
              description: >-
                The session is older than the re-authentication window, so a
                destructive action will be refused until the customer signs in
                again.
    AccountProfileInput:
      type: object
      required: [locale, timezone]
      properties:
        locale: {type: string, enum: [ru, en]}
        timezone: {type: string}
    AccountSessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, current, authMethod, createdAt, lastSeenAt, expiresAt]
            properties:
              id: {type: string, format: uuid}
              current: {type: boolean}
              authMethod: {type: string, enum: [telegram, magic_link, oidc]}
              authProvider: {type: string}
              ip: {type: string}
              userAgent: {type: string}
              createdAt: {type: string, format: date-time}
              lastSeenAt: {type: string, format: date-time}
              expiresAt: {type: string, format: date-time}
    AccountSecurityEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, event, occurredAt]
            properties:
              id: {type: string, format: uuid}
              event:
                type: string
                enum:
                  - signed_in
                  - signed_out
                  - signed_out_all
                  - session_revoked
                  - magic_link_requested
                  - identity_linked
                  - identity_unlinked
                  - subscription_key_rotated
                  - device_removed
                  - devices_removed_all
              ip: {type: string}
              userAgent: {type: string}
              metadata: {type: object, additionalProperties: true}
              occurredAt: {type: string, format: date-time}
    AccountLinkedMethodList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, provider, label, removable]
            properties:
              id: {type: string, format: uuid}
              provider: {type: string, description: "'telegram' or 'oidc:<slug>'."}
              label: {type: string}
              removable: {type: boolean, description: "False for the only remaining method."}
    AccountTraffic:
      type: object
      required: [usedBytes, unlimited, percent]
      properties:
        usedBytes: {type: integer, format: int64}
        limitBytes: {type: integer, format: int64, nullable: true}
        unlimited: {type: boolean}
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Computed on the server and clamped, so the bar and its textual
            equivalent cannot disagree. Meaningless when unlimited.
    AccountDeviceUsage:
      type: object
      required: [used, unlimited]
      properties:
        used: {type: integer}
        limit: {type: integer, nullable: true}
        unlimited: {type: boolean}
    AccountSubscription:
      type: object
      required: [id, slot, label, plan, phase, daysLeft, provisioned, live, traffic, devices]
      properties:
        id: {type: string, format: uuid}
        slot: {type: integer}
        label: {type: string}
        plan: {type: string}
        phase:
          type: string
          enum: [none, provisioning, active, expiring_soon, grace, limited, disabled, expired, failed]
        endsAt: {type: string, format: date-time}
        daysLeft: {type: integer}
        provisioned: {type: boolean}
        live:
          type: boolean
          description: >-
            The traffic and device figures were read from Remnawave. When false
            they are the last observed values and the panel says so.
        traffic: {$ref: "#/components/schemas/AccountTraffic"}
        devices: {$ref: "#/components/schemas/AccountDeviceUsage"}
    AccountNotice:
      type: object
      required: [active, message]
      properties:
        active: {type: boolean}
        message:
          type: string
          description: >-
            The operator's own customer-facing wording in the customer's
            language. Empty when none was configured, which the panel renders
            with its own localized copy.
        expectedReturnAt:
          type: string
          format: date-time
          description: Absent when the operator gave no estimate.
    AccountOverview:
      type: object
      required: [customer, subscriptions, showSwitcher, degraded]
      properties:
        customer: {$ref: "#/components/schemas/AccountCustomer"}
        subscriptions: {type: array, items: {$ref: "#/components/schemas/AccountSubscription"}}
        notice:
          allOf: [{$ref: "#/components/schemas/AccountNotice"}]
          description: Present only while maintenance or an incident is active.
        showSwitcher:
          type: boolean
          description: >-
            Concurrent subscriptions are enabled. A single-subscription
            installation gets one screen with no selection step.
        degraded: {type: boolean, description: "Remnawave could not be reached for at least one subscription."}
    AccountConnection:
      type: object
      required: [subscriptionUrl, platform, platforms, clients]
      properties:
        subscriptionUrl: {type: string}
        platform: {type: string}
        platforms:
          type: array
          description: >-
            The platforms this installation documents, with labels already
            resolved to the customer's language. They are text rather than keys
            because the catalogue is operator-editable, and somebody adding a
            platform from the panel cannot add a message to a compiled catalogue.
          items:
            type: object
            required: [slug, label]
            properties:
              slug: {type: string}
              label: {type: string}
        clients:
          type: array
          items:
            type: object
            required: [name, deepLink]
            properties:
              name: {type: string}
              deepLink: {type: string, description: "Empty when the subscription has no link yet."}
              downloadUrl: {type: string}
              instructions: {type: string, description: "The operator's own words, replacing the generic setup steps when present."}
    AccountDeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [handle, lastSeen]
            properties:
              handle: {type: string, description: "Opaque reference. Never the hardware identifier."}
              name: {type: string}
              platform: {type: string}
              lastSeen: {type: string, format: date-time}
    AccountMoney:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor: {type: integer, format: int64}
        currency: {type: string}
    AccountPlan:
      type: object
      required: [planId, planVersionId, code, kind, name, billingPeriod, durationSeconds, price, operations, eligible]
      properties:
        planId: {type: string, format: uuid}
        planVersionId: {type: string, format: uuid}
        code: {type: string}
        kind: {type: string, enum: [trial, one_time, recurring, manual]}
        name: {type: string}
        description: {type: string}
        sortOrder: {type: integer}
        billingPeriod: {type: string}
        durationSeconds: {type: integer, format: int64}
        gracePeriodSeconds: {type: integer, format: int64}
        price: {$ref: "#/components/schemas/AccountMoney"}
        recurringCapable: {type: boolean}
        configurableSquads: {type: boolean}
        operations:
          type: array
          description: "The lifecycle actions the configured plan policy allows for this customer."
          items: {type: string, enum: [purchase, extension, upgrade, downgrade]}
        eligible: {type: boolean}
        held:
          type: boolean
          description: "The customer already holds an entitlement for this plan, so the catalogue can mark it as the one they are on."
        ineligibleReason: {type: string}
        trafficAllowanceBytes:
          type: integer
          format: int64
          nullable: true
          description: "Null means unlimited. Nullable rather than zero because unlimited and none are different offers."
        deviceLimit: {type: integer, nullable: true, description: "Null means unlimited."}
    AccountPlanList:
      type: object
      required: [items, currency]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AccountPlan"}}
        currency: {type: string}
    AccountSquadOffer:
      type: object
      required: [selection, minimum, configurable, offered]
      properties:
        selection: {type: string, description: "Whether squads are assigned automatically or chosen by the customer."}
        minimum: {type: integer}
        maximum: {type: integer, nullable: true}
        configurable: {type: boolean}
        offered:
          type: array
          items:
            type: object
            required: [squadId, label]
            properties:
              squadId: {type: string, format: uuid}
              label: {type: string}
    AccountAddonOffer:
      type: object
      required: [addonId, addonVersionId, code, kind, name, maxQuantity, proration, price]
      properties:
        addonId: {type: string, format: uuid}
        addonVersionId: {type: string, format: uuid}
        code: {type: string}
        kind: {type: string, enum: [traffic, devices, squads]}
        name: {type: string}
        description: {type: string}
        maxQuantity: {type: integer}
        proration: {type: string, description: "The documented proration rule for this add-on."}
        squadCount: {type: integer}
        price: {$ref: "#/components/schemas/AccountMoney"}
        trafficBytes: {type: integer, format: int64, nullable: true}
        deviceSlots: {type: integer, nullable: true}
    AccountPlanDetail:
      allOf:
        - {$ref: "#/components/schemas/AccountPlan"}
        - type: object
          required: [squads, addons, promotions]
          properties:
            squads: {$ref: "#/components/schemas/AccountSquadOffer"}
            addons: {type: array, items: {$ref: "#/components/schemas/AccountAddonOffer"}}
            promotions:
              type: array
              items:
                type: object
                required: [code, kind, value, eligible]
                properties:
                  code: {type: string}
                  kind: {type: string}
                  value: {type: integer, format: int64}
                  currency: {type: string}
                  eligible: {type: boolean}
                  startsAt: {type: string, format: date-time}
                  endsAt: {type: string, format: date-time}
            termsUrl: {type: string}
    AccountCheckoutQuote:
      type: object
      required: [currency, subtotalMinor, addonMinor, discountMinor, walletBalanceMinor, walletAppliedMinor, externalMinor]
      description: >-
        The exact application breakdown. Every figure is computed on the server,
        so the number a customer is asked to approve and the number they are
        charged cannot be arrived at two different ways.
      properties:
        currency: {type: string}
        subtotalMinor: {type: integer, format: int64}
        addonMinor: {type: integer, format: int64}
        discountMinor: {type: integer, format: int64}
        walletBalanceMinor: {type: integer, format: int64}
        walletAppliedMinor: {type: integer, format: int64}
        externalMinor: {type: integer, format: int64, description: "What still has to be settled through a provider."}
    AccountPaymentChoice:
      type: object
      required: [provider, currency, recurring]
      properties:
        provider: {type: string}
        currency: {type: string}
        amountMinor: {type: integer, format: int64}
        recurring: {type: boolean}
    AccountCheckout:
      type: object
      required: [id, planVersionId, plan, operation, currency, providers, applyWallet, quote, subscriptions, targetRequired, multiSubscription, squads, selectedSquadIds, addons, selectedAddons]
      properties:
        id: {type: string, format: uuid}
        planVersionId: {type: string, format: uuid}
        plan: {$ref: "#/components/schemas/AccountPlan"}
        operation: {type: string, enum: [purchase, renew, upgrade, downgrade]}
        currency: {type: string}
        provider: {type: string}
        providers: {type: array, items: {$ref: "#/components/schemas/AccountPaymentChoice"}}
        applyWallet: {type: boolean}
        quote: {$ref: "#/components/schemas/AccountCheckoutQuote"}
        promoCode: {type: string}
        promoRejection:
          type: string
          enum: [promo_unknown, promo_ineligible, promo_exhausted, promo_invalid]
          description: "Why the entered code does not apply. Present on a 200, not an error."
        subscriptionId: {type: string}
        newSubscription: {type: boolean}
        subscriptions:
          type: array
          description: "The subscriptions this checkout could target."
          items:
            type: object
            required: [id, slot, plan, status]
            properties:
              id: {type: string, format: uuid}
              slot: {type: integer}
              label: {type: string}
              plan: {type: string}
              status: {type: string}
              endsAt: {type: string, format: date-time}
        targetRequired: {type: boolean, description: "A target must be named before this checkout can be confirmed."}
        multiSubscription: {type: boolean, description: "False means the panel renders no picker at all."}
        squads: {$ref: "#/components/schemas/AccountSquadOffer"}
        selectedSquadIds: {type: array, items: {type: string, format: uuid}}
        addons: {type: array, items: {$ref: "#/components/schemas/AccountAddonOffer"}}
        selectedAddons:
          type: array
          items:
            type: object
            required: [addonVersionId, quantity]
            properties:
              addonVersionId: {type: string, format: uuid}
              quantity: {type: integer}
        termsUrl: {type: string}
        expiresAt: {type: string, format: date-time}
    AccountPaymentHandle:
      type: object
      required: [id, provider, status, amountMinor, currency, handoff]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        status: {type: string}
        amountMinor: {type: integer, format: int64}
        currency: {type: string}
        handoff:
          type: string
          enum: [hosted, telegram_invoice, manual, none]
          description: >-
            How the customer completes the payment. `none` means nothing further
            is owed, which is what a wallet-covered order looks like.
        checkoutUrl: {type: string}
    AccountOrder:
      type: object
      required: [id, state, operation, phase, currency, subtotalMinor, discountMinor, walletMinor, externalMinor, paidMinor, refundedMinor, plan, createdAt]
      properties:
        id: {type: string, format: uuid}
        state: {type: string, enum: [draft, pending, paid, fulfilled, cancelled, expired, partially_refunded, refunded]}
        operation: {type: string}
        phase:
          type: string
          description: >-
            The combined payment and provisioning state the panel renders: what
            the customer is waiting for, rather than which table changed.
        currency: {type: string}
        subtotalMinor: {type: integer, format: int64}
        discountMinor: {type: integer, format: int64}
        walletMinor: {type: integer, format: int64}
        externalMinor: {type: integer, format: int64}
        paidMinor: {type: integer, format: int64}
        refundedMinor: {type: integer, format: int64}
        plan: {type: string}
        subscriptionId: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        payment:
          type: object
          required: [id, provider, status, handoff]
          properties:
            id: {type: string, format: uuid}
            provider: {type: string}
            status: {type: string}
            handoff: {type: string, enum: [hosted, telegram_invoice, manual, none]}
            checkoutUrl: {type: string}
            receiptUrl: {type: string}
        fulfillment:
          type: object
          description: "Provisioning progress, read from the fulfillment operation rather than carried by the client."
          required: [status, attempts]
          properties:
            status: {type: string}
            attempts: {type: integer}
            errorCode: {type: string}
            updatedAt: {type: string, format: date-time}
        refunds:
          type: array
          items:
            type: object
            required: [status, amountMinor, currency, createdAt]
            properties:
              status: {type: string}
              amountMinor: {type: integer, format: int64}
              currency: {type: string}
              createdAt: {type: string, format: date-time}
    AccountOrderPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AccountOrder"}}
        nextCursor: {type: string}
        nextCursorId: {type: string, format: uuid}
    AccountWallet:
      type: object
      required: [balances, currency, topUp, entries]
      properties:
        balances:
          type: array
          description: "One entry per currency. Currencies are isolated; a balance in one never funds an order in another."
          items:
            type: object
            required: [currency, totalMinor, reservedMinor, availableMinor]
            properties:
              currency: {type: string}
              totalMinor: {type: integer, format: int64}
              reservedMinor: {type: integer, format: int64}
              availableMinor: {type: integer, format: int64}
        currency: {type: string}
        topUp:
          type: object
          required: [enabled, minimumMinor, maximumMinor, presets, providers]
          properties:
            enabled: {type: boolean}
            minimumMinor: {type: integer, format: int64}
            maximumMinor: {type: integer, format: int64}
            presets: {type: array, items: {type: integer, format: int64}}
            remainingWindowMinor: {type: integer, format: int64, description: "What the rolling-window limit still allows."}
            providers: {type: array, items: {$ref: "#/components/schemas/AccountPaymentChoice"}}
        entries:
          type: array
          items:
            type: object
            required: [id, type, amountMinor, currency, occurredAt]
            properties:
              id: {type: string, format: uuid}
              type: {type: string}
              amountMinor: {type: integer, format: int64}
              currency: {type: string}
              reason: {type: string}
              occurredAt: {type: string, format: date-time}
        nextCursor: {type: string}
        nextCursorId: {type: string, format: uuid}
    AccountReferrals:
      type: object
      required: [program, code, link, linkAvailable, invited, qualified, pending, rejected, rewardedMinor, reversedMinor, rewardCount, currency, rewards]
      properties:
        program:
          type: object
          required: [enabled, currency, inviterRewardMinor, inviteeRewardMinor, qualification]
          properties:
            enabled: {type: boolean}
            currency: {type: string}
            inviterRewardMinor: {type: integer, format: int64}
            inviteeRewardMinor: {type: integer, format: int64}
            qualification: {type: string}
            attributionValidityDays: {type: integer}
            inviterRewardCap: {type: integer, nullable: true}
            rewardExpiryDays: {type: integer, nullable: true}
            termsUrl: {type: string}
        code: {type: string}
        link: {type: string}
        linkAvailable: {type: boolean}
        linkReason:
          type: string
          enum: [public_url_not_configured, no_code]
          description: "Why no link could be built. The code is still shown; a link to nowhere is not."
        invited: {type: integer, format: int64}
        qualified: {type: integer, format: int64}
        pending: {type: integer, format: int64}
        rejected: {type: integer, format: int64}
        rewardedMinor: {type: integer, format: int64, description: "Excludes reversed rewards."}
        reversedMinor: {type: integer, format: int64}
        rewardCount: {type: integer}
        currency: {type: string}
        remainingSlots: {type: integer, nullable: true}
        rewards:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                required: [id, role, state, amountMinor, currency, grantedAt]
                properties:
                  id: {type: string, format: uuid}
                  role: {type: string, enum: [inviter, invitee]}
                  state: {type: string, enum: [pending, qualified, rejected]}
                  amountMinor: {type: integer, format: int64}
                  currency: {type: string}
                  grantedAt: {type: string, format: date-time}
                  reversedAt: {type: string, format: date-time}
            nextCursor: {type: string}
    AccountLoyalty:
      type: object
      required: [enabled]
      description: "`enabled: false` is the whole document when no program runs."
      properties:
        enabled: {type: boolean}
        rules:
          type: object
          properties:
            metric: {type: string}
            currency: {type: string}
            windowDays: {type: integer}
            graceDays: {type: integer}
            version: {type: string}
        tiers:
          type: array
          items:
            type: object
            required: [code, nameEn, nameRu, threshold, discountBps, current]
            properties:
              code: {type: string}
              nameEn: {type: string}
              nameRu: {type: string}
              threshold: {type: integer, format: int64}
              discountBps: {type: integer}
              current: {type: boolean}
        evaluated: {type: boolean}
        tier: {type: string}
        next: {type: string}
        metric: {type: integer, format: int64}
        remaining: {type: integer, format: int64}
        percent: {type: integer}
        evaluatedAt: {type: string, format: date-time}
        graceUntil: {type: string, format: date-time}
    AccountContact:
      type: object
      required: [id, kind, verified, transactional, marketing, createdAt]
      description: "Flags only. The stored value is never returned."
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [email, phone, telegram]}
        verified: {type: boolean}
        transactional: {type: boolean}
        marketing: {type: boolean}
        createdAt: {type: string, format: date-time}
    AccountContactList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AccountContact"}}
    AccountDeletion:
      type: object
      required: [pending, executedBy]
      properties:
        pending: {type: boolean}
        requestedAt: {type: string, format: date-time}
        cancelledAt: {type: string, format: date-time}
        reason: {type: string}
        executedBy:
          type: string
          description: "Who actually deletes. The panel records the request; the retention workflow carries it out."
    AccountPrivacy:
      type: object
      required: [retention, deletion, consents, export]
      properties:
        retention:
          type: object
          required: [status]
          properties:
            status: {type: string, enum: [active, suspended, deleted]}
            suspendedAt: {type: string, format: date-time}
            deletedAt: {type: string, format: date-time}
            anonymizedAt: {type: string, format: date-time}
            retentionUntil: {type: string, format: date-time}
        deletion: {$ref: "#/components/schemas/AccountDeletion"}
        consents:
          type: object
          required: [current, history]
          properties:
            current: {type: object, additionalProperties: {type: boolean}}
            history:
              type: array
              items:
                type: object
                required: [purpose, granted, occurredAt]
                properties:
                  purpose: {type: string, enum: [terms, privacy, marketing, profiling]}
                  granted: {type: boolean}
                  policyVersion: {type: string}
                  source: {type: string}
                  occurredAt: {type: string, format: date-time}
        export:
          type: object
          required: [sections, redactions, contactValuesAvailable]
          properties:
            sections: {type: array, items: {type: string}}
            redactions: {type: array, items: {type: string}}
            contactValuesAvailable: {type: boolean}
    AccountExport:
      type: object
      required: [version, generatedAt, profile, redactions, truncated]
      description: >-
        The customer's own records. It names what it left out in `redactions`
        and which sections hit the per-section row cap in `truncated`, because an
        export that silently omitted something would be worse than one that says
        so.
      properties:
        version: {type: string, enum: ["omniflow.account.export/1"]}
        generatedAt: {type: string, format: date-time}
        profile: {type: object}
        identities: {type: array, items: {type: object}}
        contacts: {type: array, items: {type: object}}
        subscriptions: {type: array, items: {type: object}}
        entitlements: {type: array, items: {type: object}}
        orders: {type: array, items: {type: object}}
        payments: {type: array, items: {type: object}}
        wallet: {type: array, items: {type: object}}
        support: {type: array, items: {type: object}}
        referral: {type: object}
        loyalty: {type: object}
        consents: {type: array, items: {type: object}}
        lifecycle: {type: array, items: {type: object}}
        redactions: {type: array, items: {type: string}}
        truncated: {type: array, items: {type: string}}
    AccountShopProduct:
      type: object
      required: [id, code, kind, name, currency, available, priceKnown]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        kind: {type: string, enum: [telegram_premium, telegram_stars]}
        name: {type: string}
        description: {type: string}
        currency: {type: string}
        available: {type: boolean}
        priceKnown:
          type: boolean
          description: >-
            Whether `priceMinor` is a published number. False means the product
            is priced when it is opened, so a screen never has to read a missing
            price as zero.
        priceMinor: {type: integer, format: int64}
        durationMonths: {type: integer, description: "Telegram Premium only."}
        starQuantity: {type: integer, description: "Telegram Stars only."}
    AccountShopProductList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AccountShopProduct"}}
    AccountShopQuote:
      type: object
      required: [priceMinor, currency, expiresAt]
      description: >-
        A price and the moment it stops applying. The two travel together so a
        client cannot hold one without the other.
      properties:
        priceMinor: {type: integer, format: int64}
        currency: {type: string}
        expiresAt: {type: string, format: date-time}
    AccountShopProductDetail:
      allOf:
        - {$ref: "#/components/schemas/AccountShopProduct"}
        - type: object
          required: [quantity, quote]
          properties:
            quantity: {type: integer}
            quote: {$ref: "#/components/schemas/AccountShopQuote"}
            promo:
              type: object
              required: [code, discountMinor]
              properties:
                code: {type: string}
                discountMinor: {type: integer, format: int64}
                rejection:
                  type: string
                  description: "Why the code does not apply. Previewed only; nothing is redeemed here."
    AccountShopDelivery:
      type: object
      required: [state, attempts, supportHandoff, supportReference]
      properties:
        state:
          type: string
          enum: [awaiting_payment, queued, submitted, polling, delayed, delivered, needs_review, refunded, failed, cancelled]
          description: >-
            `needs_review` is an ambiguous delivery parked for an operator. There
            is no retry route for it: the gateway honours no idempotency key, so
            retrying could deliver and charge twice.
        attempts: {type: integer}
        supportHandoff: {type: boolean, description: "True only for needs_review and failed."}
        supportReference: {type: string}
        failureReason:
          type: string
          enum: [retryable, permanent, recipient_invalid, provider_balance, provider_unavailable, ambiguous]
        deliveredAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        refund:
          type: object
          required: [amountMinor, currency]
          properties:
            amountMinor: {type: integer, format: int64}
            currency: {type: string}
    AccountShopOrder:
      type: object
      required: [id, productName, kind, quantity, recipient, forSelf, currency, amounts, payment, delivery]
      properties:
        id: {type: string, format: uuid}
        productName: {type: string}
        kind: {type: string, enum: [telegram_premium, telegram_stars]}
        quantity: {type: integer}
        recipient: {type: string}
        forSelf: {type: boolean}
        currency: {type: string}
        amounts:
          type: object
          required: [priceMinor, discountMinor, walletMinor, externalMinor, paidMinor]
          properties:
            priceMinor: {type: integer, format: int64}
            discountMinor: {type: integer, format: int64}
            walletMinor: {type: integer, format: int64}
            externalMinor: {type: integer, format: int64}
            paidMinor: {type: integer, format: int64}
        payment:
          type: object
          required: [state, required, possible]
          properties:
            state: {type: string}
            required: {type: boolean}
            possible: {type: boolean, description: "An enabled provider settles this currency. False is stated rather than dead-ended."}
        delivery: {$ref: "#/components/schemas/AccountShopDelivery"}
        createdAt: {type: string, format: date-time}
    AccountShopOrderPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AccountShopOrder"}}
        nextCursor: {type: string}
        nextCursorId: {type: string, format: uuid}
    AccountSupportLimits:
      type: object
      required: [maxAttachmentBytes, allowedMediaTypes, maxOpenTickets, maxSubjectLength, maxMessageLength]
      properties:
        maxAttachmentBytes: {type: integer, format: int64}
        allowedMediaTypes: {type: array, items: {type: string}}
        maxOpenTickets: {type: integer}
        maxSubjectLength: {type: integer}
        maxMessageLength: {type: integer}
    AccountTicket:
      type: object
      required: [id, subject, status, open, canReply, unreadCount, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        subject: {type: string}
        status: {type: string, enum: [open, pending, resolved, closed, merged]}
        open: {type: boolean, description: "Counts against the open-conversation quota."}
        canReply: {type: boolean}
        unreadCount: {type: integer}
        mergedIntoTicketId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AccountTicketPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AccountTicket"}}
        nextCursor: {type: string}
    AccountConversation:
      type: object
      required: [ticket, messages]
      properties:
        ticket: {$ref: "#/components/schemas/AccountTicket"}
        messages:
          type: array
          items:
            type: object
            required: [id, author, body, unread, createdAt]
            properties:
              id: {type: string}
              author: {type: string, enum: [customer, operator, system]}
              body: {type: string}
              unread: {type: boolean}
              createdAt: {type: string, format: date-time}
              attachments:
                type: array
                items:
                  type: object
                  required: [id, fileName, sizeBytes, downloadable]
                  properties:
                    id: {type: string, format: uuid}
                    fileName: {type: string}
                    mimeType: {type: string}
                    sizeBytes: {type: integer, format: int64}
                    downloadable:
                      type: boolean
                      description: "False for a file that lives in Telegram rather than here."
    AccountNewsPage:
      type: object
      required: [items, unreadCount, locale]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, category, title, body, read, publishedAt]
            properties:
              id: {type: string, format: uuid}
              slug: {type: string}
              category: {type: string, enum: [news, announcement, incident, maintenance]}
              title: {type: string}
              body: {type: string}
              read: {type: boolean}
              publishedAt: {type: string, format: date-time}
        unreadCount: {type: integer}
        locale: {type: string, enum: [ru, en]}
        nextCursor: {type: string}
    AccountPreferences:
      type: object
      required: [locale, notifications, marketing, contacts]
      properties:
        locale: {type: string, enum: [auto, ru, en]}
        notifications:
          type: object
          required: [expiry, traffic, renewal, news]
          properties:
            expiry: {type: boolean}
            traffic: {type: boolean}
            renewal: {type: boolean}
            news: {type: boolean}
        quietHours:
          type: object
          description: "Absent when unset."
          required: [startHour, endHour]
          properties:
            startHour: {type: integer, minimum: 0, maximum: 23}
            endHour: {type: integer, minimum: 0, maximum: 23}
        marketing:
          type: object
          required: [enabled]
          properties:
            enabled: {type: boolean}
            decidedAt: {type: string, format: date-time}
            source: {type: string, description: "Which surface recorded the decision."}
            policyVersion: {type: string}
        contacts:
          type: array
          description: "Flags only. The address itself is never returned."
          items:
            type: object
            required: [id, kind, verified, transactional, marketing, createdAt]
            properties:
              id: {type: string, format: uuid}
              kind: {type: string, enum: [email, phone, telegram]}
              verified: {type: boolean}
              transactional: {type: boolean}
              marketing: {type: boolean}
              createdAt: {type: string, format: date-time}
        suppression:
          type: object
          required: [reason, createdAt]
          properties:
            reason: {type: string, enum: [customer_request, bounced, complaint, operator]}
            createdAt: {type: string, format: date-time}
    AccountPreferencesUpdate:
      type: object
      description: >-
        Every field is optional and an absent field is left unchanged, so a
        screen that renders one toggle never sends back a document it did not
        read. Equal quiet-hours bounds clear the window.
      properties:
        locale: {type: string, enum: [auto, ru, en]}
        notifications:
          type: object
          properties:
            expiry: {type: boolean}
            traffic: {type: boolean}
            renewal: {type: boolean}
            news: {type: boolean}
        quietHours:
          type: object
          required: [startHour, endHour]
          properties:
            startHour: {type: integer, minimum: 0, maximum: 23}
            endHour: {type: integer, minimum: 0, maximum: 23}
        marketing: {type: boolean, description: "Appends a consent record; it never rewrites one."}
    CustomerOidcProvider:
      type: object
      required: [slug, displayName, issuer, discoveryUrl, clientId, scopes, enabled, requireVerifiedEmail, allowAutoProvision, hasClientSecret]
      properties:
        slug: {type: string}
        displayName: {type: string}
        issuer: {type: string, format: uri}
        discoveryUrl: {type: string, format: uri}
        clientId: {type: string}
        scopes: {type: array, items: {type: string}}
        enabled: {type: boolean}
        icon: {type: string, description: "Name of a shipped icon, never a third-party URL."}
        sortOrder: {type: integer}
        requireVerifiedEmail: {type: boolean}
        allowAutoProvision:
          type: boolean
          description: >-
            Whether a subject matching no existing customer may create one. It
            never adopts an existing customer by email address.
        hasClientSecret: {type: boolean}
    CustomerOidcProviderList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/CustomerOidcProvider"}}
    CustomerOidcProviderInput:
      type: object
      required: [slug, displayName, issuer, discoveryUrl, clientId]
      properties:
        slug: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]$"}
        displayName: {type: string, minLength: 1, maxLength: 80}
        issuer: {type: string, format: uri}
        discoveryUrl: {type: string, format: uri}
        clientId: {type: string}
        clientSecret:
          type: string
          description: >-
            Write-only. Omit to keep the stored secret; it is never returned.
        scopes: {type: array, items: {type: string}}
        enabled: {type: boolean, default: false}
        icon: {type: string}
        sortOrder: {type: integer, default: 0}
        requireVerifiedEmail: {type: boolean, default: true}
        allowAutoProvision: {type: boolean, default: true}
    CustomerOidcPresetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [slug, displayName, issuer, discoveryUrl, scopes, requireVerifiedEmail]
            properties:
              slug: {type: string}
              displayName: {type: string}
              issuer: {type: string, format: uri}
              discoveryUrl: {type: string, format: uri}
              scopes: {type: array, items: {type: string}}
              icon: {type: string}
              requireVerifiedEmail: {type: boolean}
              note: {type: string, description: "What the operator has to know that the form does not show."}
    PanelDeleted:
      type: object
      required: [deleted]
      properties:
        deleted: {type: boolean}
    PanelAIProvider:
      type: object
      required: [slug, kind, displayName, enabled, zeroRetention, trainsOnData, keyConfigured, lastCheckOk, updatedAt]
      properties:
        slug: {type: string, pattern: "^[a-z0-9][a-z0-9_-]{1,40}$"}
        kind: {type: string, enum: [openai_compatible, anthropic, gemini]}
        displayName: {type: string, minLength: 1, maxLength: 120}
        baseUrl:
          type: string
          description: >-
            Where the provider is reached. Required for the OpenAI-compatible
            adapter, which is how an owner points at a model they host
            themselves. It is an address rather than a secret and is returned.
        enabled: {type: boolean}
        zeroRetention:
          type: boolean
          description: >-
            The owner's answer from the provider's own terms. Omniflow cannot
            verify it and does not pretend to; it is recorded so the panel can
            warn before a feature is switched on rather than after data left.
        trainsOnData: {type: boolean}
        retentionNote: {type: string, maxLength: 2000}
        dataRegion: {type: string, maxLength: 60}
        keyConfigured:
          type: boolean
          description: Whether a credential is stored. The credential itself is never returned.
        lastCheckedAt: {type: string, format: date-time}
        lastCheckOk: {type: boolean}
        lastCheckError:
          type: string
          maxLength: 500
          description: >-
            Why the last test failed, or how the last one passed. It never
            carries the provider's own message, which can echo the prompt, and
            never a transport error, which can carry a key held in a query
            string.
        updatedAt: {type: string, format: date-time}
    PanelAIProviderList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/PanelAIProvider"}}
    PanelAIProviderInput:
      allOf:
        - {$ref: "#/components/schemas/PanelAIProvider"}
        - type: object
          properties:
            apiKey:
              type: string
              description: >-
                Write-only and never returned. Omitting it leaves the stored
                credential alone, so a display name can be corrected without
                re-pasting a secret.
    PanelAIProviderTestInput:
      type: object
      properties:
        model:
          type: string
          maxLength: 120
          description: >-
            Which model to test with. Omit it to use whatever model a feature
            already points at this provider — that is the configuration worth
            proving. A provider nothing points at yet has none to infer, and the
            request is refused rather than guessed.
  responses:
    Problem: {description: Request failed, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
