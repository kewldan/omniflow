openapi: 3.0.3
info:
  title: Omniflow API
  version: 1.0.0
  description: Customer, commerce, payment, wallet, fulfillment, and operations API for Omniflow.
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      description: Retained for compatibility. New deployments should probe /livez and /readyz.
      responses:
        "200": {description: Service is healthy, content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}
  /livez:
    get:
      operationId: getLiveness
      tags: [system]
      description: Answers as soon as the process is running. It never touches a dependency.
      responses:
        "200": {description: Process is alive, content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}
  /readyz:
    get:
      operationId: getReadiness
      tags: [system]
      description: >-
        Reports every registered dependency. Failures carry a stable
        classification, never an underlying driver message, so the response
        cannot leak a connection string or a credential.
      responses:
        "200": {description: Every dependency answered, content: {application/json: {schema: {$ref: "#/components/schemas/Readiness"}}}}
        "503": {description: At least one dependency is unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/Readiness"}}}}
  /metrics:
    get:
      operationId: getMetrics
      tags: [system]
      description: >-
        Prometheus text exposition. Every label is a bounded, non-identifying
        value such as a route template, a provider name, or an outcome.
      responses:
        "200": {description: Metrics in the Prometheus text format, content: {text/plain: {schema: {type: string}}}}
  /v1/catalog/plans:
    get:
      operationId: listPlans
      tags: [catalog]
      parameters:
        - {in: query, name: locale, schema: {type: string, enum: [ru, en], default: ru}}
      responses:
        "200": {description: Visible plans, content: {application/json: {schema: {$ref: "#/components/schemas/PlanList"}}}}
        "500": {$ref: "#/components/responses/Problem"}
  /v1/pages:
    get:
      operationId: listPublishedPages
      tags: [catalog]
      description: >-
        Public. The information pages an operator has published and listed: the
        FAQ, the terms, the offer, the privacy policy. It is unauthenticated by
        design — a payment provider's reviewer and an application store's
        reviewer both have to read the offer and the privacy policy without an
        account, and a customer deciding whether to become one has to read the
        terms before they do.
      parameters:
        - {in: query, name: locale, schema: {type: string, enum: [ru, en]}, description: "Falls back to Accept-Language, then to English."}
      responses:
        "200": {description: Published pages, content: {application/json: {schema: {$ref: "#/components/schemas/PublishedPageList"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pages/{slug}:
    get:
      operationId: getPublishedPage
      tags: [catalog]
      description: >-
        Public. One published document, returned as a parsed block structure
        rather than as HTML or as the operator's source text. The browser renders
        text nodes from it, so nothing an operator typed can become markup on the
        origin that holds the session cookie — there is no sanitiser in the path
        because there is nothing to sanitise.

        A draft, a deleted page, and a slug that never existed all answer 404:
        distinguishing them would tell an anonymous visitor whether a given
        address exists as a draft.

        The language falls back rather than 404ing, because the address is what a
        provider approved and what somebody bookmarked.
      parameters:
        - {in: path, name: slug, required: true, schema: {type: string}}
        - {in: query, name: locale, schema: {type: string, enum: [ru, en]}}
      responses:
        "200": {description: The page, content: {application/json: {schema: {$ref: "#/components/schemas/PublishedPage"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/analytics:
    get:
      operationId: getPublicAnalytics
      tags: [public]
      description: >-
        What an anonymous visitor's browser renders. Public, because the
        storefront is read before anybody signs in and the answer is the
        operator's configuration rather than anything about a person.

        `measurable` is false when nothing would run even with consent, which is
        what suppresses the consent request entirely — asking somebody to agree
        to nothing is worse than not asking. Counter identifiers appear only
        when measurement is enabled, and the browser renders them only after
        consent: this endpoint publishes what would run rather than deciding.

        Verification tags are present either way. They observe nobody.
      responses:
        "200": {description: Analytics, content: {application/json: {schema: {$ref: "#/components/schemas/PublicAnalytics"}}}}
  /v1/branding:
    get:
      operationId: getBranding
      tags: [catalog]
      description: >-
        Public. What an installation looks like, read by both panels before they
        paint: the service name, the operator's palette rendered as
        ready-to-inline declarations, and the addresses of the brand images. It
        deliberately carries nothing else, because everything here is readable by
        anyone who can reach the installation. Absent when no operator panel is
        configured, in which case the shipped design is used.
      responses:
        "200": {description: Branding, content: {application/json: {schema: {$ref: "#/components/schemas/Branding"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/branding/assets/{kind}:
    get:
      operationId: getBrandingAsset
      tags: [catalog]
      description: >-
        Public. One brand image. The `v` parameter carries the image's own
        SHA-256; a request naming the current one is answered as immutable, so a
        browser holds the bytes until the operator replaces them.
      parameters:
        - {in: path, name: kind, required: true, schema: {type: string, enum: [logo_light, logo_dark, favicon]}}
        - {in: query, name: v, schema: {type: string}, description: "The image checksum, as published by /v1/branding."}
      responses:
        "200":
          description: The image
          content:
            image/*: {schema: {type: string, format: binary}}
        "304": {description: Unchanged since the client copy}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/admin/plans:
    post:
      operationId: createPlan
      tags: [catalog]
      security: [{operatorToken: []}]
      requestBody: {$ref: "#/components/requestBodies/Plan"}
      responses:
        "201": {description: Plan created, content: {application/json: {schema: {$ref: "#/components/schemas/PlanMutation"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/admin/plans/{planID}/versions:
    post:
      operationId: createPlanVersion
      tags: [catalog]
      security: [{operatorToken: []}]
      parameters: [{$ref: "#/components/parameters/PlanID"}]
      requestBody: {$ref: "#/components/requestBodies/PlanVersion"}
      responses:
        "201": {description: Immutable plan version created, content: {application/json: {schema: {$ref: "#/components/schemas/PlanMutation"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/admin/promotions:
    post:
      operationId: createPromotion
      tags: [catalog]
      security: [{operatorToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/PromotionInput"}}}
      responses:
        "201": {description: Promotion created, content: {application/json: {schema: {$ref: "#/components/schemas/Promotion"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/admin/customers/{customerID}:
    patch:
      operationId: updateCustomer
      tags: [customers]
      security: [{operatorToken: []}]
      parameters: [{$ref: "#/components/parameters/CustomerID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CustomerPreferences"}}}}
      responses:
        "200": {description: Updated customer, content: {application/json: {schema: {$ref: "#/components/schemas/Customer"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/admin/customers/{customerID}/identities:
    post:
      operationId: linkCustomerIdentity
      tags: [customers]
      security: [{operatorToken: []}]
      parameters: [{$ref: "#/components/parameters/CustomerID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/IdentityInput"}}}}
      responses:
        "201": {description: Verified identity linked}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/admin/customers/{customerID}/identities/{identityID}:
    delete:
      operationId: unlinkCustomerIdentity
      tags: [customers]
      security: [{operatorToken: []}]
      parameters:
        - {$ref: "#/components/parameters/CustomerID"}
        - {in: path, name: identityID, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Identity unlinked}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/admin/customers/{customerID}/contacts:
    post:
      operationId: createContactChannel
      tags: [customers]
      security: [{operatorToken: []}]
      parameters: [{$ref: "#/components/parameters/CustomerID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ContactInput"}}}}
      responses:
        "201": {description: Encrypted contact channel created}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/admin/customers/{customerID}/consents:
    post:
      operationId: recordCustomerConsent
      tags: [customers]
      security: [{operatorToken: []}]
      parameters: [{$ref: "#/components/parameters/CustomerID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ConsentInput"}}}}
      responses:
        "201": {description: Append-only consent record created}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/admin/customers/{customerID}/lifecycle:
    post:
      operationId: applyCustomerLifecycle
      tags: [customers]
      security: [{operatorToken: []}]
      parameters: [{$ref: "#/components/parameters/CustomerID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/LifecycleInput"}}}}
      responses:
        "200": {description: Customer lifecycle updated, content: {application/json: {schema: {$ref: "#/components/schemas/Customer"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/admin/imports/remnawave/preview:
    post:
      operationId: previewRemnawaveImport
      tags: [imports]
      security: [{operatorToken: []}]
      parameters: [{$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {description: Import preview progress, content: {application/json: {schema: {$ref: "#/components/schemas/ImportRun"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/admin/imports/remnawave/{importID}/resume:
    post:
      operationId: resumeRemnawaveImport
      tags: [imports]
      security: [{operatorToken: []}]
      parameters: [{$ref: "#/components/parameters/ImportID"}, {$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {description: Import preview progress, content: {application/json: {schema: {$ref: "#/components/schemas/ImportRun"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/admin/imports/remnawave/{importID}/apply:
    post:
      operationId: applyRemnawaveImport
      tags: [imports]
      security: [{operatorToken: []}]
      parameters:
        - {$ref: "#/components/parameters/ImportID"}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200": {description: Import application progress, content: {application/json: {schema: {$ref: "#/components/schemas/ImportRun"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/admin/orders:
    post:
      operationId: createOrder
      tags: [orders]
      security: [{operatorToken: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/OrderInput"}}}}
      responses:
        "201": {description: Order created, content: {application/json: {schema: {$ref: "#/components/schemas/Order"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/admin/orders/{orderID}:
    get:
      operationId: getOrder
      tags: [orders]
      security: [{operatorToken: []}]
      parameters: [{$ref: "#/components/parameters/OrderID"}]
      responses:
        "200": {description: Order, content: {application/json: {schema: {$ref: "#/components/schemas/Order"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/admin/orders/{orderID}/cancel:
    post:
      operationId: cancelOrder
      tags: [orders]
      security: [{operatorToken: []}]
      parameters: [{$ref: "#/components/parameters/OrderID"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {reason: {type: string}}}}}}
      responses:
        "200": {description: Idempotently cancelled order, content: {application/json: {schema: {$ref: "#/components/schemas/Order"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/admin/orders/{orderID}/payments:
    post:
      operationId: createPaymentIntent
      tags: [payments]
      security: [{operatorToken: []}]
      parameters: [{$ref: "#/components/parameters/OrderID"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PaymentInput"}}}}
      responses:
        "201": {description: Provider-neutral payment intent, content: {application/json: {schema: {$ref: "#/components/schemas/PaymentIntent"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/payments/webhooks/{provider}:
    post:
      operationId: receivePaymentWebhook
      tags: [payments]
      parameters:
        - {in: path, name: provider, required: true, schema: {$ref: "#/components/schemas/PaymentProvider"}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses:
        "200": {description: Verified event accepted}
        "400": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
  /v1/admin/payments/{paymentID}/reconcile:
    post:
      operationId: reconcilePayment
      tags: [payments]
      security: [{operatorToken: []}]
      parameters: [{$ref: "#/components/parameters/PaymentID"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "200": {description: Reconciled payment, content: {application/json: {schema: {$ref: "#/components/schemas/PaymentIntent"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/admin/payments/{paymentID}/refunds:
    post:
      operationId: createRefund
      tags: [payments]
      security: [{operatorToken: []}]
      parameters: [{$ref: "#/components/parameters/PaymentID"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RefundInput"}}}}
      responses:
        "201": {description: Refund recorded, content: {application/json: {schema: {$ref: "#/components/schemas/Refund"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/admin/payments/{paymentID}/manual-decision:
    post:
      operationId: decideManualPayment
      tags: [payments]
      security: [{operatorToken: []}]
      parameters: [{$ref: "#/components/parameters/PaymentID"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ManualDecision"}}}}
      responses:
        "200": {description: Audited manual decision recorded}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/admin/customers/{customerID}/wallet-adjustments:
    post:
      operationId: adjustCustomerWallet
      tags: [wallet]
      security: [{operatorToken: []}]
      parameters: [{$ref: "#/components/parameters/CustomerID"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/WalletAdjustment"}}}}
      responses:
        "201": {description: Balanced append-only adjustment recorded}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/admin/fulfillment/drifts:
    get:
      operationId: listFulfillmentDrifts
      tags: [fulfillment]
      security: [{operatorToken: []}]
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200": {description: Operator-visible entitlement mismatch reasons, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/FulfillmentDrift"}}}}}}}
        "500": {$ref: "#/components/responses/Problem"}
  /v1/admin/entitlements/{entitlementID}/operations:
    post:
      operationId: enqueueFulfillmentOperation
      tags: [fulfillment]
      security: [{operatorToken: []}]
      parameters:
        - {$ref: "#/components/parameters/EntitlementID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/FulfillmentOperationInput"}}}}
      responses:
        "202": {description: Durable idempotent fulfillment operation queued, content: {application/json: {schema: {$ref: "#/components/schemas/FulfillmentOperation"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/admin/jobs:
    get:
      operationId: listJobs
      tags: [operations]
      security: [{operatorToken: []}]
      description: >-
        Durable job visibility. The default filter is the dead-letter queue:
        jobs that will not be retried again without an operator. Job arguments
        are never echoed and error text is redacted.
      parameters:
        - {in: query, name: state, schema: {type: string, enum: [dead_letter, retryable, running, available, scheduled, completed], default: dead_letter}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200": {description: Jobs in the requested state, content: {application/json: {schema: {$ref: "#/components/schemas/JobList"}}}}
        "400": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/admin/jobs/{jobID}/retry:
    post:
      operationId: retryJob
      tags: [operations]
      security: [{operatorToken: []}]
      description: >-
        Re-queues a dead-lettered job. The underlying fulfillment operation
        carries its own idempotency key, so a retry cannot repeat a side effect
        that already succeeded.
      parameters: [{$ref: "#/components/parameters/JobID"}]
      responses:
        "200": {description: Job re-queued, content: {application/json: {schema: {$ref: "#/components/schemas/Job"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/admin/jobs/{jobID}/cancel:
    post:
      operationId: cancelJob
      tags: [operations]
      security: [{operatorToken: []}]
      parameters: [{$ref: "#/components/parameters/JobID"}]
      responses:
        "200": {description: Job cancelled, content: {application/json: {schema: {$ref: "#/components/schemas/Job"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/admin/webhooks:
    get:
      operationId: listWebhookEvents
      tags: [operations]
      security: [{operatorToken: []}]
      description: >-
        Provider webhook intake history with verification status and outcome.
        The raw provider body is never returned.
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200": {description: Recent webhook events, content: {application/json: {schema: {$ref: "#/components/schemas/WebhookEventList"}}}}
        "500": {$ref: "#/components/responses/Problem"}
  /v1/admin/outbox:
    get:
      operationId: getOutboxStatus
      tags: [operations]
      security: [{operatorToken: []}]
      description: Unpublished domain-event count and the age of the oldest one.
      responses:
        "200": {description: Outbox lag, content: {application/json: {schema: {$ref: "#/components/schemas/OutboxStatus"}}}}
        "500": {$ref: "#/components/responses/Problem"}
  /v1/admin/backups:
    get:
      operationId: listBackups
      tags: [operations]
      security: [{operatorToken: []}]
      description: >-
        Backup history with size, integrity digest presence, and retention.
        Creating and restoring a backup is done from the bot, not the API.
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200": {description: Recent backups, content: {application/json: {schema: {$ref: "#/components/schemas/BackupList"}}}}
        "500": {$ref: "#/components/responses/Problem"}
  /v1/admin/maintenance:
    get:
      operationId: getMaintenance
      tags: [operations]
      security: [{operatorToken: []}]
      responses:
        "200": {description: Current maintenance state, content: {application/json: {schema: {$ref: "#/components/schemas/Maintenance"}}}}
        "500": {$ref: "#/components/responses/Problem"}
    put:
      operationId: setMaintenance
      tags: [operations]
      security: [{operatorToken: []}]
      description: >-
        Activates or clears maintenance mode manually. Maintenance blocks new
        purchases and holds outbound provisioning; it never cancels, refunds, or
        expires an order that is already paid. Automatic detection may clear a
        window it opened itself, but never one an operator opened.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MaintenanceInput"}}}}
      responses:
        "200": {description: Maintenance state applied, content: {application/json: {schema: {$ref: "#/components/schemas/Maintenance"}}}}
        "400": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # ---------------------------------------------------------------------------
  # Operator panel (v0.6)
  #
  # Session-cookie authenticated, CSRF-protected, and permission-gated. This is
  # a separate surface from /v1/admin, which the Telegram operator tooling
  # reaches with a shared bearer token and a different trust model.
  # ---------------------------------------------------------------------------
  /v1/panel/bootstrap:
    get:
      operationId: getPanelBootstrapStatus
      tags: [panel]
      security: []
      description: Reports whether the installation still needs its first owner.
      responses:
        "200": {description: Setup state, content: {application/json: {schema: {$ref: "#/components/schemas/BootstrapStatus"}}}}
    post:
      operationId: completePanelBootstrap
      tags: [panel]
      security: []
      description: >-
        Redeems the one-time setup token printed by the API on first start and
        creates the first owner. Refused once any operator account exists.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/BootstrapInput"}}}}
      responses:
        "201": {description: First owner created, content: {application/json: {schema: {$ref: "#/components/schemas/AdminAccount"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/auth/login:
    post:
      operationId: panelLogin
      tags: [panel]
      security: []
      description: >-
        Password factor. Answers identically for a wrong password, an unknown
        address, and a disabled account, so operator accounts cannot be
        enumerated. On success it sets the session cookie; when the account has
        TOTP enrolled the session authorizes nothing until the challenge passes.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/LoginInput"}}}}
      responses:
        "200": {description: Password accepted, content: {application/json: {schema: {$ref: "#/components/schemas/LoginResult"}}}}
        "401": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /v1/panel/auth/challenge:
    post:
      operationId: panelVerifyChallenge
      tags: [panel]
      security: []
      description: Completes the second factor with a TOTP code or a single-use recovery code.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChallengeInput"}}}}
      responses:
        "200": {description: Second factor accepted, content: {application/json: {schema: {$ref: "#/components/schemas/LoginResult"}}}}
        "401": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /v1/panel/auth/password-reset:
    post:
      operationId: panelRequestPasswordReset
      tags: [panel]
      security: []
      description: >-
        Always answers 202, whether or not the address matched an account, so
        the endpoint never discloses which addresses are registered.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PasswordResetRequestInput"}}}}
      responses:
        "202": {description: Request accepted}
  /v1/panel/auth/password-reset/complete:
    post:
      operationId: panelCompletePasswordReset
      tags: [panel]
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PasswordResetCompleteInput"}}}}
      responses:
        "204": {description: Password reset and every session ended}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/auth/session:
    get:
      operationId: getPanelSession
      tags: [panel]
      description: >-
        The current operator, their effective permissions, and the CSRF token.
        The panel renders from these permissions, which are the same set the API
        enforces.
      responses:
        "200": {description: Current session, content: {application/json: {schema: {$ref: "#/components/schemas/PanelSession"}}}}
        "401": {$ref: "#/components/responses/Problem"}
  /v1/panel/auth/logout:
    post:
      operationId: panelLogout
      tags: [panel]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      responses:
        "204": {description: Session ended}
  /v1/panel/auth/logout-all:
    post:
      operationId: panelLogoutAll
      tags: [panel]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      description: Ends every other session, sparing the one making the request.
      responses:
        "200": {description: Sessions ended, content: {application/json: {schema: {type: object, required: [revokedSessions], properties: {revokedSessions: {type: integer, format: int64}}}}}}
  /v1/panel/auth/profile:
    patch:
      operationId: updatePanelProfile
      tags: [panel]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ProfileInput"}}}}
      responses:
        "200": {description: Profile saved, content: {application/json: {schema: {$ref: "#/components/schemas/AdminAccount"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/auth/password:
    post:
      operationId: changePanelPassword
      tags: [panel]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      description: Rotates the password and ends every other session.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PasswordChangeInput"}}}}
      responses:
        "204": {description: Password changed}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/auth/sessions:
    get:
      operationId: listPanelSessions
      tags: [panel]
      responses:
        "200": {description: Live sessions, content: {application/json: {schema: {$ref: "#/components/schemas/SessionList"}}}}
  /v1/panel/auth/sessions/{sessionID}:
    delete:
      operationId: revokePanelSession
      tags: [panel]
      parameters:
        - {in: path, name: sessionID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204": {description: Session ended}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/panel/auth/totp:
    post:
      operationId: beginPanelTotpEnrolment
      tags: [panel]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      description: >-
        Issues a secret and otpauth URI. The secret is stored unconfirmed and
        satisfies no login challenge until the first code is verified.
      responses:
        "200": {description: Enrolment started, content: {application/json: {schema: {$ref: "#/components/schemas/TotpEnrolment"}}}}
    delete:
      operationId: disablePanelTotp
      tags: [panel]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      description: Removes the second factor. The password is re-proven first.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PasswordConfirmInput"}}}}
      responses:
        "204": {description: Two-factor disabled}
        "401": {$ref: "#/components/responses/Problem"}
  /v1/panel/auth/totp/confirm:
    post:
      operationId: confirmPanelTotpEnrolment
      tags: [panel]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      description: Activates the second factor and returns the recovery codes exactly once.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChallengeInput"}}}}
      responses:
        "200": {description: Two-factor enabled, content: {application/json: {schema: {$ref: "#/components/schemas/RecoveryCodes"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/auth/recovery-codes:
    post:
      operationId: regeneratePanelRecoveryCodes
      tags: [panel]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      description: Replaces the whole set, invalidating any unused code.
      responses:
        "200": {description: New codes, content: {application/json: {schema: {$ref: "#/components/schemas/RecoveryCodes"}}}}
  /v1/panel/auth/passkey:
    get:
      operationId: panelPasskeyAvailability
      tags: [panel]
      description: >-
        Whether this installation can offer passkeys. A credential is bound to
        an origin, so an installation without a public URL has none and the
        sign-in screen omits the button rather than offering a broken one.
      responses:
        "200": {description: Availability, content: {application/json: {schema: {$ref: "#/components/schemas/PasskeyAvailability"}}}}
  /v1/panel/auth/passkey/login/begin:
    post:
      operationId: beginPanelPasskeyLogin
      tags: [panel]
      description: >-
        Issues a WebAuthn assertion challenge. Public by necessity: the
        assertion is what proves who the operator is. The challenge is returned
        to the browser and also sealed into a short-lived cookie, so the second
        step answers the challenge this step issued.
      responses:
        "200": {description: Assertion options, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "429": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/panel/auth/passkey/login/finish:
    post:
      operationId: finishPanelPasskeyLogin
      tags: [panel]
      description: >-
        Verifies the assertion and starts a complete session. challengeRequired
        is always false: the authenticator proved possession and verified the
        person, so no second factor remains to ask for.
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses:
        "200": {description: Signed in, content: {application/json: {schema: {$ref: "#/components/schemas/LoginResult"}}}}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/panel/auth/passkeys:
    get:
      operationId: listPanelPasskeys
      tags: [panel]
      description: The signed-in operator's own credentials. No public key is returned.
      responses:
        "200": {description: Registered passkeys, content: {application/json: {schema: {$ref: "#/components/schemas/PasskeyList"}}}}
  /v1/panel/auth/passkeys/register/begin:
    post:
      operationId: beginPanelPasskeyRegistration
      tags: [panel]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      description: >-
        Issues a WebAuthn creation challenge for a discoverable credential with
        user verification required, which is what lets the key sign in alone.
      responses:
        "200": {description: Creation options, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/panel/auth/passkeys/register/finish:
    post:
      operationId: finishPanelPasskeyRegistration
      tags: [panel]
      description: >-
        Stores the new credential. The label travels in the query because the
        body is the credential and has a shape fixed by WebAuthn.
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
        - {in: query, name: label, schema: {type: string, maxLength: 60}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses:
        "200": {description: Passkey registered, content: {application/json: {schema: {$ref: "#/components/schemas/Passkey"}}}}
        "400": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/panel/auth/passkeys/{passkeyID}:
    patch:
      operationId: renamePanelPasskey
      tags: [panel]
      parameters:
        - {in: path, name: passkeyID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PasskeyLabelInput"}}}}
      responses:
        "200": {description: Passkey renamed, content: {application/json: {schema: {$ref: "#/components/schemas/Passkey"}}}}
        "404": {$ref: "#/components/responses/Problem"}
    delete:
      operationId: revokePanelPasskey
      tags: [panel]
      description: >-
        Removes one credential. Never an account-recovery event: the password
        and its second factor are untouched, so the last key can go too.
      parameters:
        - {in: path, name: passkeyID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204": {description: Passkey removed}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/panel/admins:
    get:
      operationId: listPanelAdmins
      tags: [panel]
      description: Requires admins.read.
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/PageSize"}
        - {in: query, name: status, schema: {type: string, enum: [active, suspended, disabled]}}
      responses:
        "200": {description: Operator accounts, content: {application/json: {schema: {$ref: "#/components/schemas/AdminAccountPage"}}}}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createPanelAdmin
      tags: [panel]
      description: Requires admins.write, which only the owner role holds.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdminAccountInput"}}}}
      responses:
        "201": {description: Operator created, content: {application/json: {schema: {$ref: "#/components/schemas/AdminAccount"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/admins/{adminID}:
    get:
      operationId: getPanelAdmin
      tags: [panel]
      parameters: [{$ref: "#/components/parameters/AdminID"}]
      responses:
        "200": {description: Operator, content: {application/json: {schema: {$ref: "#/components/schemas/AdminAccount"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/panel/admins/{adminID}/roles:
    put:
      operationId: setPanelAdminRoles
      tags: [panel]
      description: >-
        Requires admins.roles. Removing the last active owner is refused, and
        only an owner may grant the owner role.
      parameters:
        - {$ref: "#/components/parameters/AdminID"}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RolesInput"}}}}
      responses:
        "200": {description: Roles changed, content: {application/json: {schema: {$ref: "#/components/schemas/AdminAccount"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/panel/admins/{adminID}/status:
    post:
      operationId: setPanelAdminStatus
      tags: [panel]
      description: >-
        Requires admins.write. Suspending an operator revokes their live
        sessions immediately; suspending the last active owner is refused.
      parameters:
        - {$ref: "#/components/parameters/AdminID"}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdminStatusInput"}}}}
      responses:
        "200": {description: Status changed, content: {application/json: {schema: {$ref: "#/components/schemas/AdminAccount"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/panel/audit:
    get:
      operationId: searchPanelAudit
      tags: [panel]
      description: Requires audit.read. The trail is append-only and exposes reads only.
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/PageSize"}
        - {in: query, name: category, schema: {$ref: "#/components/schemas/AuditCategory"}}
        - {in: query, name: outcome, schema: {$ref: "#/components/schemas/AuditOutcome"}}
        - {in: query, name: actorType, schema: {type: string}}
        - {in: query, name: actorId, schema: {type: string}}
        - {in: query, name: action, schema: {type: string}}
        - {in: query, name: targetType, schema: {type: string}}
        - {in: query, name: targetId, schema: {type: string}}
        - {in: query, name: from, schema: {type: string, format: date-time}}
        - {in: query, name: to, schema: {type: string, format: date-time}}
      responses:
        "200": {description: Audit events, content: {application/json: {schema: {$ref: "#/components/schemas/AuditPage"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/audit/actions:
    get:
      operationId: listPanelAuditActions
      tags: [panel]
      responses:
        "200": {description: Distinct action names, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {type: string}}}}}}}
  /v1/panel/audit/export:
    get:
      operationId: exportPanelAudit
      tags: [panel]
      description: >-
        Requires audit.export. Streams the filtered trail as CSV with the same
        columns the browser shows. Nothing writes a secret into an audit row.
      responses:
        "200": {description: CSV export, content: {text/csv: {schema: {type: string}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/rbac/catalog:
    get:
      operationId: getPanelRbacCatalog
      tags: [panel]
      description: The compiled-in permission catalogue and the built-in role definitions.
      responses:
        "200": {description: Catalogue, content: {application/json: {schema: {$ref: "#/components/schemas/RbacCatalog"}}}}
  # --- v0.7 operator operations -------------------------------------------
  # Every path below requires an authenticated panel session and the permission
  # named in its description. The permission is enforced in the Go API at the
  # route, not inside the handler, and the panel renders from the same
  # compiled-in catalogue.
  /v1/panel/overview/dashboard:
    get:
      operationId: getPanelDashboard
      tags: [panel]
      description: >-
        Requires system.read. Each metric carries the identifier of its own
        definition, every timestamp is UTC, and revenue is reported as three
        separate figures rather than one that double-counts wallet credit.
      responses:
        "200": {description: Operations overview, content: {application/json: {schema: {$ref: "#/components/schemas/PanelDashboard"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/overview/incidents:
    get:
      operationId: listPanelIncidents
      tags: [panel]
      description: Requires system.read. Recent maintenance activations and recoveries.
      parameters: [{$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {description: Maintenance history, content: {application/json: {schema: {$ref: "#/components/schemas/PanelIncidentList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers:
    get:
      operationId: searchPanelCustomers
      tags: [panel]
      description: >-
        Requires customers.read. `q` accepts an Omniflow customer identifier, a
        Telegram identifier, or a Remnawave username and is resolved by shape.
        There is deliberately no free-text search over contact values.
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/PageSize"}
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: status, schema: {type: string, enum: [active, suspended, deleted]}}
        - {in: query, name: segment, schema: {type: string, enum: [subscribed, lapsed, never_purchased, flagged]}}
      responses:
        "200": {description: Customers, content: {application/json: {schema: {$ref: "#/components/schemas/PanelCustomerPage"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}:
    get:
      operationId: getPanelCustomer
      tags: [panel]
      description: Requires customers.read.
      parameters: [{$ref: "#/components/parameters/CustomerID"}]
      responses:
        "200": {description: Customer profile, content: {application/json: {schema: {$ref: "#/components/schemas/PanelCustomerProfile"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/subscriptions:
    get:
      operationId: listPanelCustomerSubscriptions
      tags: [panel]
      description: Requires customers.read. Every concurrent subscription with its own Remnawave mapping.
      parameters: [{$ref: "#/components/parameters/CustomerID"}]
      responses:
        "200": {description: Subscriptions, content: {application/json: {schema: {$ref: "#/components/schemas/PanelSubscriptionList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/orders:
    get:
      operationId: listPanelCustomerOrders
      tags: [panel]
      description: Requires customers.read.
      parameters: [{$ref: "#/components/parameters/CustomerID"}, {$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {description: Orders, content: {application/json: {schema: {$ref: "#/components/schemas/PanelOrderList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/tickets:
    get:
      operationId: listPanelCustomerTickets
      tags: [panel]
      description: Requires customers.read.
      parameters: [{$ref: "#/components/parameters/CustomerID"}, {$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {description: Support tickets, content: {application/json: {schema: {$ref: "#/components/schemas/PanelTicketList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/consents:
    get:
      operationId: listPanelCustomerConsents
      tags: [panel]
      description: Requires customers.read. The latest recorded decision per purpose.
      parameters: [{$ref: "#/components/parameters/CustomerID"}]
      responses:
        "200": {description: Consent records, content: {application/json: {schema: {$ref: "#/components/schemas/PanelConsentList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/wallet:
    get:
      operationId: listPanelCustomerWallet
      tags: [panel]
      description: >-
        Requires finance.read rather than customer access: a support operator can
        see that a customer has a balance without reading every movement that
        produced it. The ledger is append-only and exposes reads only.
      parameters: [{$ref: "#/components/parameters/CustomerID"}, {$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {description: Ledger movements, content: {application/json: {schema: {$ref: "#/components/schemas/PanelLedgerList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/payment-methods:
    get:
      operationId: listPanelCustomerPaymentMethods
      tags: [panel]
      description: >-
        Requires finance.read. A saved method is a provider token and a masked
        label the provider supplied; neither the token nor any card data is
        returned.
      parameters: [{$ref: "#/components/parameters/CustomerID"}]
      responses:
        "200": {description: Saved methods, content: {application/json: {schema: {$ref: "#/components/schemas/PanelSavedMethodList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/payment-methods/{methodID}:
    delete:
      operationId: revokePanelPaymentMethod
      tags: [panel]
      description: >-
        Requires finance.write. Marks the method revoked and keeps the row, so a
        historical charge still resolves to the method that made it.
      parameters:
        - {$ref: "#/components/parameters/CustomerID"}
        - {in: path, name: methodID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204": {description: Revoked}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/charges:
    get:
      operationId: listPanelCustomerCharges
      tags: [panel]
      description: Requires finance.read. Automatic renewal attempts for this customer.
      parameters: [{$ref: "#/components/parameters/CustomerID"}, {$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {description: Charge attempts, content: {application/json: {schema: {$ref: "#/components/schemas/PanelDunningList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/risk:
    get:
      operationId: listPanelCustomerRisk
      tags: [panel]
      description: Requires risk.read. Blocklist matches recorded against this customer.
      parameters: [{$ref: "#/components/parameters/CustomerID"}]
      responses:
        "200": {description: Matches, content: {application/json: {schema: {$ref: "#/components/schemas/PanelMatchList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/status:
    post:
      operationId: setPanelCustomerStatus
      tags: [panel]
      description: >-
        Requires customers.write and a reason. Suspension does not disable a
        Remnawave user directly: the fulfillment pipeline observes customer
        state, and bypassing it would leave the two disagreeing.
      parameters:
        - {$ref: "#/components/parameters/CustomerID"}
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/OperatorReason"}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [active, suspended]}}}}}}
      responses:
        "200": {description: Updated profile, content: {application/json: {schema: {$ref: "#/components/schemas/PanelCustomerProfile"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/subscriptions/{subscriptionID}:
    patch:
      operationId: renamePanelSubscription
      tags: [panel]
      description: >-
        Requires subscriptions.write. The label is the only subscription
        attribute the panel edits directly; expiry, traffic, limits, squads, and
        enabled state belong to Remnawave and change through fulfillment.
      parameters:
        - {$ref: "#/components/parameters/CustomerID"}
        - {in: path, name: subscriptionID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [label], properties: {label: {type: string, minLength: 1, maxLength: 40}}}}}}
      responses:
        "204": {description: Renamed}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/allowlist:
    put:
      operationId: allowlistPanelCustomer
      tags: [panel]
      description: >-
        Requires risk.write and a reason. Without an override an operator's
        decision would be undone the moment the source republished the entry.
      parameters:
        - {$ref: "#/components/parameters/CustomerID"}
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/OperatorReason"}
      responses:
        "204": {description: Allowlisted}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    delete:
      operationId: removePanelAllowlist
      tags: [panel]
      description: Requires risk.write.
      parameters: [{$ref: "#/components/parameters/CustomerID"}, {$ref: "#/components/parameters/CSRFToken"}]
      responses:
        "204": {description: Removed}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/catalog/plans:
    get:
      operationId: listPanelPlans
      tags: [panel]
      description: >-
        Requires catalog.read. Archived plans are included, with how many order
        lines reference each, so archiving one in active use is a visible
        decision.
      responses:
        "200": {description: Plans, content: {application/json: {schema: {$ref: "#/components/schemas/PanelPlanList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/catalog/plans/{planID}:
    get:
      operationId: getPanelPlan
      tags: [panel]
      description: Requires catalog.read. The plan with its localisations and priced versions.
      parameters: [{$ref: "#/components/parameters/PlanID"}]
      responses:
        "200": {description: Plan detail, content: {application/json: {schema: {$ref: "#/components/schemas/PanelPlanDetail"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      operationId: updatePanelPlanPresentation
      tags: [panel]
      description: >-
        Requires catalog.write. Visibility, ordering, and the per-plan
        concurrency cap are saved together, so two operators editing one plan
        cannot each drop the other's change.
      parameters: [{$ref: "#/components/parameters/PlanID"}, {$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelPlanPresentation"}}}}
      responses:
        "204": {description: Saved}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/catalog/plans/{planID}/archive:
    post:
      operationId: archivePanelPlan
      tags: [panel]
      description: >-
        Requires catalog.write. Archiving stops new purchases and leaves every
        order that already bought the plan priced against its immutable version.
      parameters: [{$ref: "#/components/parameters/PlanID"}, {$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [archived], properties: {archived: {type: boolean}}}}}}
      responses:
        "204": {description: Saved}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/catalog/plans/{planID}/localizations/{locale}:
    put:
      operationId: savePanelPlanLocalization
      tags: [panel]
      description: Requires catalog.write.
      parameters:
        - {$ref: "#/components/parameters/PlanID"}
        - {in: path, name: locale, required: true, schema: {type: string, enum: [ru, en]}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelLocalization"}}}}
      responses:
        "204": {description: Saved}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/catalog/plan-versions/{planVersionID}/retire:
    post:
      operationId: retirePanelPlanVersion
      tags: [panel]
      description: >-
        Requires catalog.write. Retiring is forward-looking: every order that
        bought the version keeps its price.
      parameters:
        - {in: path, name: planVersionID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204": {description: Retired}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/panel/catalog/addons:
    get:
      operationId: listPanelAddons
      tags: [panel]
      description: Requires catalog.read.
      responses:
        "200": {description: Add-ons, content: {application/json: {schema: {$ref: "#/components/schemas/PanelAddonList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/catalog/addons/{addonID}/versions:
    get:
      operationId: listPanelAddonVersions
      tags: [panel]
      description: Requires catalog.read. Each version carries its documented proration rule.
      parameters: [{in: path, name: addonID, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Add-on versions, content: {application/json: {schema: {$ref: "#/components/schemas/PanelAddonVersionList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/catalog/promotions:
    get:
      operationId: listPanelPromotions
      tags: [panel]
      description: Requires catalog.read. Promotions with their redemption analytics.
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {in: query, name: active, schema: {type: boolean}}
        - {in: query, name: kind, schema: {$ref: "#/components/schemas/PanelPromotionKind"}}
      responses:
        "200": {description: Promotions, content: {application/json: {schema: {$ref: "#/components/schemas/PanelPromotionList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/catalog/promotions/{promotionID}:
    patch:
      operationId: updatePanelPromotion
      tags: [panel]
      description: >-
        Requires catalog.write. The reward kind is not editable: changing a live
        promotion's kind would silently change what every unredeemed code is
        worth.
      parameters:
        - {in: path, name: promotionID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelPromotionUpdate"}}}}
      responses:
        "204": {description: Saved}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/catalog/promotions/{promotionID}/codes:
    get:
      operationId: listPanelPromoCodes
      tags: [panel]
      description: Requires catalog.read.
      parameters: [{in: path, name: promotionID, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Promo codes, content: {application/json: {schema: {$ref: "#/components/schemas/PanelPromoCodeList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/catalog/promo-codes/{promoCodeID}/status:
    post:
      operationId: setPanelPromoCodeActive
      tags: [panel]
      description: >-
        Requires catalog.write. A code is never deleted: the redemptions that
        reference it are financial records.
      parameters:
        - {in: path, name: promoCodeID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [active], properties: {active: {type: boolean}}}}}}
      responses:
        "204": {description: Saved}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/offers:
    get:
      operationId: searchPanelOffers
      tags: [panel]
      description: Requires marketing.read.
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/PageSize"}
        - {in: query, name: status, schema: {type: string, enum: [active, redeemed, dismissed, expired, revoked]}}
        - {in: query, name: customerId, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Personal offers, content: {application/json: {schema: {$ref: "#/components/schemas/PanelOfferPage"}}}}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createPanelOffer
      tags: [panel]
      description: >-
        Requires marketing.write. Both locales are required: an offer with copy
        in one language renders as a blank card for half the customer base.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelOfferInput"}}}}
      responses:
        "201": {description: Offer created, content: {application/json: {schema: {$ref: "#/components/schemas/PanelOffer"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/offers/{offerID}/revoke:
    post:
      operationId: revokePanelOffer
      tags: [panel]
      description: Requires marketing.write. Only an offer that has not been redeemed may be withdrawn.
      parameters:
        - {in: path, name: offerID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204": {description: Revoked}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/panel/finance/orders:
    get:
      operationId: searchPanelOrders
      tags: [panel]
      description: Requires finance.read.
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/PageSize"}
        - {in: query, name: state, schema: {type: string}}
        - {in: query, name: operation, schema: {type: string}}
        - {in: query, name: customerId, schema: {type: string, format: uuid}}
        - {in: query, name: currency, schema: {type: string}}
        - {in: query, name: from, schema: {type: string, format: date-time}}
        - {in: query, name: to, schema: {type: string, format: date-time}}
      responses:
        "200": {description: Orders, content: {application/json: {schema: {$ref: "#/components/schemas/PanelOrderPage"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/finance/orders/{orderID}:
    get:
      operationId: getPanelOrderDetail
      tags: [panel]
      description: >-
        Requires finance.read. Payment intents with their event timeline and
        every refund. The raw provider payload is deliberately absent; it is
        reachable through the webhook diagnostics with its own permission.
      parameters: [{$ref: "#/components/parameters/OrderID"}]
      responses:
        "200": {description: Order timeline, content: {application/json: {schema: {$ref: "#/components/schemas/PanelOrderDetail"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/panel/finance/orders/{orderID}/refund:
    post:
      operationId: recordPanelRefund
      tags: [panel]
      description: >-
        Requires finance.write and a reason. The refund itself is executed by
        the payment service against the provider's own capabilities; this
        records the decision and its rationale.
      parameters:
        - {$ref: "#/components/parameters/OrderID"}
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/OperatorReason"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelRefundRecord"}}}}
      responses:
        "202": {description: Recorded}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/finance/payments/{paymentIntentID}/reconcile:
    post:
      operationId: reconcilePanelPayment
      tags: [panel]
      description: >-
        Requires finance.write. Re-polling is performed by the idempotent
        payment service; the panel never decides how a payment settles.
      parameters:
        - {in: path, name: paymentIntentID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {outcome: {type: string}}}}}}
      responses:
        "202": {description: Recorded}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/finance/stuck-payments:
    get:
      operationId: listPanelStuckPayments
      tags: [panel]
      description: Requires finance.read. Intents in flight longer than any supported provider should take.
      parameters: [{$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {description: Reconciliation queue, content: {application/json: {schema: {$ref: "#/components/schemas/PanelStuckPaymentList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/finance/failed-charges:
    get:
      operationId: listPanelFailedCharges
      tags: [panel]
      description: >-
        Requires finance.read. A review surface: a failed charge retries on its
        own bounded schedule and nothing here re-triggers one.
      parameters: [{$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {description: Failed charges, content: {application/json: {schema: {$ref: "#/components/schemas/PanelDunningPage"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/finance/export:
    get:
      operationId: exportPanelFinance
      tags: [panel]
      description: >-
        Requires finance.read. Streams the filtered orders as CSV. The schema is
        stable — a later version appends a column and never inserts one. Amounts
        are integers in the currency's minor unit and every timestamp is UTC.
      parameters:
        - {in: query, name: state, schema: {type: string}}
        - {in: query, name: from, schema: {type: string, format: date-time}}
        - {in: query, name: to, schema: {type: string, format: date-time}}
      responses:
        "200": {description: CSV export, content: {text/csv: {schema: {type: string}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/system/jobs:
    get:
      operationId: searchPanelFulfillment
      tags: [panel]
      description: >-
        Requires system.read. Filtering on the failed status is the dead-letter
        view. The error code is a classification, never a provider message.
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/PageSize"}
        - {in: query, name: status, schema: {type: string}}
        - {in: query, name: operation, schema: {type: string}}
        - {in: query, name: entitlementId, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Fulfillment operations, content: {application/json: {schema: {$ref: "#/components/schemas/PanelFulfillmentPage"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/system/jobs/{operationID}/history:
    get:
      operationId: getPanelFulfillmentHistory
      tags: [panel]
      description: >-
        Requires system.read. Status, correlation, and error classification
        only: the stored request and response summaries can carry a subscription
        link and are not returned.
      parameters: [{in: path, name: operationID, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Attempts, content: {application/json: {schema: {$ref: "#/components/schemas/PanelFulfillmentAttemptList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/system/jobs/{operationID}/retry:
    post:
      operationId: retryPanelFulfillment
      tags: [panel]
      description: >-
        Requires system.write. The retry keeps the operation's idempotency key,
        so the worker still performs it exactly once. A succeeded operation is
        not retryable.
      parameters:
        - {in: path, name: operationID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "200": {description: Requeued, content: {application/json: {schema: {$ref: "#/components/schemas/PanelFulfillmentOperation"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/panel/system/jobs/{operationID}/cancel:
    post:
      operationId: cancelPanelFulfillment
      tags: [panel]
      description: Requires system.write. A completed provisioning cannot be retracted.
      parameters:
        - {in: path, name: operationID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204": {description: Cancelled}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/panel/system/webhooks:
    get:
      operationId: searchPanelWebhooks
      tags: [panel]
      description: >-
        Requires system.read. The raw body is not returned: it can contain a
        provider payload, and "did this arrive and was it accepted" needs only
        the status.
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/PageSize"}
        - {in: query, name: provider, schema: {type: string}}
        - {in: query, name: status, schema: {type: string}}
      responses:
        "200": {description: Webhook events, content: {application/json: {schema: {$ref: "#/components/schemas/PanelWebhookPage"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/system/webhooks/{eventID}/replay:
    post:
      operationId: replayPanelWebhook
      tags: [panel]
      description: >-
        Requires system.write. Only a failed or ignored event may be replayed.
        Reprocessing is keyed on the provider event identifier, so a second pass
        reaches the same terminal state instead of applying twice.
      parameters:
        - {in: path, name: eventID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "202": {description: Queued for reprocessing}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/panel/system/drift:
    get:
      operationId: listPanelDrift
      tags: [panel]
      description: Requires system.read. Unresolved differences between Omniflow and Remnawave.
      parameters: [{$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {description: Drift records, content: {application/json: {schema: {$ref: "#/components/schemas/PanelDriftList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/system/outbox:
    get:
      operationId: listPanelOutbox
      tags: [panel]
      description: >-
        Requires system.read. Topic and age only: an outbox payload is a domain
        event that can name a customer and an amount.
      parameters: [{$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {description: Outbox backlog, content: {application/json: {schema: {$ref: "#/components/schemas/PanelOutboxList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/commerce:
    get:
      operationId: getPanelCommerceSettings
      tags: [panel]
      description: Requires settings.read.
      responses:
        "200": {description: Commerce settings, content: {application/json: {schema: {$ref: "#/components/schemas/PanelCommerceSettings"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/commerce/topup:
    put:
      operationId: savePanelTopUpSettings
      tags: [panel]
      description: Requires settings.write. A preset outside the limits is a button that always fails.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelTopUpSettings"}}}}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/PanelCommerceSettings"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/commerce/subscriptions:
    put:
      operationId: savePanelSubscriptionSettings
      tags: [panel]
      description: >-
        Requires settings.write. Turning concurrency off closes nothing:
        customers who already hold several keep them.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelSubscriptionSettings"}}}}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/PanelCommerceSettings"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/content/pages:
    get:
      operationId: listPanelInfoPages
      tags: [panel]
      description: Requires marketing.read. Every page, drafts included.
      responses:
        "200": {description: Pages, content: {application/json: {schema: {$ref: "#/components/schemas/PanelInfoPageList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
    put:
      operationId: savePanelInfoPage
      tags: [panel]
      description: >-
        Requires marketing.write. Creates or updates a page and its translations.
        A language with a title and no body, or the reverse, is refused: half a
        translation renders a heading over nothing. A page with no language at
        all is refused for the same reason.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelInfoPage"}}}}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/PanelInfoPage"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/content/pages/{slug}:
    get:
      operationId: getPanelInfoPage
      tags: [panel]
      description: Requires marketing.read. One page with every translation's source text, for the editor.
      parameters: [{in: path, name: slug, required: true, schema: {type: string}}]
      responses:
        "200": {description: The page, content: {application/json: {schema: {$ref: "#/components/schemas/PanelInfoPage"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    delete:
      operationId: deletePanelInfoPage
      tags: [panel]
      description: >-
        Requires marketing.write. Deletes the page and takes its address with it.
        Withdrawing publication instead is the reversible operation, and is what
        an operator wants unless they mean to break a URL a payment provider
        approved.
      parameters:
        - {in: path, name: slug, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "200": {description: Removed, content: {application/json: {schema: {type: object, properties: {removed: {type: boolean}}}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/panel/content/pages/{slug}/publication:
    post:
      operationId: setPanelInfoPagePublication
      tags: [panel]
      description: >-
        Requires marketing.write. Publishing and withdrawing are the same
        operation with a boolean, because the difference is one nullable column
        and splitting them would let the two drift.
      parameters:
        - {in: path, name: slug, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [published], properties: {published: {type: boolean}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/PanelInfoPage"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/subscriptions/{subscriptionID}/pause:
    post:
      operationId: pausePanelSubscription
      tags: [panel]
      description: >-
        Requires subscriptions.write and an operator reason. Suspends access
        without spending the subscription's remaining days: the Remnawave user is
        disabled and the entitlement's clock stops, in one transaction.

        This is what `disable` is not. A disabled subscription keeps running out
        while the customer cannot use it; a paused one does not. The remaining
        days are measured from the pause instant on both customer surfaces, so
        the figure a customer reads stops moving.

        There is no customer-facing equivalent, deliberately: a pause turns a
        dated entitlement into an indefinite one, and letting the holder decide
        when the clock runs would make "thirty days" mean "thirty days of my
        choosing, forever".

        409 when the subscription is not active or limited — including when it is
        already paused, which is what makes a double-submitted button harmless.
      parameters:
        - {in: path, name: customerID, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: subscriptionID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/OperatorReason"}
      responses:
        "202": {description: Queued, content: {application/json: {schema: {$ref: "#/components/schemas/PanelSubscriptionOperationAccepted"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/subscriptions/{subscriptionID}/resume:
    post:
      operationId: resumePanelSubscription
      tags: [panel]
      description: >-
        Requires subscriptions.write and an operator reason. Gives back exactly
        the time the pause took: `ends_at` moves forward by the elapsed pause,
        `paused_seconds` records the same amount, and the Remnawave user has the
        new expiry pushed to it before being re-enabled — in that order, which is
        why it is one operation rather than two.

        409 when the subscription is not paused, so a double-submitted button
        cannot hand out the elapsed time twice.
      parameters:
        - {in: path, name: customerID, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: subscriptionID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/OperatorReason"}
      responses:
        "202": {description: Queued, content: {application/json: {schema: {$ref: "#/components/schemas/PanelSubscriptionOperationAccepted"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/codes/batches:
    get:
      operationId: listPanelCodeBatches
      tags: [panel]
      description: >-
        Requires catalog.read. Wholesale batches with their counts. It carries no
        codes: only their SHA-256 is stored, so there is nothing here that could
        produce one.
      parameters: [{$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {description: Batches, content: {application/json: {schema: {$ref: "#/components/schemas/PanelCodeBatchList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createPanelCodeBatch
      tags: [panel]
      description: >-
        Requires catalog.write. Generates a batch and returns its codes.

        This is the only response in the API that carries redeemable codes, and
        it carries every code in the batch. It cannot be replayed: asking again
        generates a different batch rather than returning this one, because
        nothing is stored that could return it. An operator who loses the list
        has to issue a new batch, which the screen says before they generate one.

        The batch row and every code commit together. A partial batch would leave
        somebody holding a list whose halves behave differently with no way to
        tell which is which.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelCodeBatch"}}}}
      responses:
        "201": {description: Generated, content: {application/json: {schema: {$ref: "#/components/schemas/PanelGeneratedBatch"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/codes/batches/{batchID}/codes:
    get:
      operationId: listPanelBatchCodes
      tags: [panel]
      description: >-
        Requires catalog.read. One batch's codes by hint and status. The hint is
        the last four characters, which is enough to match a support question to
        a row and far too little to guess the other twelve.
      parameters:
        - {in: path, name: batchID, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Codes, content: {application/json: {schema: {$ref: "#/components/schemas/PanelBatchCodeList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/codes/batches/{batchID}/revoke:
    post:
      operationId: revokePanelCodeBatch
      tags: [panel]
      description: >-
        Requires catalog.write and a reason. Kills every code in the batch that
        nobody has redeemed, and returns how many that was.

        Redeemed codes are untouched by design: somebody is using the
        subscription each one produced, and taking that back is a different
        decision. The reason is required because this is the action taken when a
        list leaks, and "why were these three hundred codes killed" is the
        question somebody asks six months later.
      parameters:
        - {in: path, name: batchID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 3}}}
      responses:
        "200": {description: Revoked, content: {application/json: {schema: {type: object, properties: {revoked: {type: integer, format: int64}}}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/merge/preview:
    get:
      operationId: previewPanelCustomerMerge
      tags: [panel]
      description: >-
        Requires customers.read. What merging this account into another would do,
        and every reason it cannot happen.

        A merge cannot be undone, so everything that would move is counted before
        anything does. The blockers are recomputed when the merge is applied
        rather than trusted from here: the two are separate requests, and a merge
        authorised by a stale screen is the kind of thing that only goes wrong
        once.
      parameters:
        - {in: path, name: customerID, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: into, required: true, schema: {type: string, format: uuid}, description: "The account that survives."}
      responses:
        "200": {description: Preview, content: {application/json: {schema: {$ref: "#/components/schemas/PanelMergePreview"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/merge:
    post:
      operationId: mergePanelCustomer
      tags: [panel]
      description: >-
        Requires customers.write and a reason. Merges the account in the path
        into the one in the body: subscriptions take new slots, orders,
        identities, contacts, consents, tickets, and saved methods are
        reassigned, the wallet balance moves as a compensating pair of ledger
        entries, and the source is closed pointing at the target.

        Idempotent. The closing update matches only an account that has not
        already been merged, so a resubmitted form reports the earlier merge and
        moves nothing — `alreadyMerged` says which happened.

        Three things are deliberately not a reassignment. A saved cart is
        cancelled, because one cart may be open per customer. Read markers move
        only where the target has not read the same post. Saved methods arrive
        as non-default, because one default per customer is a unique index and
        the survivor's is the one they last chose.
      parameters:
        - {in: path, name: customerID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/OperatorReason"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [into], properties: {into: {type: string, format: uuid}}}
      responses:
        "200": {description: Merged, content: {application/json: {schema: {$ref: "#/components/schemas/PanelMergeResult"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/notifications:
    get:
      operationId: listPanelCustomerNotifications
      tags: [panel]
      description: >-
        Requires customers.read. What this customer was actually sent.

        There is no message body here. The record says that a notice of a kind
        happened, not what it said, and reconstructing text from a template and
        today's data would show an operator something that was never sent.

        `reason` is the useful column. It carries a transport failure such as
        `bot_blocked` when one happened, and a policy outcome otherwise:
        `quiet_hours`, `frequency_cap`, `no_consent`. Those are deliveries the
        installation declined to make on purpose, and they turn "nothing
        arrived" into an answer.
      parameters:
        - {in: path, name: customerID, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: kind, schema: {type: string}, description: "Narrow to one kind."}
        - {in: query, name: status, schema: {type: string, enum: [pending, deferred, sent, failed, suppressed]}}
        - {in: query, name: offset, schema: {type: integer, format: int32, minimum: 0}}
        - {in: query, name: limit, schema: {type: integer, format: int32, minimum: 1, maximum: 50}}
      responses:
        "200": {description: History, content: {application/json: {schema: {$ref: "#/components/schemas/PanelDeliveryPage"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/notifications/summary:
    get:
      operationId: summarisePanelCustomerNotifications
      tags: [panel]
      description: >-
        Requires customers.read. The shape of the whole history per kind, which
        is what somebody wants before reading any single row of it.
      parameters:
        - {in: path, name: customerID, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                required: [summaries]
                properties:
                  summaries: {type: array, items: {$ref: "#/components/schemas/PanelDeliverySummary"}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/panel/customers/{customerID}/notifications/test:
    post:
      operationId: sendPanelCustomerTestNotification
      tags: [panel]
      description: >-
        Requires support.write. Queues one test message to this customer through
        the ordinary outbox.

        Queued, not sent — and that is the point. The panel process holds no
        Telegram connection; the notifier does. A test that took its own path
        would prove the test path works, which nobody asked. This one is claimed
        by the same worker, sent by the same call, and recorded with the same
        failure codes, so when real notifications are failing the test fails
        identically.

        Quiet hours, the marketing frequency cap, and the per-kind preferences
        are deliberately not applied: a test deferred until nine in the morning
        answers nothing at the moment somebody is asking. Delivery health still
        is, because a customer who blocked the bot cannot be reached by wanting
        it more — and that is the finding the operator needs.

        Answers 202. The outcome appears in the history, not in this response.
        Deduplicated by operator and minute, so a double-click is one message.
      parameters:
        - {in: path, name: customerID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "202": {description: Queued, content: {application/json: {schema: {$ref: "#/components/schemas/PanelQueuedTest"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/panel/notices:
    get:
      operationId: listPanelNotices
      tags: [panel]
      description: >-
        Requires settings.read. Every transactional notice an operator may
        reword, with the shipped wording, the values it carries, and whatever
        has been written for it.

        These are the messages the installation sends on its own initiative
        because something happened to a subscription — expiry, traffic, renewal,
        grace, recovery, fulfillment, and the two dunning notices. Campaign copy
        lives under `/marketing/templates`; this is the voice every customer
        hears whether or not anybody is running a campaign.

        An override is an exception rather than a copy: a locale with no entry
        in `overrides` is using the shipped default, so reverting keeps the
        improved wording that later upgrades bring.
      responses:
        "200":
          description: Notices
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/PanelNotice"}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/notices/{code}:
    put:
      operationId: savePanelNotice
      tags: [panel]
      description: >-
        Requires settings.write. Stores one body for one locale.

        One locale at a time, deliberately: rewriting the English expiry warning
        decides nothing about the Russian one, and a document-shaped save would
        let this screen overwrite a translation somebody else was working on.

        Refused with 422 when the body names a value the notice does not carry,
        uses markup Telegram does not accept, contains a stray `<`, links to
        anything but https, is blank, or exceeds 2000 characters. Every one of
        those would otherwise become a message that fails or looks broken at the
        customer, hours later, with nobody watching.

        Values are named — `{days}`, `{plan}`, `{until}` — rather than format
        verbs. A `%d` that meets a string prints `%!d(string=Pro)` and does not
        fail, which is exactly the outcome an operator cannot be asked to guard
        against.
      parameters:
        - {in: path, name: code, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale, body]
              properties:
                locale: {type: string, enum: [en, ru]}
                body: {type: string, maxLength: 2000}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/PanelNoticeOverride"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    delete:
      operationId: revertPanelNotice
      tags: [panel]
      description: >-
        Requires settings.write. Removes the override so the shipped wording
        applies again.

        A delete rather than a write of the current default: an installation
        that reverts today and upgrades tomorrow gets tomorrow's improved
        wording, which a copied-in default would have frozen. Reverting
        something that was never overridden is not an error.
      parameters:
        - {in: path, name: code, required: true, schema: {type: string}}
        - {in: query, name: locale, required: true, schema: {type: string, enum: [en, ru]}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204": {description: Reverted}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/notices/{code}/preview:
    post:
      operationId: previewPanelNotice
      tags: [panel]
      description: >-
        Requires settings.write — a preview stores nothing, but it runs the
        renderer over caller-supplied text, and a read permission should not be
        a way to do that.

        Renders a body against the notice's sample values, so an operator judges
        a message rather than a template. An empty body previews the shipped
        wording, which is what a customer would receive if nothing were saved.
        It refuses exactly what a save refuses, so a preview can never show
        something that could not then be stored.
      parameters:
        - {in: path, name: code, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale: {type: string, enum: [en, ru]}
                body: {type: string, maxLength: 2000, description: "Empty previews the shipped wording."}
      responses:
        "200": {description: Preview, content: {application/json: {schema: {$ref: "#/components/schemas/PanelNoticePreview"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/notices/{code}/test:
    post:
      operationId: sendPanelNoticeTest
      tags: [panel]
      description: >-
        Requires settings.write. Queues one rendered copy for the operator
        group's notice-preview topic.

        Never for a customer. A transactional notice has a trigger — a
        subscription about to expire, a charge that failed — and manufacturing
        one against a real subscription to see how the wording reads would tell
        somebody their access is ending when it is not.

        The body is rendered and stored at this moment rather than resolved at
        delivery, so the group sees the text that was in the editor even if it
        is edited again before the bot collects it. Answers 202; the outcome
        appears in the test list.
      parameters:
        - {in: path, name: code, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale: {type: string, enum: [en, ru]}
                body: {type: string, maxLength: 2000}
      responses:
        "202": {description: Queued, content: {application/json: {schema: {$ref: "#/components/schemas/PanelNoticeTest"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/notices/{code}/tests:
    get:
      operationId: listPanelNoticeTests
      tags: [panel]
      description: >-
        Requires settings.read. What has been queued for this notice, so a
        preview in flight looks like one rather than like a button that did
        nothing.
      parameters:
        - {in: path, name: code, required: true, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, format: int32, minimum: 1, maximum: 50}}
      responses:
        "200":
          description: Tests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/PanelNoticeTest"}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/analytics:
    get:
      operationId: getPanelAnalytics
      tags: [panel]
      description: >-
        Requires settings.read. The operator's own advertising measurement:
        counter identifiers, webmaster verification tags, and the closed set of
        each this build can render.

        This is never project telemetry. Nothing here is reported to anybody,
        and an installation that configures none of it renders nothing and
        stores nothing.
      responses:
        "200": {description: Settings, content: {application/json: {schema: {$ref: "#/components/schemas/PanelAnalytics"}}}}
        "403": {$ref: "#/components/responses/Problem"}
    put:
      operationId: savePanelAnalytics
      tags: [panel]
      description: >-
        Requires settings.write and the current `version`.

        A counter is a provider this repository knows and an identifier
        validated against its shape — never a snippet. The flexibility given up
        is exactly the ability to run arbitrary code in a customer's browser,
        and a customer's browser holds subscription links. `enabled` is separate
        from having identifiers so turning measurement off does not mean finding
        the numbers again to turn it back on.

        Verification tags are a name from an allowlist and an opaque token. They
        set no cookie, load no script, and observe nobody, which is why they
        render regardless of `enabled` and regardless of consent — a
        verification that only appeared for consenting visitors would verify
        nothing, because the fetcher is a webmaster tool rather than a person.
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AnalyticsSettingsInput"
                - type: object
                  required: [version]
                  properties:
                    version: {type: integer, format: int32}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/PanelAnalytics"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/reports/channels:
    get:
      operationId: getPanelChannelReport
      tags: [panel]
      description: >-
        Requires finance.read. What each channel brought in over the period,
        which is the question an operator asks before exporting anything.

        Keyed on settlement rather than on the order's creation: an
        advertisement is credited when the money arrived.
      parameters:
        - {in: query, name: since, schema: {type: string, format: date-time}}
        - {in: query, name: until, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels: {type: array, items: {$ref: "#/components/schemas/PanelChannelResult"}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/reports/conversions:
    get:
      operationId: getPanelConversions
      tags: [panel]
      description: >-
        Requires finance.read. The offline-conversion export: settled orders
        that came from an advertisement, with the click identifier the platform
        issued.

        Payment happens on the backend, often a day after the click, so the
        browser session that carried the identifier is long gone by the time
        there is money to attribute. This is what makes the upload possible.

        Nothing is uploaded by this software. `format=csv` returns a file the
        operator downloads and hands to the platform themselves — sending a
        customer's purchase to an advertising network because a settings toggle
        was on is not something anybody should have to discover from behaviour.

        Refunded orders are present with their refunded amount rather than
        dropped. A platform that optimised bidding on a sale that was later
        returned is being taught the wrong thing, and an operator can only
        correct for that if the export says it happened.
      parameters:
        - {in: query, name: since, schema: {type: string, format: date-time}}
        - {in: query, name: until, schema: {type: string, format: date-time}}
        - {in: query, name: source, schema: {type: string, enum: [google, yandex, meta, microsoft, tiktok, x]}}
        - {in: query, name: format, schema: {type: string, enum: [json, csv]}}
      responses:
        "200":
          description: Conversions
          content:
            application/json:
              schema:
                type: object
                required: [conversions]
                properties:
                  conversions: {type: array, items: {$ref: "#/components/schemas/PanelConversion"}}
            text/csv:
              schema: {type: string}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/reports/sales:
    get:
      operationId: getPanelSalesReport
      tags: [panel]
      description: >-
        Requires finance.read. What was sold over a chosen period, by kind of
        sale, by plan version, and by day, with trial conversion and refunds
        issued. The period keys on `orders.paid_at`, which is set once when an
        order first settles and never moved afterwards, so re-running a report
        over a closed period returns the same figures. Provider money and wallet
        credit are reported apart and must never be added: the balance was
        already revenue when it was funded. A period longer than two years is
        refused.
      parameters:
        - {$ref: "#/components/parameters/ReportSince"}
        - {$ref: "#/components/parameters/ReportUntil"}
        - {$ref: "#/components/parameters/ReportTimezone"}
        - {$ref: "#/components/parameters/ReportCurrency"}
      responses:
        "200": {description: Sales report, content: {application/json: {schema: {$ref: "#/components/schemas/PanelSalesReport"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/reports/sales/export:
    get:
      operationId: exportPanelSalesReport
      tags: [panel]
      description: >-
        Requires finance.read. The same report as CSV, one file with a `section`
        column rather than four files, because the breakdowns are four views of
        one period. Amounts are minor units, unscaled: dividing by a hundred is
        wrong for every zero-decimal currency and is something the reader can do
        knowing their own.
      parameters:
        - {$ref: "#/components/parameters/ReportSince"}
        - {$ref: "#/components/parameters/ReportUntil"}
        - {$ref: "#/components/parameters/ReportTimezone"}
        - {$ref: "#/components/parameters/ReportCurrency"}
      responses:
        "200": {description: CSV, content: {text/csv: {schema: {type: string}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/reports/payments:
    get:
      operationId: getPanelPaymentHealth
      tags: [panel]
      description: >-
        Requires finance.read. Settlement, latency, and webhook intake per
        payment adapter, so an acquirer that starts refusing is a number that
        moved rather than a growing stuck-payment queue.

        Two rates, because a customer abandoning a checkout and a gateway
        refusing a card are not the same event and only the second is the
        provider's: `settlementRate` is settled over settled plus failed, and
        `completionRate` adds abandoned. Intents still in flight appear in
        neither denominator — one created five minutes ago has not failed. Both
        rates are absent rather than zero when nothing reached a decision,
        because "nobody paid" and "everybody failed" are opposite facts.
      parameters:
        - {$ref: "#/components/parameters/ReportSince"}
        - {$ref: "#/components/parameters/ReportUntil"}
        - {$ref: "#/components/parameters/ReportTimezone"}
      responses:
        "200": {description: Payment health, content: {application/json: {schema: {$ref: "#/components/schemas/PanelPaymentHealth"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/reports/traffic:
    get:
      operationId: getPanelTrafficReport
      tags: [panel]
      description: >-
        Requires customers.read. Node saturation and the heaviest users, read
        live from Remnawave on every request.

        Omniflow stores none of it. Remnawave is authoritative for traffic,
        nodes, and connections, and this repository has no table for a node or
        for a byte a customer used — keeping one would be the first step towards
        Omniflow having an opinion about traffic. What Omniflow adds is the join:
        a Remnawave user identifier resolved to the customer who holds it.

        `nodesReported` is false when the panel does not expose a node listing or
        could not be reached, and `nodesDetail` says which. An empty node list
        and no node data look identical on a screen and mean opposite things.

        The consumer ranking pages the panel's user list and stops after ten
        pages. `scanned` and `total` say how far it got, so a truncated ranking
        is never presented as a complete one.
      responses:
        "200": {description: Traffic report, content: {application/json: {schema: {$ref: "#/components/schemas/PanelTrafficReport"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/reports/traffic/export:
    get:
      operationId: exportPanelTrafficReport
      tags: [panel]
      description: >-
        Requires customers.read. The same figures as CSV. Byte counts are
        unscaled: a gigabyte is 1000³ to some readers and 1024³ to others, and
        choosing one in an export makes the file wrong for the other half.
      responses:
        "200": {description: CSV, content: {text/csv: {schema: {type: string}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/theme:
    get:
      operationId: getPanelTheme
      tags: [panel]
      description: >-
        Requires settings.read. The stored palette, the stylesheet it renders as,
        the tokens this build honours, and every contrast problem the palette
        has. The warnings are recomputed on each read rather than stored, so they
        cannot go stale against a palette edited elsewhere.
      responses:
        "200": {description: Theme, content: {application/json: {schema: {$ref: "#/components/schemas/PanelTheme"}}}}
        "403": {$ref: "#/components/responses/Problem"}
    put:
      operationId: savePanelTheme
      tags: [panel]
      description: >-
        Requires settings.write. Refused when any text pair falls below 3:1
        against its own background, which is under the loosest threshold WCAG 2.2
        defines for any text. A pair between 3:1 and 4.5:1 is saved and reported
        as a warning, because a brand tone that fails AA is a decision an operator
        is entitled to make and be told about.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theme, version]
              properties:
                theme: {$ref: "#/components/schemas/ThemeDocument"}
                version: {type: integer, description: "The version the screen was showing. A mismatch is a conflict rather than an overwrite."}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/PanelTheme"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/theme/assets:
    get:
      operationId: listPanelBrandingAssets
      tags: [panel]
      description: >-
        Requires settings.read. The image slots with their size, type, and
        checksum. The bytes are not returned here; they are served publicly by
        the branding asset route.
      responses:
        "200": {description: Brand images, content: {application/json: {schema: {$ref: "#/components/schemas/PanelBrandingAssetList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/theme/assets/{kind}:
    put:
      operationId: savePanelBrandingAsset
      tags: [panel]
      description: >-
        Requires settings.write. The body is the image itself rather than a form
        or a base64 field, so its size is bounded before a byte is read. The
        declared content type must match the magic number of the bytes. SVG is
        not accepted: it can carry a script, and these files are served from the
        same origin as both panels.
      parameters:
        - {in: path, name: kind, required: true, schema: {type: string, enum: [logo_light, logo_dark, favicon]}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        description: >-
          One PNG, JPEG, or WebP image. The exact type is declared in the
          Content-Type header and must match the bytes themselves; the media type
          range here is what lets one request body carry any of the three.
        content:
          image/*: {schema: {type: string, format: binary}}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/PanelBrandingAsset"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    delete:
      operationId: deletePanelBrandingAsset
      tags: [panel]
      description: Requires settings.write. Clears the slot, returning the installation to the shipped mark.
      parameters:
        - {in: path, name: kind, required: true, schema: {type: string, enum: [logo_light, logo_dark, favicon]}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "200": {description: Removed, content: {application/json: {schema: {type: object, properties: {removed: {type: boolean}}}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/connect:
    get:
      operationId: getPanelConnectCatalogue
      tags: [panel]
      description: >-
        Requires settings.read. Every platform and every recommended application,
        including the ones an operator has switched off — a disabled row is what
        somebody came to this screen to turn back on. The customer surfaces read
        only the enabled ones.
      responses:
        "200": {description: Connection guidance, content: {application/json: {schema: {$ref: "#/components/schemas/PanelConnectCatalogue"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/connect/platforms:
    put:
      operationId: savePanelConnectPlatform
      tags: [panel]
      description: >-
        Requires settings.write. Creates or updates a platform. A missing Russian
        label is stored as the English one rather than left to render as a gap.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelConnectPlatform"}}}}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/PanelConnectPlatform"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/connect/platforms/{slug}:
    delete:
      operationId: deletePanelConnectPlatform
      tags: [panel]
      description: >-
        Requires settings.write. Deletes the platform and, by cascade, every
        application documented for it. Disabling it instead keeps the entries.
      parameters:
        - {in: path, name: slug, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "200": {description: Removed, content: {application/json: {schema: {type: object, properties: {removed: {type: boolean}}}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/connect/clients:
    put:
      operationId: savePanelConnectClient
      tags: [panel]
      description: >-
        Requires settings.write. Creates when `id` is absent and updates when it
        is present. The import scheme is refused unless it matches a scheme
        followed by `://` and a conservative path, and never when it names
        javascript, data, vbscript, or file — the value is concatenated with the
        subscription link and rendered as the href of an anchor on a page that
        holds a session cookie. A download address must be https.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelConnectClient"}}}}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/PanelConnectClient"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/connect/clients/{clientID}:
    delete:
      operationId: deletePanelConnectClient
      tags: [panel]
      description: Requires settings.write.
      parameters:
        - {in: path, name: clientID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "200": {description: Removed, content: {application/json: {schema: {type: object, properties: {removed: {type: boolean}}}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/providers:
    get:
      operationId: listPanelProviderSettings
      tags: [panel]
      description: >-
        Requires settings.read. Reports what the operator configured beside what
        each compiled-in adapter declares. No secret is ever returned; the
        `credentialsSet` flags report only whether one is stored.
      responses:
        "200": {description: Provider settings, content: {application/json: {schema: {$ref: "#/components/schemas/PanelProviderSettingsList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/providers/{provider}:
    put:
      operationId: savePanelProviderSettings
      tags: [panel]
      description: >-
        Requires settings.write. A null credential means "keep what is stored",
        so the form can be re-saved without echoing a secret. Recurring is not
        writable here.
      parameters:
        - {in: path, name: provider, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelProviderSettingsInput"}}}}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/PanelProviderSettings"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/providers/{provider}/recurring:
    post:
      operationId: configurePanelRecurring
      tags: [panel]
      description: >-
        Requires settings.write. Records a capability test and, only on a pass,
        may enable automatic charging. Refused for an adapter that cannot bind a
        payment method, whatever the test reported.
      parameters:
        - {in: path, name: provider, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelRecurringTest"}}}}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/PanelProviderSettings"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/ai/providers:
    get:
      operationId: listPanelAIProviders
      tags: [panel]
      description: >-
        Requires settings.read. The model backends an owner has approved. The
        API key is never returned; `keyConfigured` reports only whether one is
        held. What a provider does with the data is recorded from its own terms,
        which Omniflow cannot verify.
      responses:
        "200": {description: Providers, content: {application/json: {schema: {$ref: "#/components/schemas/PanelAIProviderList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
    put:
      operationId: savePanelAIProvider
      tags: [panel]
      description: >-
        Requires settings.write. An omitted `apiKey` leaves the stored
        credential alone, so a display name can be corrected without re-pasting
        a secret.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelAIProviderInput"}}}}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/PanelAIProvider"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/ai/providers/{slug}:
    delete:
      operationId: deletePanelAIProvider
      tags: [panel]
      description: >-
        Requires settings.write. Refused while a feature still points at the
        provider: removing it would switch that feature off without saying so.
      parameters:
        - {$ref: "#/components/parameters/AIProviderSlug"}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "200": {description: Removed, content: {application/json: {schema: {$ref: "#/components/schemas/PanelDeleted"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/ai/providers/{slug}/test:
    post:
      operationId: testPanelAIProvider
      tags: [panel]
      description: >-
        Requires settings.write. Makes one small completion against the stored
        credential and records the outcome on the provider, so "is this
        configured correctly?" is answerable without spending a real request
        later. The prompt is Omniflow's own text; no customer content is
        involved.


        A test that ran and failed answers 200 with `lastCheckOk` false, because
        the outcome is what was asked for. A test that could not be attempted —
        no key stored, no model to test with, an unregistered provider — answers
        4xx and stores nothing, because recording a failure would claim
        something was tried.


        It sits behind settings.write rather than settings.read: it opens a
        sealed credential and spends the installation's money. It is rate
        limited per operator.
      parameters:
        - {$ref: "#/components/parameters/AIProviderSlug"}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: false, content: {application/json: {schema: {$ref: "#/components/schemas/PanelAIProviderTestInput"}}}}
      responses:
        "200": {description: The test ran; the provider carries its outcome, content: {application/json: {schema: {$ref: "#/components/schemas/PanelAIProvider"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /v1/panel/risk/sources:
    get:
      operationId: listPanelBlocklistSources
      tags: [panel]
      description: Requires risk.read. The stored authorization header is never returned.
      responses:
        "200": {description: Blocklist sources, content: {application/json: {schema: {$ref: "#/components/schemas/PanelBlocklistSourceList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
    put:
      operationId: savePanelBlocklistSource
      tags: [panel]
      description: >-
        Requires risk.write. The URL must be HTTPS: plain HTTP would let anyone
        on the path decide who this installation refuses to serve.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelBlocklistSourceInput"}}}}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/PanelBlocklistSource"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/risk/sources/{sourceID}:
    delete:
      operationId: deletePanelBlocklistSource
      tags: [panel]
      description: Requires risk.write. Removes the source, its entries, and the matches it produced.
      parameters:
        - {in: path, name: sourceID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204": {description: Deleted}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/risk/matches:
    get:
      operationId: searchPanelBlocklistMatches
      tags: [panel]
      description: Requires risk.read. The review queue.
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/PageSize"}
        - {in: query, name: status, schema: {type: string, enum: [open, allowed, blocked, appealed]}}
        - {in: query, name: customerId, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Matches, content: {application/json: {schema: {$ref: "#/components/schemas/PanelMatchPage"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/risk/matches/{matchID}/decision:
    post:
      operationId: decidePanelBlocklistMatch
      tags: [panel]
      description: >-
        Requires risk.write and a reason. Recording a decision does not suspend
        anybody: the adverse action is a separate customer mutation with its own
        permission and audit event.
      parameters:
        - {in: path, name: matchID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/OperatorReason"}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [decision], properties: {decision: {type: string, enum: [allowed, blocked]}}}}}}
      responses:
        "200": {description: Decided, content: {application/json: {schema: {$ref: "#/components/schemas/PanelBlocklistMatch"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/risk/matches/{matchID}/appeal:
    post:
      operationId: appealPanelBlocklistMatch
      tags: [panel]
      description: Requires risk.write and a reason. Returns a blocked match to the review queue.
      parameters:
        - {in: path, name: matchID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/OperatorReason"}
      responses:
        "204": {description: Reopened}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/panel/risk/rules:
    get:
      operationId: listPanelAnomalyRules
      tags: [panel]
      description: Requires risk.read. Thresholds are in each metric's own unit.
      responses:
        "200": {description: Anomaly rules, content: {application/json: {schema: {$ref: "#/components/schemas/PanelAnomalyRuleList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/risk/rules/{metric}:
    put:
      operationId: savePanelAnomalyRule
      tags: [panel]
      description: >-
        Requires risk.write. A rule that would be skipped at evaluation time —
        no window, or an alert threshold below the warning — is refused here
        instead.
      parameters:
        - {in: path, name: metric, required: true, schema: {$ref: "#/components/schemas/PanelAnomalyMetric"}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelAnomalyRuleInput"}}}}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/PanelAnomalyRule"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/risk/anomalies:
    get:
      operationId: searchPanelAnomalies
      tags: [panel]
      description: >-
        Requires risk.read. Evidence carries the aggregate numbers that produced
        the signal and never customer content.
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/PageSize"}
        - {in: query, name: status, schema: {type: string, enum: [open, acknowledged, dismissed]}}
        - {in: query, name: metric, schema: {$ref: "#/components/schemas/PanelAnomalyMetric"}}
        - {in: query, name: severity, schema: {type: string, enum: [warning, alert]}}
      responses:
        "200": {description: Signals, content: {application/json: {schema: {$ref: "#/components/schemas/PanelAnomalyPage"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/risk/anomalies/{signalID}/review:
    post:
      operationId: reviewPanelAnomaly
      tags: [panel]
      description: >-
        Requires risk.write. Reviewing a signal changes nothing about the
        customer it names, which is what makes automated detection safe to run.
      parameters:
        - {in: path, name: signalID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/OperatorReason"}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [acknowledged, dismissed]}}}}}}
      responses:
        "200": {description: Reviewed, content: {application/json: {schema: {$ref: "#/components/schemas/PanelAnomalySignal"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/panel/gifts:
    get:
      operationId: searchPanelGifts
      tags: [panel]
      description: >-
        Requires gifts.read. Only the digest of a claim code is stored; the four
        characters returned as a hint identify a gift without redeeming it.
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/PageSize"}
        - {in: query, name: status, schema: {$ref: "#/components/schemas/PanelGiftStatus"}}
        - {in: query, name: kind, schema: {type: string, enum: [subscription, addon, wallet_credit]}}
        - {in: query, name: senderId, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Gift register, content: {application/json: {schema: {$ref: "#/components/schemas/PanelGiftPage"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/gifts/{giftID}/revoke:
    post:
      operationId: revokePanelGift
      tags: [panel]
      description: >-
        Requires gifts.write and a reason. A claimed gift is not revocable: the
        recipient already holds what it bought, and taking that back is a refund
        decision against their entitlement.
      parameters:
        - {in: path, name: giftID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/OperatorReason"}
      responses:
        "200": {description: Revoked, content: {application/json: {schema: {$ref: "#/components/schemas/PanelGift"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/gifts/{giftID}/refund:
    post:
      operationId: refundPanelGift
      tags: [panel]
      description: >-
        Requires gifts.write. Only a gift that was never redeemed qualifies,
        which is what stops a sender being refunded while the recipient keeps
        the entitlement.
      parameters:
        - {in: path, name: giftID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204": {description: Marked refunded}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/panel/goods/providers:
    get:
      operationId: listPanelGoodsProviders
      tags: [panel]
      description: >-
        Requires goods.read. The credential is never returned; the balance and
        the low-balance flag are, because a shop that sells past an exhausted
        balance produces paid orders that can only be refunded.
      responses:
        "200": {description: Providers, content: {application/json: {schema: {$ref: "#/components/schemas/PanelGoodsProviderList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/goods/providers/{slug}:
    put:
      operationId: savePanelGoodsProvider
      tags: [panel]
      description: Requires goods.write. A null credential means "keep what is stored".
      parameters:
        - {in: path, name: slug, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelGoodsProviderInput"}}}}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/PanelGoodsProvider"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/goods/products:
    get:
      operationId: listPanelGoodsProducts
      tags: [panel]
      description: Requires goods.read.
      parameters: [{in: query, name: includeArchived, schema: {type: boolean, default: false}}]
      responses:
        "200": {description: Products, content: {application/json: {schema: {$ref: "#/components/schemas/PanelGoodsProductList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createPanelGoodsProduct
      tags: [panel]
      description: >-
        Requires goods.write. Premium is sold by duration and Stars by quantity;
        each kind carries exactly the one that applies to it.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelGoodsProductInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/PanelGoodsProduct"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/goods/products/{productID}:
    patch:
      operationId: updatePanelGoodsProduct
      tags: [panel]
      description: >-
        Requires goods.write. The kind, duration, and quantity are immutable
        once created: an order references the product it bought.
      parameters:
        - {in: path, name: productID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelGoodsProductUpdate"}}}}
      responses:
        "204": {description: Saved}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/panel/goods/products/{productID}/localizations/{locale}:
    put:
      operationId: savePanelGoodsLocalization
      tags: [panel]
      description: Requires goods.write.
      parameters:
        - {in: path, name: productID, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: locale, required: true, schema: {type: string, enum: [ru, en]}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelLocalization"}}}}
      responses:
        "204": {description: Saved}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/goods/products/{productID}/pricing:
    put:
      operationId: savePanelGoodsPricing
      tags: [panel]
      description: >-
        Requires goods.write. Every rounding mode rounds up, and the markup
        itself rounds up rather than truncating.
      parameters:
        - {in: path, name: productID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelGoodsPricing"}}}}
      responses:
        "204": {description: Saved}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/goods/orders:
    get:
      operationId: searchPanelGoodsOrders
      tags: [panel]
      description: >-
        Requires goods.read. The recipient username is the only recipient detail
        retained anywhere: delivery needs it and support needs to answer "where
        did it go".
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/PageSize"}
        - {in: query, name: status, schema: {type: string}}
        - {in: query, name: customerId, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Shop orders, content: {application/json: {schema: {$ref: "#/components/schemas/PanelGoodsOrderPage"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/goods/orders/{orderID}/attempts:
    get:
      operationId: listPanelGoodsAttempts
      tags: [panel]
      description: Requires goods.read. Every provider exchange, with its failure classification.
      parameters: [{$ref: "#/components/parameters/OrderID"}]
      responses:
        "200": {description: Delivery attempts, content: {application/json: {schema: {$ref: "#/components/schemas/PanelGoodsAttemptList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/goods/review:
    get:
      operationId: listPanelGoodsReviewQueue
      tags: [panel]
      description: >-
        Requires goods.read. Deliveries whose outcome nobody could resolve
        automatically. The gateway honours no idempotency key, so a lost answer
        means the goods may or may not have been sent; retrying could deliver
        twice and refunding could give money back for goods the recipient
        received.
      parameters: [{$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {description: Parked deliveries, content: {application/json: {schema: {$ref: "#/components/schemas/PanelParkedDeliveryList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/goods/orders/{orderID}/resolve:
    post:
      operationId: resolvePanelGoodsDelivery
      tags: [panel]
      description: >-
        Requires goods.write and a reason. Records what an operator confirmed
        with the provider: `delivered` completes the order, and anything else
        releases the ordinary refund path and credits the customer's wallet.
      parameters:
        - {$ref: "#/components/parameters/OrderID"}
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/OperatorReason"}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [delivered], properties: {delivered: {type: boolean}}}}}}
      responses:
        "204": {description: Resolved}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/goods/orders/{orderID}/cancel:
    post:
      operationId: cancelPanelGoodsDelivery
      tags: [panel]
      description: >-
        Requires goods.write and a reason. A delivered order cannot be
        cancelled: the recipient already has what was bought.
      parameters:
        - {$ref: "#/components/parameters/OrderID"}
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/OperatorReason"}
      responses:
        "204": {description: Cancelled}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/panel/bulk:
    get:
      operationId: listPanelBulkOperations
      tags: [panel]
      description: Requires customers.read.
      parameters: [{$ref: "#/components/parameters/PageSize"}]
      responses:
        "200": {description: Bulk operations, content: {application/json: {schema: {$ref: "#/components/schemas/PanelBulkOperationList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      operationId: previewPanelBulkOperation
      tags: [panel]
      description: >-
        Requires customers.write, a reason, and an idempotency key. This only
        previews: nothing is applied until the operation is started, and only a
        previewed operation may start.
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/OperatorReason"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PanelBulkInput"}}}}
      responses:
        "201": {description: Previewed, content: {application/json: {schema: {$ref: "#/components/schemas/PanelBulkOperation"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/bulk/{operationID}/start:
    post:
      operationId: startPanelBulkOperation
      tags: [panel]
      description: Requires customers.write. Only a previewed operation may start.
      parameters:
        - {in: path, name: operationID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "200": {description: Started, content: {application/json: {schema: {$ref: "#/components/schemas/PanelBulkOperation"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/panel/bulk/{operationID}/cancel:
    post:
      operationId: cancelPanelBulkOperation
      tags: [panel]
      description: >-
        Requires customers.write. A running operation is not cancellable: some
        of its targets have already changed, and reporting "cancelled" would
        misrepresent what happened.
      parameters:
        - {in: path, name: operationID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204": {description: Cancelled}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/panel/bulk/{operationID}/items:
    get:
      operationId: listPanelBulkItems
      tags: [panel]
      description: Requires customers.read. The per-item outcome an operator reviews after a run.
      parameters:
        - {in: path, name: operationID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200": {description: Operation and items, content: {application/json: {schema: {$ref: "#/components/schemas/PanelBulkDetail"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  # ---------------------------------------------------------------------------
  # Customer web panel (v0.9)
  #
  # A third prefix alongside /v1/panel and /v1/admin. It carries its own session
  # cookie and its own CSRF token: a customer session must never be able to reach
  # an operator route, and separate prefixes are what makes that structural
  # rather than a check somebody has to remember.
  # ---------------------------------------------------------------------------
  /v1/account/auth/methods:
    get:
      operationId: listAccountSignInMethods
      tags: [account]
      security: []
      description: >-
        Which sign-in routes this installation actually offers. The sign-in
        screen renders from this, so an installation with no bot token never
        shows a Telegram button that cannot work.
      responses:
        "200": {description: Available routes, content: {application/json: {schema: {$ref: "#/components/schemas/AccountSignInMethods"}}}}
  /v1/account/auth/telegram:
    post:
      operationId: accountSignInWithTelegram
      tags: [account]
      security: []
      description: >-
        Verifies a Telegram Login Widget payload. The hash is checked against the
        bot token and the auth_date must be recent, so a captured payload cannot
        be replayed indefinitely.
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: {type: string}}}}}
      responses:
        "200": {description: Signed in, content: {application/json: {schema: {$ref: "#/components/schemas/AccountSignIn"}}}}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/account/auth/telegram/miniapp:
    post:
      operationId: accountSignInWithMiniApp
      tags: [account]
      security: []
      description: Verifies the initData a Telegram Mini App hands to its own page.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [initData], properties: {initData: {type: string}}}}}}
      responses:
        "200": {description: Signed in, content: {application/json: {schema: {$ref: "#/components/schemas/AccountSignIn"}}}}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/account/auth/link:
    get:
      operationId: accountCompleteMagicLink
      tags: [account]
      security: []
      description: >-
        Redeems a one-time link the bot delivered. The token is consumed before
        the redirect is issued, so the URL left in history is already spent.
      parameters:
        - {in: query, name: token, required: true, schema: {type: string}}
      responses:
        "302": {description: Signed in and redirected into the panel}
  /v1/account/auth/oidc/{slug}/start:
    get:
      operationId: startAccountOidc
      tags: [account]
      security: []
      parameters:
        - {$ref: "#/components/parameters/OidcSlug"}
        - {in: query, name: next, schema: {type: string, description: "Same-site path to return to."}}
      responses:
        "302": {description: Redirect to the provider}
        "404": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /v1/account/auth/oidc/{slug}/callback:
    get:
      operationId: completeAccountOidc
      tags: [account]
      security: []
      parameters:
        - {$ref: "#/components/parameters/OidcSlug"}
        - {in: query, name: code, schema: {type: string}}
        - {in: query, name: state, schema: {type: string}}
        - {in: query, name: error, schema: {type: string}}
      responses:
        "302": {description: "Signed in, or redirected back to sign-in with a reason"}
  /v1/account/me:
    get:
      operationId: getAccountSession
      tags: [account]
      description: The signed-in customer, how they authenticated, and whether a sensitive action needs a fresh sign-in.
      responses:
        "200": {description: Current session, content: {application/json: {schema: {$ref: "#/components/schemas/AccountSession"}}}}
        "401": {$ref: "#/components/responses/Problem"}
    patch:
      operationId: updateAccountProfile
      tags: [account]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AccountProfileInput"}}}}
      responses:
        "200": {description: Profile saved, content: {application/json: {schema: {$ref: "#/components/schemas/AccountCustomer"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/account/auth/logout:
    post:
      operationId: accountLogout
      tags: [account]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      responses:
        "204": {description: Session ended}
  /v1/account/auth/logout-all:
    post:
      operationId: accountLogoutAll
      tags: [account]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      description: >-
        Ends every session. keepCurrent spares the caller's own, which is what
        "sign out my other devices" means; leaving it false is what a suspected
        compromise needs.
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {keepCurrent: {type: boolean, default: false}}}}}}
      responses:
        "200": {description: Sessions ended, content: {application/json: {schema: {type: object, required: [revoked], properties: {revoked: {type: integer}}}}}}
  /v1/account/sessions:
    get:
      operationId: listAccountSessions
      tags: [account]
      responses:
        "200": {description: Live sessions, content: {application/json: {schema: {$ref: "#/components/schemas/AccountSessionList"}}}}
  /v1/account/sessions/{sessionID}:
    delete:
      operationId: revokeAccountSession
      tags: [account]
      parameters:
        - {in: path, name: sessionID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204": {description: Session ended}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/account/security-events:
    get:
      operationId: listAccountSecurityEvents
      tags: [account]
      description: >-
        The customer's own account history. The vocabulary is closed and carries
        no amount, link, or other party's identifier.
      parameters:
        - {in: query, name: cursor, schema: {type: string, format: date-time}}
        - {in: query, name: cursorId, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Events, content: {application/json: {schema: {$ref: "#/components/schemas/AccountSecurityEventList"}}}}
  /v1/account/sign-in-methods:
    get:
      operationId: listAccountLinkedMethods
      tags: [account]
      responses:
        "200": {description: Linked methods, content: {application/json: {schema: {$ref: "#/components/schemas/AccountLinkedMethodList"}}}}
  /v1/account/sign-in-methods/{identityID}:
    delete:
      operationId: unlinkAccountSignInMethod
      tags: [account]
      description: >-
        Refuses to remove the last usable method. Needs a recent sign-in, because
        a session left open must not be enough to strip somebody's way back into
        their own account.
      parameters:
        - {in: path, name: identityID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204": {description: Removed}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/account/sign-in-methods/oidc/{slug}/start:
    get:
      operationId: startAccountOidcLink
      tags: [account]
      description: >-
        Attaches a provider to the account already signed in. This is the only
        route by which an existing customer gains an OIDC method: signing in with
        an unlinked subject never adopts an existing account by email.
      parameters: [{$ref: "#/components/parameters/OidcSlug"}]
      responses:
        "302": {description: Redirect to the provider}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/account/overview:
    get:
      operationId: getAccountOverview
      tags: [account]
      parameters:
        - {in: query, name: locale, schema: {type: string, enum: [ru, en]}}
      responses:
        "200": {description: Dashboard, content: {application/json: {schema: {$ref: "#/components/schemas/AccountOverview"}}}}
  /v1/account/subscriptions/{subscriptionID}:
    get:
      operationId: getAccountSubscription
      tags: [account]
      parameters:
        - {$ref: "#/components/parameters/AccountSubscriptionID"}
        - {in: query, name: locale, schema: {type: string, enum: [ru, en]}}
      responses:
        "200": {description: Subscription, content: {application/json: {schema: {$ref: "#/components/schemas/AccountSubscription"}}}}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      operationId: renameAccountSubscription
      tags: [account]
      description: The customer's own label, which every screen and notification uses to name the subscription.
      parameters:
        - {$ref: "#/components/parameters/AccountSubscriptionID"}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [label], properties: {label: {type: string, minLength: 1, maxLength: 40}}}}}}
      responses:
        "204": {description: Renamed}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/account/subscriptions/{subscriptionID}/connection:
    get:
      operationId: getAccountConnection
      tags: [account]
      description: >-
        The access link plus the documented clients for one platform. The
        catalogue is the operator's own and is read through one query that the
        bot reads too, so the two surfaces cannot recommend different
        applications.
      parameters:
        - {$ref: "#/components/parameters/AccountSubscriptionID"}
        - {in: query, name: platform, schema: {type: string}, description: "A platform key from the catalogue. An unknown one falls back to the first documented platform rather than erroring, so a stale bookmark still works."}
      responses:
        "200": {description: Connection details, content: {application/json: {schema: {$ref: "#/components/schemas/AccountConnection"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/account/subscriptions/{subscriptionID}/rotate-link:
    post:
      operationId: rotateAccountSubscriptionLink
      tags: [account]
      description: >-
        Issues a new access link and invalidates the old one. Every connected
        device stops working until the new link is imported, so it needs both an
        explicit confirmation and a recent sign-in.
      parameters:
        - {$ref: "#/components/parameters/AccountSubscriptionID"}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [confirm], properties: {confirm: {type: boolean}}}}}}
      responses:
        "200": {description: Rotated, content: {application/json: {schema: {type: object, required: [subscriptionUrl], properties: {subscriptionUrl: {type: string}}}}}}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/account/subscriptions/{subscriptionID}/devices:
    get:
      operationId: listAccountDevices
      tags: [account]
      description: >-
        Connected devices. No hardware identifier and no IP address is returned;
        a device is named by an opaque handle the server resolves back.
      parameters: [{$ref: "#/components/parameters/AccountSubscriptionID"}]
      responses:
        "200": {description: Devices, content: {application/json: {schema: {$ref: "#/components/schemas/AccountDeviceList"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    delete:
      operationId: removeAllAccountDevices
      tags: [account]
      description: Disconnects every device at once. Needs confirmation and a recent sign-in.
      parameters:
        - {$ref: "#/components/parameters/AccountSubscriptionID"}
        - {in: query, name: confirm, required: true, schema: {type: string, enum: ["true"]}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "200": {description: Removed, content: {application/json: {schema: {type: object, required: [removed], properties: {removed: {type: integer}}}}}}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/account/subscriptions/{subscriptionID}/devices/{handle}:
    delete:
      operationId: removeAccountDevice
      tags: [account]
      parameters:
        - {$ref: "#/components/parameters/AccountSubscriptionID"}
        - {in: path, name: handle, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204": {description: Disconnected}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/account/plans:
    get:
      operationId: listAccountPlans
      tags: [account]
      description: >-
        The comparable catalogue, with this customer's eligibility already
        decided. `operations` names the lifecycle actions the configured plan
        policy allows against their current subscriptions, so the panel offers
        renew, upgrade, or downgrade because the server said so rather than
        because React worked it out a second time.
      parameters: [{in: query, name: locale, schema: {type: string, enum: [ru, en]}}]
      responses:
        "200": {description: Catalogue, content: {application/json: {schema: {$ref: "#/components/schemas/AccountPlanList"}}}}
  /v1/account/plans/{planVersionID}:
    get:
      operationId: getAccountPlan
      tags: [account]
      parameters:
        - {in: path, name: planVersionID, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: locale, schema: {type: string, enum: [ru, en]}}
      responses:
        "200": {description: Plan, content: {application/json: {schema: {$ref: "#/components/schemas/AccountPlanDetail"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/account/checkout:
    get:
      operationId: getAccountCheckout
      tags: [account]
      description: >-
        The open checkout with a live quote. A customer has at most one, shared
        with the Telegram bot, so opening one in a browser supersedes one left
        open in a chat. `404` means none is open, which is an ordinary state
        rather than a failure.
      parameters: [{in: query, name: locale, schema: {type: string, enum: [ru, en]}}]
      responses:
        "200": {description: Checkout, content: {application/json: {schema: {$ref: "#/components/schemas/AccountCheckout"}}}}
        "404": {$ref: "#/components/responses/Problem"}
    post:
      operationId: openAccountCheckout
      tags: [account]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planVersionId, operation]
              properties:
                planVersionId: {type: string, format: uuid}
                operation: {type: string, enum: [purchase, renew, upgrade, downgrade]}
                subscriptionId: {type: string, format: uuid, description: "Required for renew, upgrade, and downgrade when concurrent subscriptions are enabled."}
                newSubscription: {type: boolean}
      responses:
        "201": {description: Opened, content: {application/json: {schema: {$ref: "#/components/schemas/AccountCheckout"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    patch:
      operationId: updateAccountCheckout
      tags: [account]
      description: >-
        Every field is optional and an absent field is left unchanged, so a
        screen that changes the provider never has to resend the squad selection
        it did not touch.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: {type: string}
                currency: {type: string}
                applyWallet: {type: boolean}
                subscriptionId: {type: string}
                squadIds: {type: array, items: {type: string, format: uuid}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/AccountCheckout"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    delete:
      operationId: cancelAccountCheckout
      tags: [account]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      responses:
        "204": {description: Discarded}
  /v1/account/checkout/promo:
    post:
      operationId: applyAccountPromoCode
      tags: [account]
      description: >-
        A refused code answers 200 carrying `promoRejection`, not an error
        status. The customer asked a legitimate question and the answer is "not
        this one, because…"; failing the request would leave the screen with
        nothing to say.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [code], properties: {code: {type: string}}}}}}
      responses:
        "200": {description: Checkout, content: {application/json: {schema: {$ref: "#/components/schemas/AccountCheckout"}}}}
        "404": {$ref: "#/components/responses/Problem"}
    delete:
      operationId: removeAccountPromoCode
      tags: [account]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      responses:
        "200": {description: Checkout, content: {application/json: {schema: {$ref: "#/components/schemas/AccountCheckout"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/account/checkout/addons/{addonVersionID}:
    post:
      operationId: toggleAccountCheckoutAddon
      tags: [account]
      parameters:
        - {in: path, name: addonVersionID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "200": {description: Checkout, content: {application/json: {schema: {$ref: "#/components/schemas/AccountCheckout"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/account/checkout/confirm:
    post:
      operationId: confirmAccountCheckout
      tags: [account]
      description: >-
        Turns the open checkout into an order. The checkout's own idempotency
        key is reused for the order, so a duplicate confirmation resolves to the
        order already created rather than a second one.
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "201": {description: Order created, content: {application/json: {schema: {$ref: "#/components/schemas/AccountOrder"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/account/orders:
    get:
      operationId: listAccountOrders
      tags: [account]
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {in: query, name: cursorId, schema: {type: string, format: uuid}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100}}
        - {in: query, name: locale, schema: {type: string, enum: [ru, en]}}
      responses:
        "200": {description: Orders, content: {application/json: {schema: {$ref: "#/components/schemas/AccountOrderPage"}}}}
        "400": {$ref: "#/components/responses/Problem"}
  /v1/account/orders/{orderID}:
    get:
      operationId: getAccountOrder
      tags: [account]
      description: >-
        One order with its payment, provisioning progress, and refunds.
        Provisioning comes from the fulfillment operation the order created, so a
        refresh, a second tab, or a switch to Telegram all show the same state.
      parameters:
        - {$ref: "#/components/parameters/OrderID"}
        - {in: query, name: locale, schema: {type: string, enum: [ru, en]}}
      responses:
        "200": {description: Order, content: {application/json: {schema: {$ref: "#/components/schemas/AccountOrder"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/account/orders/{orderID}/payment:
    post:
      operationId: startAccountOrderPayment
      tags: [account]
      description: >-
        Creates or resumes the provider payment. The key is scoped to the order
        and the chosen adapter, so switching provider is a new payment while
        pressing the same button twice is not.
      parameters:
        - {$ref: "#/components/parameters/OrderID"}
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {provider: {type: string}}}}}}
      responses:
        "200": {description: Payment handoff, content: {application/json: {schema: {$ref: "#/components/schemas/AccountPaymentHandle"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/account/orders/{orderID}/refresh:
    post:
      operationId: refreshAccountOrder
      tags: [account]
      description: >-
        Re-reads the provider so a customer who returns before the webhook
        arrives still sees the settled state.
      parameters:
        - {$ref: "#/components/parameters/OrderID"}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "200": {description: Order, content: {application/json: {schema: {$ref: "#/components/schemas/AccountOrder"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/account/orders/{orderID}/cancel:
    post:
      operationId: cancelAccountOrder
      tags: [account]
      parameters:
        - {$ref: "#/components/parameters/OrderID"}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204": {description: Cancelled}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/account/wallet:
    get:
      operationId: getAccountWallet
      tags: [account]
      description: >-
        Balances per currency with the top-up policy and the ledger. Currencies
        are isolated: a balance in one never funds an order in another.
      parameters:
        - {in: query, name: currency, schema: {type: string}}
        - {$ref: "#/components/parameters/Cursor"}
        - {in: query, name: cursorId, schema: {type: string, format: uuid}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200": {description: Wallet, content: {application/json: {schema: {$ref: "#/components/schemas/AccountWallet"}}}}
        "400": {$ref: "#/components/responses/Problem"}
  /v1/account/wallet/top-up:
    post:
      operationId: startAccountTopUp
      tags: [account]
      description: >-
        Opens a top-up order through the same order, webhook, and reconciliation
        pipeline a plan uses. The caller's key becomes the order's key, so a
        retried request credits the same top-up rather than a second one.
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor]
              properties:
                amountMinor: {type: integer, format: int64, minimum: 1}
                currency: {type: string}
                provider: {type: string}
      responses:
        "201": {description: Top-up opened, content: {application/json: {schema: {$ref: "#/components/schemas/AccountOrder"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/account/referrals:
    get:
      operationId: getAccountReferrals
      tags: [account]
      description: >-
        The customer's code, its shareable link, the program's terms, and the
        reward history. A reversed reward is excluded from the earned total and
        from the cap count, because an operator reverses one when the referral
        turns out to be abuse and the slot it consumed should come back.
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200": {description: Referrals, content: {application/json: {schema: {$ref: "#/components/schemas/AccountReferrals"}}}}
  /v1/account/loyalty:
    get:
      operationId: getAccountLoyalty
      tags: [account]
      responses:
        "200": {description: Loyalty standing, content: {application/json: {schema: {$ref: "#/components/schemas/AccountLoyalty"}}}}
  /v1/account/contacts:
    get:
      operationId: listAccountContacts
      tags: [account]
      description: "Flags only. A stored contact value is never returned to the browser."
      responses:
        "200": {description: Contacts, content: {application/json: {schema: {$ref: "#/components/schemas/AccountContactList"}}}}
        "503": {$ref: "#/components/responses/Problem"}
    post:
      operationId: addAccountContact
      tags: [account]
      description: >-
        A value already registered elsewhere answers `contact_unavailable` and
        nothing more. Saying that another account holds it would turn the panel
        into an account-existence oracle, so the remedy is a support handoff.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value]
              properties:
                kind: {type: string, enum: [email, phone, telegram]}
                value: {type: string}
                transactional: {type: boolean}
                marketing: {type: boolean}
      responses:
        "201": {description: Added, content: {application/json: {schema: {$ref: "#/components/schemas/AccountContact"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/account/contacts/{contactID}:
    delete:
      operationId: removeAccountContact
      tags: [account]
      parameters:
        - {in: path, name: contactID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204": {description: Removed}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/account/privacy:
    get:
      operationId: getAccountPrivacy
      tags: [account]
      responses:
        "200": {description: Privacy state, content: {application/json: {schema: {$ref: "#/components/schemas/AccountPrivacy"}}}}
  /v1/account/privacy/export:
    post:
      operationId: exportAccountPersonalData
      tags: [account]
      description: >-
        Produces the customer's own records synchronously as a download. It is
        not queued because a queued export would need a delivery channel, a
        retention window, and a link that authenticates on its own — three
        further disclosure decisions to answer a question that fits in one
        response. The document declares its own redactions and names any section
        it truncated.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      responses:
        "200": {description: Export document, content: {application/json: {schema: {$ref: "#/components/schemas/AccountExport"}}}}
        "429": {$ref: "#/components/responses/Problem"}
  /v1/account/privacy/deletion:
    post:
      operationId: requestAccountDeletion
      tags: [account]
      description: >-
        Records a deletion request and nothing else. The retention workflow an
        operator already governs is what deletes, so an irreversible action never
        happens on the strength of one browser session. It needs a recent
        sign-in, and answers 202 because the work has been accepted rather than
        done.
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm, reason]
              properties:
                confirm: {type: boolean, enum: [true]}
                reason: {type: string, minLength: 1}
      responses:
        "202": {description: Requested, content: {application/json: {schema: {$ref: "#/components/schemas/AccountDeletion"}}}}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    delete:
      operationId: cancelAccountDeletion
      tags: [account]
      description: >-
        Withdraws a pending request. It carries no recent-sign-in gate, because
        it only ever prevents an irreversible action.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      responses:
        "200": {description: Cancelled, content: {application/json: {schema: {$ref: "#/components/schemas/AccountDeletion"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/account/shop/products:
    get:
      operationId: listAccountShopProducts
      tags: [account]
      description: >-
        The digital-goods catalogue. No price is quoted here: a quote is a
        promise with an expiry attached, and issuing one per row would fill a
        page with promises that start expiring while it is being read. A product
        with `priceKnown: false` has no published price and is priced when it is
        opened.
      parameters:
        - {in: query, name: locale, schema: {type: string, enum: [ru, en]}}
      responses:
        "200": {description: Catalogue, content: {application/json: {schema: {$ref: "#/components/schemas/AccountShopProductList"}}}}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/account/shop/products/{productID}:
    get:
      operationId: getAccountShopProduct
      tags: [account]
      description: >-
        One product with a live quote. The quote and its expiry are one object,
        so a client cannot read the price without also being handed the moment
        it stops applying.
      parameters:
        - {$ref: "#/components/parameters/AccountProductID"}
        - {in: query, name: locale, schema: {type: string, enum: [ru, en]}}
        - {in: query, name: quantity, schema: {type: integer, minimum: 1, maximum: 10}}
        - {in: query, name: promoCode, schema: {type: string}}
      responses:
        "200": {description: Product and quote, content: {application/json: {schema: {$ref: "#/components/schemas/AccountShopProductDetail"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/account/shop/recipient:
    post:
      operationId: reviewAccountShopRecipient
      tags: [account]
      description: >-
        Normalises a recipient handle and hands it back for confirmation. It
        changes nothing: the review step exists so the customer sees the exact
        string the gateway will be given before anybody is charged, and a step
        that also acted would defeat that. A mistyped username is unrecoverable
        once a gateway has sent the goods.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient]
              properties:
                recipient: {type: string}
                productId: {type: string, format: uuid}
      responses:
        "200":
          description: Normalised recipient
          content:
            application/json:
              schema:
                type: object
                required: [recipient, checked]
                properties:
                  recipient: {type: string, description: "The exact handle the gateway will be given."}
                  checked: {type: boolean, description: "The provider confirmed the handle exists. False when the adapter cannot check."}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/account/shop/purchase:
    post:
      operationId: purchaseAccountShopProduct
      tags: [account]
      description: >-
        Opens the order for a reviewed recipient against a live quote. The
        displayed quote is echoed back and the server re-quotes before charging,
        refusing with `quote_expired` when the window has passed and
        `price_changed` when the number moved. The recipient must be
        byte-identical to the reviewed form, so a raw `@name` or a pasted link is
        refused rather than silently normalised after confirmation.
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity, recipient, quote]
              properties:
                productId: {type: string, format: uuid}
                quantity: {type: integer, minimum: 1, maximum: 10}
                recipient: {type: string}
                forSelf: {type: boolean, description: "Presentation only. Omniflow stores no Telegram username for a web customer, so this never decides delivery or authorisation."}
                quote: {$ref: "#/components/schemas/AccountShopQuote"}
                promoCode: {type: string}
                useWallet: {type: boolean, default: false, description: "Stated explicitly, so a balance is never spent by omission."}
      responses:
        "201": {description: Order opened, content: {application/json: {schema: {$ref: "#/components/schemas/AccountShopOrder"}}}}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/account/shop/orders:
    get:
      operationId: listAccountShopOrders
      tags: [account]
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {in: query, name: cursorId, schema: {type: string, format: uuid}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100}}
        - {in: query, name: locale, schema: {type: string, enum: [ru, en]}}
      responses:
        "200": {description: Orders, content: {application/json: {schema: {$ref: "#/components/schemas/AccountShopOrderPage"}}}}
        "400": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/account/shop/orders/{orderID}:
    get:
      operationId: getAccountShopOrder
      tags: [account]
      description: >-
        One purchase and its delivery. There is deliberately no retry route: the
        gateway that fronts Fragment honours no idempotency key, so an ambiguous
        delivery is genuinely ambiguous and parks in the operator review queue
        rather than being retried or refunded automatically.
      parameters:
        - {$ref: "#/components/parameters/OrderID"}
        - {in: query, name: locale, schema: {type: string, enum: [ru, en]}}
      responses:
        "200": {description: Order, content: {application/json: {schema: {$ref: "#/components/schemas/AccountShopOrder"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/account/support/limits:
    get:
      operationId: getAccountSupportLimits
      tags: [account]
      description: >-
        The attachment rules and the open-conversation quota, so the panel can
        state them before an upload rather than only after one is refused.
      responses:
        "200": {description: Limits, content: {application/json: {schema: {$ref: "#/components/schemas/AccountSupportLimits"}}}}
  /v1/account/support/tickets:
    get:
      operationId: listAccountSupportTickets
      tags: [account]
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200": {description: Conversations, content: {application/json: {schema: {$ref: "#/components/schemas/AccountTicketPage"}}}}
        "400": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createAccountSupportTicket
      tags: [account]
      description: >-
        Opens a conversation. The number a customer may hold open at once is
        bounded, so a loop in a client cannot fill the operator queue faster
        than people can empty it.
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/IdempotencyKeyOptional"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, message]
              properties:
                subject: {type: string, minLength: 1}
                message: {type: string, minLength: 1}
      responses:
        "201": {description: Opened, content: {application/json: {schema: {$ref: "#/components/schemas/AccountTicket"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/account/support/tickets/{ticketID}:
    get:
      operationId: getAccountSupportTicket
      tags: [account]
      description: >-
        The conversation as the customer sees it. Internal operator notes live
        in their own table and no query on this surface touches it.
      parameters: [{$ref: "#/components/parameters/AccountTicketID"}]
      responses:
        "200": {description: Conversation, content: {application/json: {schema: {$ref: "#/components/schemas/AccountConversation"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/account/support/tickets/{ticketID}/messages:
    post:
      operationId: replyToAccountSupportTicket
      tags: [account]
      parameters:
        - {$ref: "#/components/parameters/AccountTicketID"}
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/IdempotencyKeyOptional"}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [message], properties: {message: {type: string, minLength: 1}}}}}}
      responses:
        "201": {description: Sent, content: {application/json: {schema: {$ref: "#/components/schemas/AccountConversation"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/account/support/tickets/{ticketID}/read:
    post:
      operationId: markAccountSupportTicketRead
      tags: [account]
      description: >-
        Read state is a property of the message, not of the surface it was read
        on. A reply opened here stops being unread in Telegram too, because both
        surfaces stamp the same column.
      parameters:
        - {$ref: "#/components/parameters/AccountTicketID"}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "200": {description: Marked read, content: {application/json: {schema: {$ref: "#/components/schemas/AccountTicket"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/account/support/tickets/{ticketID}/close:
    post:
      operationId: closeAccountSupportTicket
      tags: [account]
      parameters:
        - {$ref: "#/components/parameters/AccountTicketID"}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "200": {description: Closed, content: {application/json: {schema: {$ref: "#/components/schemas/AccountTicket"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/account/support/tickets/{ticketID}/reopen:
    post:
      operationId: reopenAccountSupportTicket
      tags: [account]
      parameters:
        - {$ref: "#/components/parameters/AccountTicketID"}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "200": {description: Reopened, content: {application/json: {schema: {$ref: "#/components/schemas/AccountTicket"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/account/support/tickets/{ticketID}/attachments:
    post:
      operationId: attachToAccountSupportTicket
      tags: [account]
      description: >-
        Uploads one file. The accepted media types are an allowlist, so an
        unknown type is refused rather than guessed at.
      parameters:
        - {$ref: "#/components/parameters/AccountTicketID"}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                message: {type: string}
      responses:
        "201": {description: Attached, content: {application/json: {schema: {$ref: "#/components/schemas/AccountConversation"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "415": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/account/support/attachments/{attachmentID}:
    get:
      operationId: downloadAccountSupportAttachment
      tags: [account]
      description: >-
        Serves a file the calling customer's own conversation carries. A file
        attached in Telegram is not stored here and answers `attachment_remote`
        instead, because offering a download that cannot work is worse than
        saying where the file actually lives.
      parameters: [{in: path, name: attachmentID, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: File, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/account/news:
    get:
      operationId: listAccountNews
      tags: [account]
      parameters:
        - {in: query, name: locale, schema: {type: string, enum: [ru, en]}}
        - {$ref: "#/components/parameters/Cursor"}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 50}}
      responses:
        "200": {description: Announcements, content: {application/json: {schema: {$ref: "#/components/schemas/AccountNewsPage"}}}}
        "400": {$ref: "#/components/responses/Problem"}
  /v1/account/news/{postID}/read:
    post:
      operationId: markAccountNewsRead
      tags: [account]
      parameters:
        - {in: path, name: postID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204": {description: Marked read}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/account/orders/{orderID}/attribution:
    post:
      operationId: recordAccountOrderAttribution
      tags: [account]
      description: >-
        Records where one of the caller's own orders came from, for the
        operator's own advertising measurement.

        A separate call rather than a field on the checkout: a checkout is
        created from the bot as well as from the browser, and the bot has no URL
        to have carried anything. The storefront sends this only when the
        visitor agreed to measurement.

        An order that is not the caller's answers 404, the same as one that does
        not exist — a different answer would confirm that somebody else's order
        exists.

        Attribution hangs off the order rather than the customer. An order is a
        conversion with an amount and a date; a click identifier held against a
        person for the life of their account is a profile, which none of this
        needs.
      parameters:
        - {in: path, name: orderID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AccountAttributionInput"}
      responses:
        "204": {description: Recorded}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/account/notifications:
    get:
      operationId: listAccountNotifications
      tags: [account]
      description: >-
        What this customer was actually sent, newest first.

        The preferences screen says what should arrive; this says what did. A
        status other than `sent` carries a `reason`, and the ones an
        installation produces on purpose — `quiet_hours`, `frequency_cap`,
        `no_consent` — tell the customer their own setting held a message back,
        which is something they can act on.

        Scoped to the session's own account. There is no path parameter, because
        there is no reason a customer would read somebody else's history.
      parameters:
        - {in: query, name: limit, schema: {type: integer, format: int32, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AccountDelivery"}}
        "401": {$ref: "#/components/responses/Problem"}
  /v1/account/preferences:
    get:
      operationId: getAccountPreferences
      tags: [account]
      description: >-
        Notification choices, marketing consent, contact-channel flags, and any
        suppression. A contact's address is never returned — only whether it is
        verified and what it is used for.
      responses:
        "200": {description: Preferences, content: {application/json: {schema: {$ref: "#/components/schemas/AccountPreferences"}}}}
    patch:
      operationId: updateAccountPreferences
      tags: [account]
      description: >-
        Each field is optional and an absent field is left unchanged, so a
        screen that renders one toggle never has to send back a document it did
        not read. A marketing decision appends a consent record rather than
        overwriting one, because the history of who opted in and when is the
        thing that has to survive.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AccountPreferencesUpdate"}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/AccountPreferences"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/account/preferences/unsubscribe:
    post:
      operationId: unsubscribeAccount
      tags: [account]
      description: >-
        Stops marketing messages. Transactional messages about a payment, an
        expiry, or a support reply continue, because they are the ones a
        customer needs in order to keep using what they bought.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      responses:
        "200": {description: Unsubscribed, content: {application/json: {schema: {$ref: "#/components/schemas/AccountPreferences"}}}}
  /v1/panel/settings/customer-oidc:
    get:
      operationId: listPanelCustomerOidcProviders
      tags: [panel]
      description: >-
        Requires settings.read. The customer panel's sign-in providers. The
        client secret is never returned; `hasClientSecret` says whether one is
        held.
      responses:
        "200": {description: Providers, content: {application/json: {schema: {$ref: "#/components/schemas/CustomerOidcProviderList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
    put:
      operationId: savePanelCustomerOidcProvider
      tags: [panel]
      description: >-
        Requires settings.write. Creating or updating a provider. Disabling one
        also ends the sessions it established, because a provider that is off
        while its access remains open is not off.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CustomerOidcProviderInput"}}}}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/CustomerOidcProvider"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/customer-oidc/presets:
    get:
      operationId: listPanelCustomerOidcPresets
      tags: [panel]
      description: >-
        Requires settings.read. Shipped starting points for well-known
        providers. A preset is data that prefills the form; nothing downstream
        branches on which one a provider came from.
      responses:
        "200": {description: Presets, content: {application/json: {schema: {$ref: "#/components/schemas/CustomerOidcPresetList"}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/panel/settings/customer-oidc/{slug}:
    delete:
      operationId: deletePanelCustomerOidcProvider
      tags: [panel]
      description: >-
        Requires settings.write. Removes a provider and ends its sessions. The
        linked identities are kept: deleting them would silently take a sign-in
        method away from customers who may have no other one.
      parameters:
        - {$ref: "#/components/parameters/OidcSlug"}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204": {description: Removed}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/telemetry/events:
    post:
      operationId: collectTelemetryEvent
      tags: [telemetry]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TelemetryEvent"}}}}
      responses:
        "202": {description: Event accepted}
        "400": {$ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    operatorToken: {type: http, scheme: bearer}
    # The panel authenticates with a __Host-prefixed, HttpOnly session cookie.
    # It is declared so generated clients send credentials; the CSRF token is a
    # separate required header on every unsafe method.
    panelSession: {type: apiKey, in: cookie, name: __Host-omniflow_admin}
    # The customer panel authenticates with its own __Host-prefixed cookie, so
    # the two panels can be open in one browser without either replacing the
    # other, and a customer credential can never satisfy an operator route.
    accountSession: {type: apiKey, in: cookie, name: __Host-omniflow_account}
  parameters:
    ReportSince:
      in: query
      name: since
      schema: {type: string, format: date-time}
      description: "Start of the period, inclusive. Defaults to thirty days before `until`."
    ReportUntil:
      in: query
      name: until
      schema: {type: string, format: date-time}
      description: "End of the period, exclusive. Defaults to now."
    ReportTimezone:
      in: query
      name: timezone
      schema: {type: string, default: UTC}
      description: >-
        The zone the day boundaries are computed in. "Sales on the third" means
        the operator's third, and a report bucketed in UTC puts an evening sale
        several hours east on the wrong day.
    ReportCurrency:
      in: query
      name: currency
      schema: {type: string}
      description: "ISO currency to restrict the report to. Omit for every currency."
    AdminID: {in: path, name: adminID, required: true, schema: {type: string, format: uuid}}
    Cursor: {in: query, name: cursor, schema: {type: string, description: "Opaque keyset cursor from the previous page."}}
    CSRFToken:
      in: header
      name: X-CSRF-Token
      required: true
      description: Echoes the token from the current session. Required on every unsafe method.
      schema: {type: string}
    CustomerID: {in: path, name: customerID, required: true, schema: {type: string, format: uuid}}
    AccountSubscriptionID: {in: path, name: subscriptionID, required: true, schema: {type: string, format: uuid}}
    OidcSlug: {in: path, name: slug, required: true, schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]$"}}
    AIProviderSlug: {in: path, name: slug, required: true, schema: {type: string, pattern: "^[a-z0-9][a-z0-9_-]{1,40}$"}}
    PlanID: {in: path, name: planID, required: true, schema: {type: string, format: uuid}}
    OrderID: {in: path, name: orderID, required: true, schema: {type: string, format: uuid}}
    PaymentID: {in: path, name: paymentID, required: true, schema: {type: string, format: uuid}}
    ImportID: {in: path, name: importID, required: true, schema: {type: string, format: uuid}}
    EntitlementID: {in: path, name: entitlementID, required: true, schema: {type: string, format: uuid}}
    JobID: {in: path, name: jobID, required: true, schema: {type: integer, format: int64}}
    IdempotencyKey: {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
    IdempotencyKeyOptional:
      in: header
      name: Idempotency-Key
      required: false
      description: >-
        Optional here. Supplying one makes a repeated submission resolve to the
        record already created instead of a second one.
      schema: {type: string, minLength: 8, maxLength: 128}
    AccountProductID: {in: path, name: productID, required: true, schema: {type: string, format: uuid}}
    AccountTicketID: {in: path, name: ticketID, required: true, schema: {type: string, format: uuid}}
    PageSize: {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
    OperatorReason:
      in: header
      name: X-Operator-Reason
      required: true
      description: >-
        Why the change is being made. Carried as a header because almost every
        operations mutation needs one; the API refuses a change that requires a
        reason and did not get one.
      schema: {type: string, minLength: 1, maxLength: 400}
  requestBodies:
    Plan: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PlanInput"}}}}
    PlanVersion: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PlanVersionInput"}}}}
  schemas:
    Health:
      type: object
      required: [status, version]
      properties: {status: {type: string}, version: {type: string}}
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: {type: string, enum: [ready, degraded]}
        checks:
          type: array
          items: {$ref: "#/components/schemas/DependencyCheck"}
    DependencyCheck:
      type: object
      required: [name, healthy, checkedAt, latencyMs]
      properties:
        name: {type: string, description: "Dependency name, such as postgres, valkey, or remnawave."}
        healthy: {type: boolean}
        error: {type: string, enum: [timeout, unavailable], description: "Stable classification; never the underlying driver message."}
        checkedAt: {type: string, format: date-time}
        latencyMs: {type: integer, format: int64}
        consecutiveFailures: {type: integer}
    Job:
      type: object
      required: [id, kind, queue, state, attempt, maxAttempts, createdAt]
      properties:
        id: {type: integer, format: int64}
        kind: {type: string}
        queue: {type: string}
        state: {type: string}
        attempt: {type: integer}
        maxAttempts: {type: integer}
        errorCount: {type: integer}
        lastError: {type: string, description: "Redacted error text from the most recent attempt."}
        createdAt: {type: string, format: date-time}
        attemptedAt: {type: string, format: date-time}
        finalizedAt: {type: string, format: date-time}
    JobList:
      type: object
      required: [state, items]
      properties:
        state: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/Job"}}
    WebhookEvent:
      type: object
      required: [id, provider, providerEventId, signatureValid, status, receivedAt]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        providerEventId: {type: string}
        signatureValid: {type: boolean}
        status: {type: string, enum: [received, processed, ignored, failed]}
        errorCode: {type: string, nullable: true}
        receivedAt: {type: string, format: date-time}
        processedAt: {type: string, format: date-time, nullable: true}
    WebhookEventList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/WebhookEvent"}}}
    OutboxStatus:
      type: object
      required: [pendingCount, oldestAgeSeconds]
      properties:
        pendingCount: {type: integer}
        oldestAgeSeconds: {type: integer, format: int64}
    Backup:
      type: object
      required: [id, kind, status, fileName, sizeBytes, encrypted, startedAt, retainUntil]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [scheduled, manual]}
        status: {type: string, enum: [running, completed, failed, pruned]}
        fileName: {type: string}
        sizeBytes: {type: integer, format: int64}
        encrypted: {type: boolean}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time, nullable: true}
        verifiedAt: {type: string, format: date-time, nullable: true}
        retainUntil: {type: string, format: date-time}
        errorCode: {type: string, nullable: true}
    BackupList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Backup"}}}
    Maintenance:
      type: object
      required: [active, source, reason]
      properties:
        active: {type: boolean}
        source: {type: string, enum: [manual, remnawave, database, valkey]}
        reason: {type: string}
        noticeRu: {type: string}
        noticeEn: {type: string}
        activatedAt: {type: string, format: date-time}
        expectedReturnAt: {type: string, format: date-time}
    MaintenanceInput:
      type: object
      required: [active, operatorId]
      properties:
        active: {type: boolean}
        operatorId: {type: string, minLength: 1}
        reason: {type: string, maxLength: 200}
        noticeRu: {type: string, maxLength: 1000, description: "Customer-facing Russian notice. Empty falls back to the built-in copy."}
        noticeEn: {type: string, maxLength: 1000}
        expectedReturnAt: {type: string, format: date-time, nullable: true}
    Money:
      type: object
      required: [amountMinor, currency]
      properties: {amountMinor: {type: integer, format: int64, minimum: 0}, currency: {type: string, pattern: "^[A-Z]{3}$"}}
    PlanInput:
      type: object
      required: [code, kind, localizations, version]
      properties:
        code: {type: string, pattern: "^[a-z][a-z0-9_-]{1,63}$"}
        kind: {type: string, enum: [trial, one_time, recurring, free, manual]}
        visible: {type: boolean, default: false}
        sortOrder: {type: integer}
        localizations:
          type: object
          additionalProperties: {$ref: "#/components/schemas/Localization"}
        version: {$ref: "#/components/schemas/PlanVersionInput"}
    Localization:
      type: object
      required: [name]
      properties: {name: {type: string, maxLength: 120}, description: {type: string, maxLength: 2000}}
    PlanVersionInput:
      type: object
      required: [billingPeriod, durationSeconds, upgradePolicy, downgradePolicy, cancellationPolicy, prices]
      properties:
        billingPeriod: {type: string, enum: [none, day, week, month, quarter, half_year, year, custom]}
        durationSeconds: {type: integer, format: int64, minimum: 1}
        trafficAllowanceBytes: {type: integer, format: int64, minimum: 0, nullable: true}
        deviceLimit: {type: integer, minimum: 0, nullable: true}
        squadIDs: {type: array, items: {type: string, format: uuid}}
        upgradePolicy: {type: string, enum: [forbid, replace, extend]}
        downgradePolicy: {type: string, enum: [forbid, immediate, at_expiry]}
        cancellationPolicy: {type: string, enum: [forbid, immediate, at_expiry]}
        recurringCapable: {type: boolean}
        gracePeriodSeconds: {type: integer, format: int64, minimum: 0, default: 0, description: Access retained after expiry so a customer can still renew}
        trialEligibility: {type: string, enum: [new_customer, never_trialled, any], default: new_customer, description: Who may activate this version when the plan kind is trial}
        prices: {type: array, minItems: 1, items: {$ref: "#/components/schemas/Money"}}
    PlanMutation:
      type: object
      properties: {id: {type: string, format: uuid}, code: {type: string}, kind: {type: string}, versionId: {type: string, format: uuid}, version: {type: integer}}
    PlanList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {type: object, additionalProperties: true}}}
    PromotionInput:
      type: object
      required: [code, kind, value, perCustomerLimit, active, codes]
      properties:
        code: {type: string}
        kind: {type: string, enum: [percent, fixed]}
        value: {type: integer, format: int64, minimum: 1}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        startsAt: {type: string, format: date-time, nullable: true}
        endsAt: {type: string, format: date-time, nullable: true}
        redemptionLimit: {type: integer, minimum: 1, nullable: true}
        perCustomerLimit: {type: integer, minimum: 1}
        eligibility: {type: object, additionalProperties: true}
        active: {type: boolean}
        planIDs: {type: array, items: {type: string, format: uuid}}
        codes: {type: array, items: {type: string}}
    Promotion: {type: object, properties: {id: {type: string, format: uuid}, code: {type: string}, kind: {type: string}, active: {type: boolean}}}
    CustomerPreferences:
      type: object
      required: [locale, timezone]
      properties: {locale: {type: string, enum: [ru, en]}, timezone: {type: string}}
    Customer:
      type: object
      properties: {id: {type: string, format: uuid}, status: {type: string, enum: [active, suspended, deleted]}, locale: {type: string}, timezone: {type: string}, suspendedAt: {type: string, format: date-time, nullable: true}, deletedAt: {type: string, format: date-time, nullable: true}, anonymizedAt: {type: string, format: date-time, nullable: true}, retentionUntil: {type: string, format: date-time, nullable: true}}
    IdentityInput:
      type: object
      required: [provider, subject, verifiedAt]
      properties: {provider: {type: string}, subject: {type: string}, verifiedAt: {type: string, format: date-time}, metadata: {type: object, additionalProperties: true}}
    ContactInput:
      type: object
      required: [kind, value, transactionalEnabled, marketingEnabled]
      properties: {kind: {type: string, enum: [email, phone, telegram]}, value: {type: string}, verifiedAt: {type: string, format: date-time, nullable: true}, transactionalEnabled: {type: boolean}, marketingEnabled: {type: boolean}}
    ConsentInput:
      type: object
      required: [purpose, granted, policyVersion, source]
      properties: {purpose: {type: string, enum: [terms, privacy, marketing, profiling]}, granted: {type: boolean}, policyVersion: {type: string}, source: {type: string}}
    LifecycleInput:
      type: object
      required: [action, reason, actorType]
      properties: {action: {type: string, enum: [suspend, restore, delete, anonymize]}, reason: {type: string}, actorType: {type: string, enum: [customer, operator, system]}, actorID: {type: string}}
    ImportRun:
      type: object
      properties: {id: {type: string, format: uuid}, status: {type: string}, cursor: {type: string, nullable: true}, totalCount: {type: integer}, validCount: {type: integer}, conflictCount: {type: integer}, invalidCount: {type: integer}, startedAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}, completedAt: {type: string, format: date-time, nullable: true}}
    OrderInput:
      type: object
      required: [customerID, planVersionID, currency, operation]
      properties: {customerID: {type: string, format: uuid}, planVersionID: {type: string, format: uuid}, currency: {type: string, pattern: "^[A-Z]{3}$"}, operation: {type: string, enum: [purchase, upgrade, downgrade, extension]}, promoCode: {type: string}}
    Order:
      type: object
      properties: {id: {type: string, format: uuid}, customerId: {type: string, format: uuid}, state: {type: string, enum: [draft, pending, paid, fulfilled, cancelled, expired, partially_refunded, refunded]}, operation: {type: string}, currency: {type: string}, subtotalMinor: {type: integer, format: int64}, discountMinor: {type: integer, format: int64}, walletMinor: {type: integer, format: int64}, externalMinor: {type: integer, format: int64}, paidMinor: {type: integer, format: int64}, refundedMinor: {type: integer, format: int64}, expiresAt: {type: string, format: date-time}, createdAt: {type: string, format: date-time}}
    PaymentProvider: {type: string, enum: [telegram_stars, cryptobot, yookassa, manual]}
    PaymentInput:
      type: object
      required: [provider, description]
      properties: {provider: {$ref: "#/components/schemas/PaymentProvider"}, description: {type: string}, returnURL: {type: string, format: uri}, receiptMetadata: {type: object, additionalProperties: true}}
    PaymentIntent:
      type: object
      properties: {id: {type: string, format: uuid}, orderId: {type: string, format: uuid}, provider: {$ref: "#/components/schemas/PaymentProvider"}, status: {type: string}, amountMinor: {type: integer, format: int64}, currency: {type: string}, providerReference: {type: string, nullable: true}, checkoutUrl: {type: string, format: uri, nullable: true}}
    RefundInput:
      allOf:
        - {$ref: "#/components/schemas/Money"}
        - {type: object, required: [reason], properties: {reason: {type: string}, receiptMetadata: {type: object, additionalProperties: true}}}
    Refund:
      allOf:
        - {$ref: "#/components/schemas/Money"}
        - {type: object, properties: {id: {type: string, format: uuid}, status: {type: string}, providerReference: {type: string, nullable: true}}}
    ManualDecision: {type: object, required: [approved, operatorID, reason], properties: {approved: {type: boolean}, operatorID: {type: string}, reason: {type: string}}}
    WalletAdjustment:
      type: object
      required: [amountMinor, currency, type, reference, reason, operatorID]
      properties: {amountMinor: {type: integer, format: int64, not: {enum: [0]}}, currency: {type: string, pattern: "^[A-Z]{3}$"}, type: {type: string, enum: [credit, debit, correction, expiration, referral_reward]}, reference: {type: string}, reason: {type: string}, operatorID: {type: string}}
    FulfillmentDrift:
      type: object
      properties: {id: {type: string, format: uuid}, entitlementId: {type: string, format: uuid}, kind: {type: string, enum: [missing_remote, external_edit, status, expiry, traffic, device_limit, squads]}, expected: {type: object, additionalProperties: true}, observed: {type: object, additionalProperties: true}, detectedAt: {type: string, format: date-time}}
    FulfillmentOperationInput:
      type: object
      required: [operation]
      properties:
        operation: {type: string, enum: [create, extend, enable, disable, reset_traffic, set_limits, set_squads, reconcile]}
        correlationId: {type: string}
        effectiveAt: {type: string, format: date-time, nullable: true}
        endsAt: {type: string, format: date-time, nullable: true}
        trafficAllowanceBytes: {type: integer, format: int64, minimum: 0, nullable: true}
        deviceLimit: {type: integer, minimum: 0, nullable: true}
        squadIDs: {type: array, items: {type: string, format: uuid}}
    FulfillmentOperation:
      type: object
      properties: {id: {type: string, format: uuid}, entitlementId: {type: string, format: uuid}, operation: {type: string}, status: {type: string}}
    TelemetryEvent:
      type: object
      additionalProperties: false
      required: [schema, installation_id, name, version, service, os, architecture, occurred_at]
      properties:
        schema: {type: integer, enum: [1]}
        installation_id: {type: string, minLength: 16, maxLength: 64}
        name: {type: string, enum: [installation.heartbeat, feature.usage]}
        version: {type: string, maxLength: 32}
        service: {type: string, enum: [api, bot, worker]}
        os: {type: string, maxLength: 32}
        architecture: {type: string, maxLength: 32}
        features: {type: object, additionalProperties: {type: boolean}}
        counters: {type: object, additionalProperties: {type: integer, minimum: 0}}
        occurred_at: {type: string, format: date-time}
    Problem:
      type: object
      required: [type, title, status]
      properties: {type: {type: string, format: uri}, title: {type: string}, status: {type: integer}, detail: {type: string}, request_id: {type: string}}

    # -------------------------------------------------------------------------
    # Operator panel (v0.6)
    # -------------------------------------------------------------------------
    AdminRole:
      type: string
      enum: [owner, administrator, support, finance, marketing, auditor]
    AdminStatus: {type: string, enum: [active, suspended, disabled]}
    AdminLocale: {type: string, enum: [en, ru]}
    AuditCategory:
      type: string
      enum: [authentication, authorization, configuration, customer, financial, support, marketing, system]
    AuditOutcome: {type: string, enum: [success, failure, denied]}

    BootstrapStatus:
      type: object
      required: [setupRequired]
      properties: {setupRequired: {type: boolean}}
    BootstrapInput:
      type: object
      additionalProperties: false
      required: [setupToken, email, displayName, password]
      properties:
        setupToken: {type: string}
        email: {type: string, format: email}
        displayName: {type: string, minLength: 1, maxLength: 80}
        password: {type: string, minLength: 12, maxLength: 256}
        locale: {$ref: "#/components/schemas/AdminLocale"}

    AdminAccount:
      type: object
      required: [id, email, displayName, status, locale, timezone, roles, totpEnabled, createdAt]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        displayName: {type: string}
        status: {$ref: "#/components/schemas/AdminStatus"}
        locale: {$ref: "#/components/schemas/AdminLocale"}
        timezone: {type: string}
        roles: {type: array, items: {$ref: "#/components/schemas/AdminRole"}}
        totpEnabled: {type: boolean}
        lastLoginAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    AdminAccountPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AdminAccount"}}
        nextCursor: {type: string, description: "Empty when this is the last page."}
    AdminAccountInput:
      type: object
      additionalProperties: false
      required: [email, displayName, password, roles]
      properties:
        email: {type: string, format: email}
        displayName: {type: string, minLength: 1, maxLength: 80}
        password: {type: string, minLength: 12, maxLength: 256}
        locale: {$ref: "#/components/schemas/AdminLocale"}
        timezone: {type: string}
        roles: {type: array, items: {$ref: "#/components/schemas/AdminRole"}}
    AdminStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties: {status: {$ref: "#/components/schemas/AdminStatus"}}
    RolesInput:
      type: object
      additionalProperties: false
      required: [roles]
      properties: {roles: {type: array, items: {$ref: "#/components/schemas/AdminRole"}}}

    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties: {email: {type: string, format: email}, password: {type: string}}
    LoginResult:
      type: object
      required: [csrfToken, expiresAt, account]
      properties:
        challengeRequired: {type: boolean, description: "When true, the session authorizes nothing until the second factor passes."}
        csrfToken: {type: string}
        expiresAt: {type: string, format: date-time}
        account: {$ref: "#/components/schemas/AdminAccount"}
    ChallengeInput:
      type: object
      additionalProperties: false
      required: [code]
      properties: {code: {type: string, description: "A TOTP code or a single-use recovery code."}}
    PanelSession:
      type: object
      required: [account, permissions, csrfToken, sessionId, expiresAt]
      properties:
        account: {$ref: "#/components/schemas/AdminAccount"}
        permissions:
          type: array
          items: {type: string}
          description: "Effective permissions. The panel renders from these; the API enforces the same set."
        csrfToken: {type: string}
        sessionId: {type: string, format: uuid}
        expiresAt: {type: string, format: date-time}
        remainingRecoveryCodes: {type: integer, minimum: 0}

    ProfileInput:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 80}
        locale: {$ref: "#/components/schemas/AdminLocale"}
        timezone: {type: string}
    PasswordChangeInput:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties: {currentPassword: {type: string}, newPassword: {type: string, minLength: 12, maxLength: 256}}
    PasswordConfirmInput:
      type: object
      additionalProperties: false
      required: [password]
      properties: {password: {type: string}}
    PasswordResetRequestInput:
      type: object
      additionalProperties: false
      required: [email]
      properties: {email: {type: string, format: email}}
    PasswordResetCompleteInput:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties: {token: {type: string}, newPassword: {type: string, minLength: 12, maxLength: 256}}

    AdminSession:
      type: object
      required: [id, current, createdAt, lastSeenAt, expiresAt, methods]
      properties:
        id: {type: string, format: uuid}
        current: {type: boolean}
        ip: {type: string}
        userAgent: {type: string}
        createdAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        methods: {type: array, items: {type: string}, description: "Authentication methods this session completed."}
    SessionList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/AdminSession"}}}

    TotpEnrolment:
      type: object
      required: [secret, uri]
      properties:
        secret: {type: string, description: "Base32 shared secret, returned only during enrolment."}
        uri: {type: string, description: "otpauth:// URI for an authenticator app."}
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items: {type: string}
          description: "Returned exactly once. Only digests are stored."

    Passkey:
      type: object
      required: [id, label, createdAt, discoverable]
      description: >-
        One registered credential. It carries neither the public key nor the
        credential identifier: neither is secret, and neither is any use to an
        operator reading a list.
      properties:
        id: {type: string, format: uuid}
        label: {type: string, maxLength: 60, description: "Chosen by the owner, to tell one device from another."}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time, description: "Absent until the key has signed in."}
