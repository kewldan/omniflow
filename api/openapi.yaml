        planVersion: {type: integer}
        billingPeriod: {type: string}
        quantity: {type: integer, minimum: 1, maximum: 10000}
        unitPriceMinor: {type: integer, format: int64, description: "The agreed wholesale price, recorded and never charged. The money changed hands outside Omniflow."}
        currency: {type: string}
        note: {type: string}
