        text: {type: string}
        href: {type: string}
    PageBlock:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [heading, paragraph, list]}
        spans: {type: array, items: {$ref: "#/components/schemas/PageSpan"}}
        items:
          type: array
          items: {type: array, items: {$ref: "#/components/schemas/PageSpan"}}
        ordered: {type: boolean}
    PageDocument:
      type: object
      required: [blocks]
      description: >-
        A parsed document. It is deliberately not HTML and deliberately not the
